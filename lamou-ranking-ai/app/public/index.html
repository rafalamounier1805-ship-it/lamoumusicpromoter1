<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#08111f" />
  <meta name="description" content="LAMOU Ranking AI — análise musical técnica, mercadológica e transparente." />
  <title>LAMOU Ranking AI</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/stage2.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand-wrap">
        <div class="brand-mark" aria-hidden="true"><span>L</span></div>
        <div class="brand-copy"><b>LAMOU</b><span>Ranking AI</span></div>
        <button id="sidebar-close" class="icon-btn mobile-only" aria-label="Fechar menu">×</button>
      </div>

      <div class="mode-switch" role="group" aria-label="Modo de visualização">
        <button data-mode="simple" class="active">Simples</button>
        <button data-mode="pro">Profissional</button>
      </div>

      <nav class="nav" aria-label="Navegação principal">
        <button data-view="home" class="active"><span class="nav-icon">⌂</span><span>Início</span></button>
        <button data-view="songs"><span class="nav-icon">♫</span><span>Músicas</span></button>
        <button data-view="ranking"><span class="nav-icon">🏆</span><span>Ranking</span></button>
        <button data-view="analyze"><span class="nav-icon">◉</span><span>Analisar</span></button>
        <button data-view="profile"><span class="nav-icon">◎</span><span>Perfil</span></button>
        <button data-view="opportunities"><span class="nav-icon">◇</span><span>Oportunidades</span></button>
        <button data-view="plan"><span class="nav-icon">✓</span><span>Plano de ação</span></button>
        <button data-view="history"><span class="nav-icon">↺</span><span>Histórico</span></button>
        <button data-view="method"><span class="nav-icon">ⓘ</span><span>Metodologia</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div id="cloud-status" class="status-line"><span class="status-dot"></span><span>Verificando nuvem…</span></div>
        <div class="engine-tag">Engine v1.1 · Etapa 1</div>
      </div>
    </aside>

    <div id="scrim" class="scrim"></div>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menu-btn" class="icon-btn mobile-only" aria-label="Abrir menu">☰</button>
          <div>
            <div id="page-kicker" class="page-kicker">VISTORIA INICIAL</div>
            <h1 id="page-title">Visão geral</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="audit-chip"><span class="pulse"></span><span>Transparência ativa</span></div>
          <button id="global-compare" class="btn primary">Iniciar comparação</button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Navegação rápida">
    <button data-view="home"><span>⌂</span><small>Início</small></button>
    <button data-view="songs"><span>♫</span><small>Músicas</small></button>
    <button data-view="ranking"><span>🏆</span><small>Ranking</small></button>
    <button data-view="analyze"><span>◉</span><small>Analisar</small></button>
    <button data-view="profile"><span>◎</span><small>Perfil</small></button>
  </nav>

  <dialog id="info-dialog" class="dialog">
    <div class="dialog-card">
      <button id="dialog-close" class="dialog-close" aria-label="Fechar">×</button>
      <div id="dialog-body"></div>
    </div>
  </dialog>

  <input id="audio-input" type="file" accept="audio/*" hidden />
  <input id="history-import" type="file" accept="application/json" hidden />
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/stage2.js"></script>
</body>
</html>
