<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5c5ff2">
<meta name="description" content="LAMOU Music Promoter — inteligência e divulgação musical.">
<title>LAMOU Music Promoter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Sem tela de login: o app abre direto. -->
<div id="loginShell" class="hidden"><div id="authView"></div></div>

<div id="appShell" class="app-shell hidden">
  <header class="app-header">
    <button class="brand-button" onclick="Lamou.go('home')"><img src="icon-192.svg" alt=""><span><b>LAMOU</b><small id="headerUser">LAMOU</small></span></button>
    <div class="header-actions">
      <button class="soft-button" onclick="LamouUserManager.menu()" aria-label="Menu do LAMOU">⚙️ <span>Menu</span></button>
    </div>
  </header>

  <main id="appRoot"></main>

  <nav id="bottomNav" class="bottom-nav hidden" aria-label="Navegação principal">
    <button data-view="new" onclick="Lamou.go('new')">＋<span>Nova música</span></button>
    <button data-view="history" onclick="Lamou.go('history')">◷<span>Histórico</span></button>
    <button data-view="radar" onclick="Lamou.go('radar')">◎<span>Radar</span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
/* Entrada direta com múltiplos usuários locais. Cada usuário mantém seu próprio perfil/histórico/radar. */
(() => {
  const STORE='lamou_v10_db';
  const SESSION='lamou_v10_session';
  const DEFAULT_CONNECTIONS={spotify:'red',instagram:'red',tiktok:'red',youtube:'red',facebook:'red',threads:'red',amuse:'yellow'};
  const read=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch(_){return {}}};
  const write=d=>localStorage.setItem(STORE,JSON.stringify(d));
  const workspaceFrom=d=>({profile:d.profile||{},connections:d.connections||DEFAULT_CONNECTIONS,history:Array.isArray(d.history)?d.history:[],draft:d.draft||null,radar:Array.isArray(d.radar)?d.radar:[]});
  const blankWorkspace=a=>({profile:{displayName:a.name||'LAMOU',email:a.email||'',adCode:'',artistUrl:'',artistName:'',artistImage:'',artistStats:null,localAI:false},connections:{...DEFAULT_CONNECTIONS},history:[],draft:null,radar:[]});
  function archiveCurrent(d){if(d.current&&d.accounts?.[d.current])d.accounts[d.current].workspace=workspaceFrom(d)}
  function loadWorkspace(d,key){const a=d.accounts[key],w=a.workspace||blankWorkspace(a);d.profile=w.profile;d.connections=w.connections;d.history=w.history;d.draft=w.draft;d.radar=w.radar;d.current=key;write(d);localStorage.setItem(SESSION,key);sessionStorage.setItem(SESSION,key)}

  let data=read();
  if(!data.accounts||typeof data.accounts!=='object')data.accounts={};
  if(!Object.keys(data.accounts).length)data.accounts['lamou-local']={name:'LAMOU',email:'',createdAt:new Date().toISOString(),localOnly:true};

  const keys=Object.keys(data.accounts);
  const priorKeys=keys.filter(k=>k!=='lamou-local');
  let current=(data.current&&data.accounts[data.current])?data.current:(localStorage.getItem(SESSION)&&data.accounts[localStorage.getItem(SESSION)]?localStorage.getItem(SESSION):keys[0]);
  /* Migração: se a simplificação anterior criou o perfil temporário LAMOU, volta automaticamente ao usuário antigo existente. */
  if(current==='lamou-local'&&priorKeys.length){
    current=priorKeys.find(k=>data.accounts[k]?.backend)||priorKeys.find(k=>data.accounts[k]?.email)||priorKeys[0];
  }
  data.current=current;
  if(data.accounts[current]?.workspace){
    const w=data.accounts[current].workspace;
    data.profile=w.profile||data.profile||{};
    data.connections=w.connections||data.connections||DEFAULT_CONNECTIONS;
    data.history=Array.isArray(w.history)?w.history:(Array.isArray(data.history)?data.history:[]);
    data.draft=w.draft??data.draft??null;
    data.radar=Array.isArray(w.radar)?w.radar:(Array.isArray(data.radar)?data.radar:[]);
  } else {
    data.profile=data.profile||blankWorkspace(data.accounts[current]).profile;
    data.connections=data.connections||{...DEFAULT_CONNECTIONS};
    data.history=Array.isArray(data.history)?data.history:[];
    data.radar=Array.isArray(data.radar)?data.radar:[];
  }
  write(data);localStorage.setItem(SESSION,current);sessionStorage.setItem(SESSION,current);

  const clean=s=>String(s||'').replace(/[&<>\"']/g,'');
  function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)LamouUserManager.close()"><section class="modal">${html}</section></div>`}

  window.LamouUserManager={
    menu(){
      const d=read(),a=d.accounts?.[d.current]||{},c=d.connections||{};
      const connected=Object.values(c).filter(v=>v==='green').length;
      modal(`<div class="modal-head"><div><div class="eyebrow">LAMOU</div><h2>${clean(a.name||d.profile?.displayName||'Usuário')}</h2><p class="sub">${connected} conexão(ões) ativa(s)</p></div><button class="icon-button" onclick="LamouUserManager.close()">×</button></div>
      <div class="mode-grid" style="grid-template-columns:repeat(2,1fr)">
        <button class="choice-card" onclick="LamouUserManager.open()"><span class="choice-icon">👤</span><strong>Usuários</strong><small>Trocar, criar ou editar.</small></button>
        <button class="choice-card" onclick="LamouUserManager.connections()"><span class="choice-icon">🔌</span><strong>Conexões</strong><small>Spotify e demais plataformas.</small></button>
        <button class="choice-card" onclick="LamouInstall.install()"><span class="choice-icon">⬇️</span><strong>Instalar app</strong><small>Adicionar o LAMOU ao celular.</small></button>
        <button class="choice-card" onclick="LamouUserManager.tests()"><span class="choice-icon">🧪</span><strong>Rodar teste</strong><small>Verificar funções do app.</small></button>
      </div>`);
    },
    open(){
      const d=read(),ks=Object.keys(d.accounts||{}),rows=ks.map(k=>{const a=d.accounts[k],on=k===d.current;return `<button class="channel-item ${on?'on':''}" style="grid-template-columns:1fr auto" onclick="LamouUserManager.switchTo('${k}')"><div><b>${clean(a.name||k)}</b><small>${clean(a.email||'')}</small></div><span class="status ${on?'green':'gray'}">${on?'Ativo':'Trocar'}</span></button>`}).join('');
      modal(`<div class="modal-head"><div><div class="eyebrow">USUÁRIOS</div><h2>Escolha o perfil</h2></div><button class="icon-button" onclick="LamouUserManager.close()">×</button></div><div class="channel-list">${rows}</div><div class="row" style="margin-top:14px"><button class="primary-button" onclick="LamouUserManager.create()">＋ Novo usuário</button><button class="ghost-button" onclick="LamouUserManager.edit()">Editar atual</button><button class="ghost-button" onclick="LamouUserManager.remove()">Excluir atual</button></div><div class="notice" style="margin-top:12px">Perfil, conexões, histórico, rascunhos e Radar ficam separados por usuário.</div></section></div>`;
    },
    close(){document.getElementById('modalRoot').innerHTML=''},
    switchTo(key){const d=read();if(!d.accounts?.[key])return;archiveCurrent(d);loadWorkspace(d,key);location.reload()},
    create(){const name=prompt('Nome do novo usuário/artista:');if(!name?.trim())return;const email=(prompt('E-mail (opcional):','')||'').trim();const d=read();archiveCurrent(d);const key='user_'+Date.now().toString(36);d.accounts[key]={name:name.trim(),email,createdAt:new Date().toISOString(),localOnly:true};d.accounts[key].workspace=blankWorkspace(d.accounts[key]);loadWorkspace(d,key);location.reload()},
    edit(){const d=read(),a=d.accounts?.[d.current];if(!a)return;const name=prompt('Nome do usuário/artista:',a.name||'LAMOU');if(!name?.trim())return;const email=prompt('E-mail:',a.email||'');a.name=name.trim();a.email=String(email??a.email??'').trim();d.profile=d.profile||{};d.profile.displayName=a.name;d.profile.email=a.email;write(d);location.reload()},
    remove(){const d=read(),ks=Object.keys(d.accounts||{});if(ks.length<=1){alert('Mantenha pelo menos um usuário no app.');return}const a=d.accounts[d.current];if(!confirm(`Excluir o usuário ${a?.name||''} deste aparelho?`))return;delete d.accounts[d.current];const next=Object.keys(d.accounts)[0];loadWorkspace(d,next);location.reload()},
    connections(){this.close();setTimeout(()=>window.Lamou?.openUser(),0)},
    tests(){this.close();setTimeout(()=>window.Lamou?.runTests(),0)}
  };

  let deferred=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
  window.addEventListener('appinstalled',()=>{deferred=null});
  window.LamouInstall={
    async install(){
      if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true){alert('O LAMOU já está instalado neste aparelho.');return}
      if(deferred){deferred.prompt();await deferred.userChoice.catch(()=>{});deferred=null;return}
      const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
      alert(ios?'No Safari: toque em Compartilhar e depois em “Adicionar à Tela de Início”.':'No Chrome: abra o menu ⋮ e toque em “Instalar app” ou “Adicionar à tela inicial”. Se a opção ainda não apareceu, recarregue a página uma vez.');
    }
  };
})();
</script>
<script src="lamou-v10.js"></script>
</body>
</html>
