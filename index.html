<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5c5ff2">
<meta name="description" content="LAMOU Music Promoter — inteligência e divulgação musical.">
<title>LAMOU Music Promoter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Mantido apenas como alvo interno do código legado. Não há mais tela de login. -->
<div id="loginShell" class="hidden"><div id="authView"></div></div>

<div id="appShell" class="app-shell hidden">
  <header class="app-header">
    <button class="brand-button" onclick="Lamou.go('home')"><img src="icon-192.svg" alt=""><span><b>LAMOU</b><small id="headerUser">LAMOU</small></span></button>
    <div class="header-actions">
      <button class="soft-button" onclick="Lamou.runTests()">🧪 <span>Rodar teste</span></button>
    </div>
  </header>

  <main id="appRoot"></main>

  <nav id="bottomNav" class="bottom-nav hidden" aria-label="Navegação principal">
    <button data-view="new" onclick="Lamou.go('new')">＋<span>Nova música</span></button>
    <button data-view="history" onclick="Lamou.go('history')">◷<span>Histórico</span></button>
    <button data-view="radar" onclick="Lamou.go('radar')">◎<span>Radar</span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
/* Modo simples: entra direto no app, sem cadastro, senha ou sessão de backend. */
(() => {
  const STORE='lamou_v10_db';
  const SESSION='lamou_v10_session';
  const KEY='lamou-local';
  let data={};
  try { data=JSON.parse(localStorage.getItem(STORE)||'{}')||{}; } catch (_) { data={}; }
  if(!data.accounts || typeof data.accounts!=='object') data.accounts={};
  if(!data.accounts[KEY]) data.accounts[KEY]={name:'LAMOU',email:'',createdAt:new Date().toISOString(),localOnly:true};
  data.current=KEY;
  data.profile=data.profile||{};
  if(!data.profile.displayName) data.profile.displayName='LAMOU';
  try {
    localStorage.setItem(STORE,JSON.stringify(data));
    localStorage.setItem(SESSION,KEY);
    sessionStorage.setItem(SESSION,KEY);
  } catch (_) {}
})();
</script>
<script src="lamou-v10.js"></script>
</body>
</html>
