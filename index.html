<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5c5ff2">
<meta name="description" content="LAMOU Music Promoter — divulgação musical profissional e legal.">
<title>LAMOU Music Promoter</title>
<link rel="manifest" href="manifest.webmanifest?v=13">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=13">
<link rel="stylesheet" href="workflow.css?v=13">
<link rel="stylesheet" href="app-core.css?v=13">
</head>
<body>
<div id="loginShell" class="hidden"><div id="authView"></div></div>
<div id="appShell" class="app-shell hidden">
  <header class="app-header">
    <button class="brand-button" onclick="Lamou.go('home')"><img src="icon-192.svg" alt=""><span><b>LAMOU</b><small id="headerUser">LAMOU</small></span></button>
    <div class="header-actions"><button id="lamouMenuBtn" type="button" class="soft-button" aria-label="Abrir menu do LAMOU"><span>Menu</span></button></div>
  </header>
  <main id="appRoot"></main>
  <nav id="bottomNav" class="bottom-nav hidden" aria-label="Navegação principal">
    <button data-view="new" onclick="Lamou.go('new')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path d="M14 7h6"/></svg><span>Nova música</span></button>
    <button data-view="history" onclick="Lamou.go('history')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/><path d="M12 7v5l3 2"/></svg><span>Histórico</span></button>
    <button data-view="results" onclick="Lamou.go('results')"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20V7"/></svg><span>Resultados</span></button>
  </nav>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<script src="app-core.js?v=13"></script>
<script src="integrations-v10.js?v=13"></script>
<script src="runtime-v13.js?v=13"></script>
</body>
</html>
