<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5c5ff2">
<meta name="description" content="LAMOU Music Promoter — inteligência e divulgação musical.">
<title>LAMOU Music Promoter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loginShell" class="login-shell">
  <div class="login-orbit orbit-a"></div><div class="login-orbit orbit-b"></div>
  <section class="login-card">
    <div class="login-brand"><img src="icon-192.svg" alt="LAMOU"><div><b>LAMOU</b><span>Music Promoter</span></div></div>
    <div id="authView"></div>
  </section>
</div>

<div id="appShell" class="app-shell hidden">
  <header class="app-header">
    <button class="brand-button" onclick="Lamou.openUser()"><img src="icon-192.svg" alt=""><span><b>LAMOU</b><small id="headerUser">Usuário</small></span></button>
    <div class="header-actions">
      <button class="soft-button" onclick="Lamou.runTests()">🧪 <span>Rodar teste</span></button>
      <button class="soft-button danger" onclick="Lamou.logout()">Sair</button>
    </div>
  </header>

  <main id="appRoot"></main>

  <nav id="bottomNav" class="bottom-nav hidden" aria-label="Navegação principal">
    <button data-view="new" onclick="Lamou.go('new')">＋<span>Nova música</span></button>
    <button data-view="history" onclick="Lamou.go('history')">◷<span>Histórico</span></button>
    <button data-view="radar" onclick="Lamou.go('radar')">◎<span>Radar</span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<script src="lamou-v10.js"></script>
<script src="auth-backend-v10.js"></script>
</body>
</html>
