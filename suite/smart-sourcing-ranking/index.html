<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#0b2f5b"/><link rel="manifest" href="manifest.json"/><title>Ranking Inteligente — DEMO</title>
<style>
:root{--navy:#0b2f5b;--indigo:#4f46e5;--green:#16a34a;--amber:#d97706;--red:#dc2626;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--border:#dfe5ef;--soft:#eef3f9;--shadow:0 10px 30px rgba(12,35,70,.08);--radius:18px}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:12px 18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--indigo));display:grid;place-items:center;color:#fff;font-weight:900}.badge,.tag{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef4fb;color:var(--navy)}.badge{background:#fff7ed;color:#9a3412}.persona{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px}.persona button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:700;color:var(--muted)}.persona button.active{background:#fff;color:var(--navy)}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 63px)}.side{background:#fff;border-right:1px solid var(--border);padding:18px}.navbtn{width:100%;border:0;background:transparent;text-align:left;padding:11px;border-radius:12px;font-weight:700;color:#4b5563}.navbtn.active,.navbtn:hover{background:#eef4fb;color:var(--navy)}.main{padding:24px;max-width:1250px;width:100%;margin:auto}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.hero h2{font-size:28px;margin:7px 0}.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{display:flex;gap:8px;margin-top:14px}.search input{flex:1;border:1px solid var(--border);border-radius:12px;padding:12px}.primary,.secondary{border:0;border-radius:12px;padding:10px 13px;font-weight:800}.primary{background:var(--navy);color:#fff}.secondary{background:#fff;border:1px solid var(--border);color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.stats strong{font-size:24px;display:block}.section{margin:20px 0 10px;display:flex;justify-content:space-between}.smart{background:#fffbeb;border:1px solid #fcd34d;border-radius:16px;padding:14px;margin:14px 0}.proposal{display:grid;grid-template-columns:60px 1.5fr .7fr .7fr .7fr 110px;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}.score{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:#3730a3;font-weight:900}.fail{opacity:.52}.fail .score{background:#fef2f2;color:#b91c1c}.green{background:#ecfdf5;color:#047857}.red{background:#fef2f2;color:#b91c1c}.purple{background:#eef2ff;color:#4338ca}.timeline{border-left:3px solid #dbe4f0;padding-left:15px}.event{margin:12px 0}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:20px;z-index:60}.modalbox{background:#fff;border-radius:18px;padding:20px;max-width:650px;width:100%;max-height:90vh;overflow:auto}.close{float:right;border:0;background:var(--soft);border-radius:9px;padding:8px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:white;padding:12px 15px;border-radius:12px;opacity:0;transition:.2s}.toast.show{opacity:1}.footer{display:none}@media(max-width:850px){.layout{display:block}.side{display:none}.main{padding:14px 14px 82px}.hero,.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.proposal{grid-template-columns:50px 1fr .8fr}.proposal>div:nth-child(n+4){display:none}.brand small{display:none}.footer{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--border);justify-content:space-around;padding:8px;z-index:40}.footer button{border:0;background:transparent;font-size:11px;font-weight:800;color:#64748b}}
</style></head><body>
<header class="top"><div class="brand"><div class="logo">R</div><div><b>Ranking Inteligente</b><br><small class="muted">nome comercial em definição</small></div><span class="badge">DEMO</span></div><div class="persona"><button id="bBuyer" onclick="persona('buyer')">👤 Comprador</button><button id="bSupplier" onclick="persona('supplier')">🏢 Fornecedor</button></div></header>
<div class="layout"><aside class="side" id="side"></aside><main class="main" id="main"></main></div><nav class="footer" id="footer"></nav><div id="modal"></div><div class="toast" id="toast"></div>
<script>
const D={persona:'buyer',bv:'home',sv:'home',relax:false,v:1,need:'Quero um sofá retrátil cinza para minha sala',contract:null,versions:{local:[{v:1,p:3890,d:1,n:'Proposta inicial'}]}};let s={...D,...JSON.parse(localStorage.getItem('ranking-demo')||'{}')};const base=[{id:'local',n:'Casa & Conforto',t:'Loja física',p:3890,d:1,w:24,r:4.9,b:95,l:1,ok:1,ben:['Retirada hoje','Troca em 6 lojas','Montagem grátis','15% acessórios']},{id:'mega',n:'MegaHome',t:'Omnichannel',p:3720,d:2,w:12,r:4.7,b:72,l:1,ok:1,ben:['Frete grátis','Troca física','5% cashback']},{id:'online',n:'Móveis Online',t:'Loja virtual',p:3450,d:4,w:12,r:4.6,b:45,l:0,ok:1,ben:['Menor preço','Entrega agendada']},{id:'artisan',n:'Ateliê João',t:'Artesão / sob medida',p:4100,d:10,w:24,r:4.8,b:88,l:1,ok:1,ben:['Feito sob medida','Montagem','Ajuste local']},{id:'outlet',n:'Outlet X',t:'Loja virtual',p:3100,d:2,w:6,r:4.2,b:20,l:0,ok:0,ben:['Cupom 8%']}];function save(){localStorage.setItem('ranking-demo',JSON.stringify(s))}function offers(){return base.map(o=>{let a=s.versions[o.id];return a?{...o,p:a.at(-1).p,d:a.at(-1).d}:o})}function rank(){let a=offers(),mi=Math.min(...a.map(x=>x.p)),ma=Math.max(...a.map(x=>x.p));return a.map(o=>{let e=o.ok&&(s.relax||o.d<=2);let ps=100-(o.p-mi)/(ma-mi)*45,ds=Math.max(20,110-o.d*10);let sc=(ps*.30+ds*.20+o.b*.20+(o.r/5*100)*.15+Math.min(100,o.w/24*100)*.15);return{...o,e,sc:e?Math.round(sc*10)/10:0}}).sort((a,b)=>b.sc-a.sc)}function money(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function persona(p){s.persona=p;save();render()}function nav(v){s.persona==='buyer'?s.bv=v:s.sv=v;save();render()}const bn=[['home','⌂ Início'],['create','＋ Criar'],['rank','🏆 Ranking'],['local','📍 Local+'],['history','🕘 Histórico']],sn=[['home','⌂ Início'],['opp','🎯 Oportunidades'],['prop','🤝 Propostas'],['benefits','🎁 Benefícios'],['rep','⭐ Reputação']];function navs(){let a=s.persona==='buyer'?bn:sn,act=s.persona==='buyer'?s.bv:s.sv;side.innerHTML=a.map(x=>`<button class="navbtn ${act===x[0]?'active':''}" onclick="nav('${x[0]}')">${x[1]}</button>`).join('')+`<div class="card" style="box-shadow:none;margin-top:20px;font-size:12px"><b>TESTE/DEMO</b><br><span class="muted">Dados e integrações são simulados; regras e estado funcionam localmente.</span></div>`;footer.innerHTML=a.map(x=>`<button onclick="nav('${x[0]}')">${x[1]}</button>`).join('')}
function buyerHome(){return`<div class="hero"><div class="card"><span class="tag purple">IA explicável</span> <span class="tag green">Local+</span><h2>O que você quer encontrar hoje?</h2><p class="muted">Produto pronto, serviço, negociação ou algo feito para você.</p><div class="search"><input id="need" value="${s.need}"><button class="primary" onclick="start()">Criar ranking</button></div><div class="grid" style="margin-top:12px"><button class="secondary" onclick="nav('create')">🛒 Já existe</button><button class="secondary" onclick="nav('create')">🤝 Negociar</button><button class="secondary" onclick="nav('create')">🛠 Fazer para mim</button></div></div><div class="card"><b>Seu cenário DEMO</b><h3>${s.need}</h3><span class="tag">Critérios v${s.v}</span><p class="muted">${s.relax?'Smart Flex aplicado':'Entrega até 2 dias é obrigatória'}</p><button class="secondary" onclick="nav('rank')">Ver ranking</button></div></div><div class="stats"><div class="card"><small>Rankings ativos</small><strong>3</strong></div><div class="card"><small>Economia potencial</small><strong>18%</strong></div><div class="card"><small>Benefícios Local+</small><strong>7</strong></div><div class="card"><small>Trust médio</small><strong>94</strong></div></div><div class="section"><h3>Diferenciais</h3></div><div class="grid"><div class="card"><h3>Smart Flex</h3><p class="muted">Mostra alternativas se um obrigatório estiver restringindo demais, sem mudar sua regra sozinho.</p></div><div class="card"><h3>Serviço e sob medida</h3><p class="muted">Schemas diferentes para móvel, terno, cortina, software e outros serviços.</p></div><div class="card"><h3>Promessa x entrega</h3><p class="muted">Reputação baseada no que realmente foi cumprido.</p></div></div>`}function start(){s.need=document.getElementById('need').value;s.bv='create';save();render()}
function create(){return`<div class="card"><span class="tag purple">Requirement Engine</span><h2>Criar necessidade</h2><div class="field"><label>O que procura?</label><textarea id="ct">${s.need}</textarea></div><div class="grid"><div><h3>Móveis</h3><p class="muted">largura, altura, profundidade, tomadas, material, montagem</p></div><div><h3>Moda sob medida</h3><p class="muted">tamanho padrão, medidas, scan DEMO, tecido, corte, prazo</p></div><div><h3>Serviço digital</h3><p class="muted">escopo, objetivo, entregáveis, referências, prazo</p></div></div><div class="section"><h3>Medição</h3></div><div class="grid"><button class="secondary" onclick="toast('Foto: estimativa 2,38 m • confiança baixa')">📷 Foto simples</button><button class="secondary" onclick="toast('AR está simulado na V0.1')">📱 AR/câmera</button><button class="secondary" onclick="toast('Medição profissional adicionada')">📏 Manual/profissional</button></div><div class="section"><h3>Prioridades</h3></div><p><span class="tag red">Obrigatório</span> Retrátil • largura ≤ 240 cm • entrega ≤ 2 dias</p><p><span class="tag">Muito importante</span> Preço 30% • prazo 20%</p><p><span class="tag">Importante</span> Benefícios 20% • reputação 15% • garantia 15%</p><button class="primary" onclick="s.need=document.getElementById('ct').value;s.bv='rank';save();render();toast('Necessidade salva')">Buscar soluções →</button></div>`}
function ranking(){let r=rank();return`${!s.relax?`<div class="smart"><b>💡 Smart Flex</b><p>Entrega em até 2 dias elimina “Móveis Online”. Se aceitar até 4 dias, aparece uma opção mais barata. A regra só muda se você autorizar.</p><button class="secondary" onclick="preview()">Ver alternativas</button> <button class="primary" style="background:var(--amber)" onclick="s.relax=true;s.v++;save();render();toast('Critério alterado e versionado')">Alterar requisito</button></div>`:`<div class="smart"><b>Smart Flex aplicado • critérios v${s.v}</b><p>Móveis Online voltou ao ranking.</p><button class="secondary" onclick="s.relax=false;s.v++;save();render()">Restaurar regra</button></div>`}<div class="card"><div class="section" style="margin-top:0"><div><h2>Ranking explicável</h2><span class="muted">obrigatórios → score ponderado → explicação</span></div><span class="tag purple">Ranking Engine</span></div>${r.map((o,i)=>`<div class="proposal ${!o.e?'fail':''}"><div class="score">${o.e?o.sc:'✕'}</div><div><b>${i+1}º ${o.n}</b><br><small class="muted">${o.t}${o.l?' • Local+':''}</small><br>${o.ben.slice(0,2).map(b=>`<span class="tag green">${b}</span>`).join(' ')}</div><div><small>Preço</small><br><b>${money(o.p)}</b></div><div><small>Prazo</small><br><b>${o.d}d</b></div><div><small>Status</small><br><span class="tag ${o.e?'green':'red'}">${o.e?'Elegível':'Eliminada'}</span></div><div><button class="secondary" onclick="detail('${o.id}')">Detalhes</button></div></div>`).join('')}</div>`}
function preview(){let old=s.relax;s.relax=true;let r=rank();s.relax=old;modal.innerHTML=`<div class="modal"><div class="modalbox"><button class="close" onclick="modal.innerHTML=''">✕</button><h2>Prévia Smart Flex</h2><p class="muted">Não altera o ranking oficial.</p>${r.filter(x=>x.e).slice(0,4).map((o,i)=>`<p>${i+1}º <b>${o.n}</b> — ${money(o.p)} — score ${o.sc}</p>`).join('')}</div></div>`}
function detail(id){let o=rank().find(x=>x.id===id);modal.innerHTML=`<div class="modal"><div class="modalbox"><button class="close" onclick="modal.innerHTML=''">✕</button><span class="tag ${o.e?'green':'red'}">${o.e?'Elegível':'Eliminada'}</span><h2>${o.n}</h2><h1>${o.e?o.sc:'—'}</h1><p>${o.e?'Atende obrigatórios. Score considera preço, prazo, benefícios, reputação e garantia.':'Não atende um requisito obrigatório; preço baixo não compensa a falha.'}</p><h3>Benefícios</h3>${o.ben.map(b=>`<p>✓ ${b}</p>`).join('')}${o.e?`<button class="primary" onclick="s.contract='${o.id}';save();modal.innerHTML='';s.bv='history';render();toast('Contratação DEMO registrada')">Contratar em DEMO</button>`:''}</div></div>`}
function local(){return`<div class="card"><span class="tag green">Local+</span><h2>O que a loja física pode oferecer além do preço?</h2><div class="grid"><div><h3>📦 Retirada e troca</h3><p>Retirada hoje, devolução e troca em unidades físicas.</p></div><div><h3>🛠 Serviço local</h3><p>Montagem, instalação, ajuste, reparo e assistência.</p></div><div><h3>🎁 Ecossistema</h3><p>Descontos em acessórios, decoração e parceiros complementares.</p></div></div><div class="section"><h3>Pontos de Serviço DEMO</h3></div><p>📍 Casa & Conforto Centro — Retirada • Troca</p><p>📍 MegaHome Sul — Montagem • Assistência</p><p>📍 Ateliê João — Ajuste • Sob medida</p><p class="muted">Mapa/geolocalização real não estão conectados nesta versão.</p></div>`}
function history(){let o=s.contract?offers().find(x=>x.id===s.contract):null;return o?`<div class="card"><span class="tag green">Pedido DEMO</span><h2>${o.n}</h2><p>${money(o.p)} • ${o.d} dia(s)</p><div class="timeline"><div class="event"><b>Contratado ✅</b></div><div class="event"><b>Produção/separação</b></div><div class="event"><b>Entrega</b></div></div><button class="primary" onclick="toast('Trust Score DEMO: 96 • promessa cumprida')">Simular entrega e Trust</button></div>`:`<div class="card"><h2>Nenhuma contratação ainda</h2><button class="primary" onclick="nav('rank')">Ir para ranking</button></div>`}
function supplierHome(){return`<div class="hero"><div class="card"><span class="tag purple">Fornecedor</span><h2>3 oportunidades compatíveis</h2><p class="muted">Demandas onde suas capacidades fazem sentido.</p><button class="primary" onclick="nav('opp')">Ver oportunidades</button></div><div class="card"><small>Trust Score</small><h1 style="color:var(--green)">92,6</h1><span class="tag green">98% no prazo</span> <span class="tag">#3 Móveis</span></div></div><div class="stats"><div class="card"><small>Propostas</small><strong>4</strong></div><div class="card"><small>Vitória</small><strong>41%</strong></div><div class="card"><small>Resposta</small><strong>38m</strong></div><div class="card"><small>Trust</small><strong>96</strong></div></div>`}
function opp(){return`<div class="card"><span class="tag green">94% compatível</span><h2>Sofá retrátil cinza — BH</h2><p>Obrigatório: retrátil • largura ≤ 240cm • entrega ≤ 2 dias</p><button class="primary" onclick="bid()">Enviar/melhorar proposta</button></div><div class="card" style="margin-top:12px"><span class="tag">88% compatível</span><h2>Armário sob medida</h2><p>242 × 270 × 60cm • tomada + rodapé • montagem</p></div>`}
function bid(){let o=offers().find(x=>x.id==='local');modal.innerHTML=`<div class="modal"><div class="modalbox"><button class="close" onclick="modal.innerHTML=''">✕</button><h2>Melhorar proposta</h2><div class="field"><label>Novo preço</label><input id="np" type="number" value="${o.p-140}"></div><div class="field"><label>Prazo</label><input id="nd" type="number" value="${o.d}"></div><button class="primary" onclick="let a=s.versions.local;a.push({v:a.length+1,p:+np.value,d:+nd.value,n:'Preço melhorado + montagem mantida'});save();modal.innerHTML='';toast('Nova versão enviada e auditada')">Enviar versão</button></div></div>`}
function props(){return`<div class="card"><h2>Proposta — Casa & Conforto</h2><div class="timeline">${s.versions.local.map(x=>`<div class="event"><b>Versão ${x.v}</b> — ${money(x.p)} • ${x.d}d<br><small class="muted">${x.n}</small></div>`).join('')}</div><button class="primary" onclick="bid()">Melhorar proposta</button></div>`}
function benefits(){return`<div class="card"><span class="tag green">Benefits Engine</span><h2>Benefícios estruturados</h2><div class="grid"><div><h3>Financeiro</h3><p>Cashback, cupom, progressivo.</p></div><div><h3>Local+</h3><p>Troca, retirada, montagem, assistência.</p></div><div><h3>Parceiros</h3><p>Benefícios cruzados e produtos complementares.</p></div></div><div class="field"><label>Benefício exclusivo DEMO</label><input placeholder="Ex.: impermeabilização grátis"></div><button class="primary" onclick="toast('Benefício cadastrado em DEMO')">Cadastrar</button></div>`}
function rep(){return`<div class="hero"><div class="card"><small>Trust Score</small><h1 style="color:var(--green);font-size:46px">96</h1><p>Promessa x entrega real.</p></div><div class="card"><h3>Rankings</h3><p>#3 Móveis • #2 Negociação • #5 Prazo</p></div></div><div class="grid"><div class="card"><b>Prazo cumprido</b><h2>98%</h2></div><div class="card"><b>Benefícios entregues</b><h2>96%</h2></div><div class="card"><b>Satisfação</b><h2>4,8</h2></div></div>`}
function render(){bBuyer.classList.toggle('active',s.persona==='buyer');bSupplier.classList.toggle('active',s.persona==='supplier');navs();let h='';if(s.persona==='buyer'){h=s.bv==='create'?create():s.bv==='rank'?ranking():s.bv==='local'?local():s.bv==='history'?history():buyerHome()}else{h=s.sv==='opp'?opp():s.sv==='prop'?props():s.sv==='benefits'?benefits():s.sv==='rep'?rep():supplierHome()}main.innerHTML=h}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
