<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d3b72"><title>PHARMÉDICE OPS 360 — DEMO</title><style>:root{--n:#0d3b72;--b:#3d7fc9;--bg:#f4f8fb;--i:#17324d;--m:#6f8193;--l:#dce7ef;--g:#1d8a63;--y:#c99527;--r:#c83e4e;--p:#7553c7}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--i)}button{font:inherit}.warn{background:#fff3cd;color:#664d03;padding:7px 10px;text-align:center;font-size:10px;font-weight:800;border-bottom:1px solid #ffecb5}.shell{display:grid;grid-template-columns:205px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--l);padding:16px 11px}.brand{font-weight:900;color:var(--n);padding:7px 7px 15px;border-bottom:1px solid var(--l)}.brand small{display:block;font-size:9px;color:var(--m);margin-top:3px}.nav{display:grid;gap:5px;margin-top:11px}.nav button{border:0;background:transparent;text-align:left;padding:10px;border-radius:9px;color:#3b5872;font-size:11px}.nav button.on{background:#eaf3fb;color:var(--n);font-weight:900}.top{height:60px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:3}.top b{color:var(--n)}.top .r{margin-left:auto;display:flex;gap:7px}.ico,.btn{border:1px solid var(--l);background:#fff;color:var(--n);border-radius:9px;font-weight:800}.ico{width:38px;height:38px}.btn{padding:7px 9px;font-size:9px}.pri{background:var(--n);color:#fff}.content{padding:17px;max-width:1450px;margin:auto}.hero{display:flex;justify-content:space-between;gap:12px;align-items:end}.hero h1{font-size:23px;margin:0}.hero p{font-size:10px;color:var(--m);margin:4px 0 0}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:13px}.stat,.card,.area{background:#fff;border:1px solid var(--l);border-radius:13px;box-shadow:0 5px 15px #17395c0d}.stat{padding:11px;border-top:3px solid var(--c,var(--b))}.stat small,.area small{display:block;color:var(--m);font-size:8px}.stat b{display:block;font-size:21px;margin:5px 0}.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;margin-top:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.card{padding:13px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.head h2,.card h2{font-size:13px;margin:0}.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #eef3f6}.row:first-child{border-top:0}.txt{flex:1}.row b{font-size:10px}.row small{display:block;color:var(--m);font-size:8px;margin-top:2px}.tag{padding:4px 7px;border-radius:999px;font-size:8px;font-weight:900}.green{background:#e8f5ee;color:var(--g)}.red{background:#fdecef;color:var(--r)}.yellow{background:#fff7df;color:#936c09}.purple{background:#f1edfb;color:var(--p)}.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px}.area{padding:11px;text-align:left}.area strong{font-size:10px}.score{font-size:21px;font-weight:900;color:var(--n);margin:6px 0}.hidden{display:none}.drawer{position:fixed;right:12px;top:75px;width:min(350px,calc(100vw - 24px));background:#fff;border:1px solid var(--l);border-radius:15px;padding:13px;box-shadow:0 22px 50px #17395c30;z-index:9}.mobile{display:none}@media(max-width:850px){.shell{display:block}.side{display:none}.mobile{display:grid}.content{padding:10px}.stats{grid-template-columns:1fr 1fr}.grid2,.grid3,.areas{grid-template-columns:1fr}.top{padding:0 9px}.hero h1{font-size:20px}}</style></head><body><div class="warn">AMBIENTE TESTE • DADOS SINTÉTICOS • VISUAL AINDA EM VALIDAÇÃO</div><div class="shell"><aside class="side"><div class="brand">PHARMÉDICE<small>OPS 360 • LAMOU IA</small></div><nav id="nav" class="nav"></nav></aside><main><header class="top"><button id="menu" class="ico mobile">☰</button><b id="title">Cockpit</b><div class="r"><button id="ai" class="ico">AI</button><button id="bell" class="ico">🔔</button></div></header><div id="view" class="content"></div></main></div><div id="drawer" class="drawer hidden"></div><script type="module" src="../core-bridge.js"></script><script>const A=['Diretoria/Gestão','Produção','PCP','Garantia da Qualidade','Controle de Qualidade','Microbiologia','Assuntos Regulatórios','Compras/Suprimentos','Almoxarifado/Estoque','Logística/Expedição','Engenharia','Manutenção','Metrologia','Utilidades/Facilities','RH','Departamento Pessoal','T&D','Saúde e Segurança','TI/Dados','Comercial','SAC/Atendimento','Marketing','Financeiro','Fiscal/Contábil','Administrativo','Compliance/Riscos/Auditoria','Processos/Melhoria','Validação','P&D/Inovação','Atendimento Técnico','Projetos'];const N=[['cockpit','Cockpit'],['areas','Áreas'],['analytics','Analytics'],['diag','Diagnóstico 360'],['docs','Documentos'],['work','Meu Trabalho & Diário'],['settings','Configurações']];let p='cockpit';const sc=n=>67+(n*7%30);function row(t,v,s,c='green'){return `<div class="row"><div class="txt"><b>${t}</b><small>${s}</small></div><span class="tag ${c}">${v}</span></div>`}function stat(t,v,s,c){return `<div class="stat" style="--c:${c}"><small>${t}</small><b>${v}</b><small>${s}</small></div>`}function cockpit(){return `<div class="hero"><div><h1>Olá, Mariana 👋</h1><p>Coordenação de Produção • Nível B • DEMO</p></div></div><section class="stats">${stat('Meta Empresa','82%','estratégica','#7553c7')}${stat('Minha Área','88%','Produção','#3d7fc9')}${stat('Minha Meta','91%','trajetória','#1d8a63')}${stat('Tendência','+3,2%','período','#2b95a8')}${stat('Benchmark','P72','DEMO','#d9772b')}${stat('Risco crítico','2','alertas','#c83e4e')}</section><div class="grid2"><div><article class="card"><div class="head"><h2>Produção hoje</h2><button class="btn" onclick="area('Produção')">Abrir área</button></div>${row('Planejado','28 OPs','meta diária')}${row('Em processo','15','fluxo atual')}${row('Aguardando CQ','4','dependência CQ','yellow')}${row('Atrasados','3','prioridade','red')}</article><article class="card" style="margin-top:10px"><h2>Fatores contribuintes</h2>${row('Material crítico','-12%','impacto estimado','red')}${row('TAT CQ/QA','-8%','impacto estimado','yellow')}${row('Sequenciamento','+4%','contribuição positiva')}</article></div><div><article class="card"><h2>Meu trabalho hoje</h2>${row('Analisar OP em atraso','10:00','@mariana','red')}${row('Confirmar material','10:30','@carlos.demo','yellow')}${row('Reunião diária','11:00','@equipe.producao')}</article><article class="card" style="margin-top:10px"><div class="head"><h2>Diagnóstico 360</h2><button class="btn" onclick="go('diag')">Abrir</button></div>${row('Identificados','24','gaps','yellow')}${row('Evolução','68%','ciclo atual')}${row('Atrasados','7','ações','red')}</article></div></div><div class="grid3"><article class="card"><h2>Documentos</h2>${row('Revisões','7','3 críticas','yellow')}${row('Assinaturas','4','DEMO','purple')}</article><article class="card"><h2>Reconhecimento</h2><p style="font-size:10px">🏆 Fluxo Produção → CQ melhorou 6% no cenário DEMO.</p></article><article class="card"><h2>IA contextual</h2><p style="font-size:10px">“Risco de material amanhã. Origem: Suprimentos; impacto: 4 OPs.”</p></article></div>`}function areas(){return `<div class="hero"><div><h1>Áreas</h1><p>Acesso à área não significa acesso a todos os dados.</p></div></div><div class="areas">${A.map((a,i)=>`<button class="area" onclick="area('${a.replaceAll("'","\\'")}')"><strong>${a}</strong><div class="score">${sc(i)}/100</div><small>${4+i%6} processos • ${i%3===0?'total':i%3===1?'parcial':'resumo'}</small></button>`).join('')}</div>`}function area(a){p='area';title.textContent=a;view.innerHTML=`<div class="hero"><div><button class="btn" onclick="go('areas')">← Áreas</button><h1>${a}</h1><p>Saúde, processos, indicadores, pessoas, ações e documentos.</p></div></div><section class="stats">${stat('Saúde','88%','DEMO','#3d7fc9')}${stat('Tendência','+3,1%','período','#1d8a63')}${stat('KPIs','7','principais','#7553c7')}${stat('Pessoas','12','DEMO','#2b95a8')}${stat('Impacto','Médio','Produção','#d9772b')}${stat('Alertas','2','relacionados','#c83e4e')}</section><div class="grid2"><article class="card"><h2>Principais indicadores</h2>${row('Aderência ao plano','91%','Data Hub')}${row('Produtividade','87%','normalizada')}${row('Capacidade','93%','horas qualificadas')}${row('Retrabalho','2,4%','tendência','yellow')}</article><article class="card"><h2>Impacto na Produção</h2><p style="font-size:10px">Área → Processo → Dado → Gap → Dependência → Impacto.</p>${row('Impacto direto','Médio','DEMO','yellow')}${row('Dependências','3','áreas','purple')}</article></div>`;navr()}function analytics(){return `<div class="hero"><div><h1>Analytics</h1><p>Empresa → área → processo → equipe → indivíduo quando controlável.</p></div></div><section class="stats">${stat('Empresa','82%','meta','#7553c7')}${stat('Área','88%','Produção','#3d7fc9')}${stat('Individual','91%','controlável','#1d8a63')}${stat('Forecast','94%','DEMO','#2b95a8')}${stat('Gap','6%','meta','#d9772b')}${stat('Confiança','Alta','dado','#0d3b72')}</section><article class="card" style="margin-top:10px"><h2>Contribuição</h2>${row('Material crítico','-12%','ofensor','red')}${row('TAT CQ','-8%','ofensor','yellow')}${row('Melhoria de setup','+6%','ganho')}</article>`}function diag(){return `<div class="hero"><div><h1>Diagnóstico 360</h1><p>Problema → métricas → dados → hipóteses → evidências → ação → eficácia.</p></div></div><section class="stats">${stat('Identificados','24','gaps','#d9772b')}${stat('Faltantes','8','itens','#c99527')}${stat('Evolução','68%','ciclo','#1d8a63')}${stat('Atrasados','7','ações','#c83e4e')}${stat('Ganho tempo','18%','DEMO','#2b95a8')}${stat('Desvios','-22%','normalizado','#7553c7')}</section><div class="grid3"><article class="card"><h2>Meus diagnósticos</h2>${row('Produção','68%','@mariana','yellow')}${row('Capacidade','82%','@mariana')}</article><article class="card"><h2>Delegados</h2>${row('CQ','55%','@ana.demo','yellow')}${row('Suprimentos','72%','@carlos.demo')}</article><article class="card"><h2>Metodologias</h2>${row('A3','Sugerida','estrutura','purple')}${row('CAPA','Quando aplicável','qualidade','purple')}</article></div>`}function docs(){return `<div class="hero"><div><h1>Documentos</h1><p>Controlados separados de referências.</p></div></div><section class="stats">${stat('Ativos','524','DEMO','#3d7fc9')}${stat('Revisões','4','pendentes','#7553c7')}${stat('Assinaturas','12','pendentes','#d9772b')}${stat('Vencendo','7','30 dias','#c83e4e')}${stat('Emitidos','24','hoje','#1d8a63')}${stat('Fontes','11','cadastradas','#2b95a8')}</section><article class="card" style="margin-top:10px">${row('POP-PRD-001','v3.0','Produção')}${row('POP-QA-014','v2.0','QA')}${row('FOR-QA-018','v4.0','Desvio')}</article>`}function work(){return `<div class="hero"><div><h1>Meu Trabalho & Diário</h1><p>Ações, liderados e contexto operacional.</p></div></div><div class="grid2"><article class="card"><h2>Minhas ações</h2>${row('OP em atraso','10:00','@mariana','red')}${row('Material crítico','10:30','@carlos.demo','yellow')}${row('Reunião diária','11:00','@equipe')}</article><article class="card"><h2>Diário de Bordo</h2>${row('Equipe & ponto','1 pendência','dia','yellow')}${row('Materiais','OK','dia')}${row('Sistemas','OK','dia')}<textarea style="width:100%;margin-top:8px;padding:9px;border:1px solid var(--l);border-radius:9px" rows="4" placeholder="Informação operacional..."></textarea><button class="btn pri" style="margin-top:7px">Registrar DEMO</button></article></div>`}function settings(){return `<div class="hero"><div><h1>Configurações</h1><p>Administração técnica, separada da área Administrativa.</p></div></div><div class="areas">${['Usuários','Perfis & permissões','Áreas & cargos','Metas & métricas','Data Hub','Integrações & plugins','IA & autorização','LGPD & privacidade','Alertas','Documentos & templates','Identidade visual','Backup & auditoria','System Health','Sugestões','Radar de inovação','Notícias','Ambientes','Cenários DEMO'].map(x=>`<button class="area"><strong>${x}</strong><div class="score" style="font-size:12px">Estrutura pronta</div><small>abrir detalhe</small></button>`).join('')}</div>`}function navr(){nav.innerHTML=N.map(x=>`<button class="${p===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function go(x){p=x;title.textContent=N.find(y=>y[0]===x)?.[1]||'OPS 360';view.innerHTML=({cockpit,areas,analytics,diag,docs,work,settings}[x]||cockpit)();navr();scrollTo({top:0,behavior:'smooth'})}function draw(h){drawer.innerHTML=h;drawer.classList.remove('hidden')}ai.onclick=()=>draw(`<b>Assistente IA — DEMO</b><p style="font-size:10px">Analisa e explica. Não altera parâmetro, libera lote ou conclui causa automaticamente.</p><button class="btn pri" onclick="drawer.classList.add('hidden')">Fechar</button>`);bell.onclick=()=>draw(`<b>Alertas</b>${row('Material crítico','CRÍTICO','Suprimentos → Produção','red')}${row('OP em atraso','ALTO','Produção','yellow')}<button class="btn" onclick="drawer.classList.add('hidden')">Fechar</button>`);menu.onclick=()=>draw(N.map(x=>`<button class="btn" style="display:block;width:100%;margin-top:5px" onclick="go('${x[0]}');drawer.classList.add('hidden')">${x[1]}</button>`).join(''));go('cockpit');</script></body></html>
