<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAMOU CORE Studio — V2.3 Derivada</title>
<style>
:root{--bg:#06101c;--panel:#0b1c2f;--panel2:#10273e;--line:#23415f;--text:#edf7ff;--muted:#91a9c1;--blue:#38a9ff;--green:#41d99a;--yellow:#f2c766;--violet:#b49cff;--red:#ff7587}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#173b60,#07111f 38%,#040a12);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{position:sticky;top:0;height:100vh;background:#06101c;border-right:1px solid var(--line);padding:18px 12px}
.brand{font-weight:900;font-size:19px;margin:4px 8px}.brand small{display:block;color:#79c9ff;font-size:9px;letter-spacing:2px;margin-top:4px}.note{font-size:11px;color:var(--muted);line-height:1.45;margin:14px 8px}
.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:10px;text-align:left;cursor:pointer;margin:2px 0}.nav button.on,.nav button:hover{background:#12304b;color:white}
main{min-width:0}.top{position:sticky;top:0;z-index:3;background:#07111fee;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{font-size:20px;margin:0}.top p{margin:3px 0 0;color:var(--muted);font-size:11px}.content{max-width:1420px;margin:auto;padding:20px}
.hero,.grid2{display:grid;grid-template-columns:1.4fr .8fr;gap:12px}.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--panel2),#091827);padding:15px}.card h2,.card h3{margin-top:0}.card p{color:var(--muted);line-height:1.5}
.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:9px;font-weight:850}.badge.ok{color:#a7f4d3;background:#12392c}.badge.warn{color:#ffe49b;background:#423617}.badge.diff{color:#e2d8ff;background:#271f43;border-color:#66599c}.badge.red{color:#ffc1c8;background:#411d25}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.stat{background:#0b1c2f;border:1px solid var(--line);border-radius:13px;padding:12px}.stat small{color:var(--muted);display:block}.stat b{font-size:25px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.inp,.sel,.btn{border:1px solid var(--line);border-radius:10px;background:#091827;color:white;padding:9px 11px}.inp{flex:1;min-width:240px}.btn{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{cursor:pointer;transition:.15s;min-height:165px}.item:hover{transform:translateY(-2px);border-color:#47709c}.item h3{font-size:16px;margin:9px 0 6px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;margin-top:10px}.row{display:flex;gap:5px;flex-wrap:wrap}
dialog{width:min(1120px,96vw);max-height:92vh;overflow:auto;border:1px solid var(--line);border-radius:18px;padding:0;background:#081624;color:white}dialog::backdrop{background:#000c}.mh{position:sticky;top:0;z-index:2;background:#081624f3;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;gap:10px}.mb{padding:16px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}.tabs button{border:1px solid var(--line);background:#0d2034;color:var(--muted);border-radius:9px;padding:8px 10px;cursor:pointer}.tabs button.on{background:#18314d;color:white}.pane{display:none}.pane.on{display:block}.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0c1e32}.box h3{margin:0 0 7px}.box p,.box li{color:#c6d7e6;line-height:1.5}.deps span{display:inline-block;border:1px solid #315273;border-radius:8px;padding:4px 7px;margin:2px;font-size:10px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:10px;padding:10px;background:#091827}.metric small{color:var(--muted)}
pre{white-space:pre-wrap;background:#06101c;border:1px solid var(--line);border-radius:10px;padding:12px;color:#dcecff}.warnbox{border-left:4px solid var(--yellow);background:#2a240f;padding:10px 12px;border-radius:8px;color:#f7e8ba}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{display:none}.hero,.grid2,.detail{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.content{padding:12px}.grid,.metrics{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.top{padding:12px}}
</style></head><body><div class="app"><aside><div class="brand">LAMOU CORE Studio<small>V2.3 · DERIVADA</small></div><div class="note">Baseline principal preservada. Esta branch organiza contratos, ganhos, dependências e fast-path sem declarar proposta como produção.</div><div class="nav" id="nav"></div></aside><main><header class="top"><div><h1 id="title">Visão geral</h1><p id="sub">Arquitetura, execução, benefícios e verdade operacional.</p></div><span class="badge warn">PROMOÇÃO BLOQUEADA</span></header><div class="content" id="content"></div></main></div><dialog id="dlg"></dialog>
<script src="./modules.js"></script><script src="./innovation-registry.js"></script><script src="./core-code-registry.js"></script><script src="./core-governance.js"></script>
<script>
const $=s=>document.querySelector(s),esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CODES=window.CORE_CODES||[],INNO=window.CORE_INNOVATIONS||[],METRICS=window.CORE_METRICS||{};let page='home',q='',area='all';
const pages=[['home','Visão geral'],['codes','Códigos CORE'],['innovations','✦ Diferenciais'],['modules','Módulos'],['deps','Dependências'],['architecture','Arquitetura']];
function nav(){ $('#nav').innerHTML=pages.map(([id,n])=>`<button class="${page===id?'on':''}" data-page="${id}">${n}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function badgeStatus(s){return String(s).includes('IMPLEMENTADO')?'ok':String(s).includes('DIFERENCIAL')||String(s).includes('PESQUISA')?'diff':'warn'}
function shell(){const r=window.CORE_GOVERNANCE?.validate?.()||{ok:false,issues:[]};return `<section class="hero"><div class="card"><span class="badge diff">CORE 2.3 · GOVERNANÇA</span><h2>Rápido sem furar segurança. Flexível sem perder verdade.</h2><p>Contrato travado onde precisa, implementação substituível por trás do contrato, dependências rígidas sem ciclo, delta/chunk para mover só o necessário e rota rápida apenas com contexto pré-validado.</p></div><div class="card"><b>Validação da arquitetura</b><div style="font-size:34px;font-weight:900;margin:8px 0">${r.ok?'OK':'ATENÇÃO'}</div><p>${CODES.length} códigos governados · ${r.issues?.length||0} erro(s) de governança.</p></div></section><div class="stats"><div class="stat"><small>Códigos</small><b>${CODES.length}</b></div><div class="stat"><small>Diferenciais</small><b>${INNO.length}</b></div><div class="stat"><small>Fast-path nunca-bypass</small><b>${CODES.filter(c=>c.fastPath==='NEVER_BYPASS').length}</b></div><div class="stat"><small>Contratos críticos</small><b>${CODES.filter(c=>c.contractLock==='LOCKED_CRITICAL_CONTRACT').length}</b></div></div>`}
function cardCode(c){return `<article class="card item" data-code="${esc(c.code)}"><div class="row"><span class="badge">${esc(c.area)}</span><span class="badge ${badgeStatus(c.status)}">${esc(c.status)}</span></div><h3>${esc(c.code)} · ${esc(c.name)}</h3><p>${esc(c.when)}</p><div class="row"><span class="badge">${esc(c.contractLock)}</span><span class="badge">${esc(c.fastPath)}</span></div><div class="meta"><span>${c.hardDepends?.length||0} hard deps</span><span>abrir ficha →</span></div></article>`}
function codes(){const areas=[...new Set(CODES.map(c=>c.area))].sort(),list=CODES.filter(c=>(area==='all'||c.area===area)&&(!q||[c.code,c.name,c.area,c.when,c.status].join(' ').toLowerCase().includes(q.toLowerCase())));return shell()+`<div class="toolbar"><input class="inp" id="q" value="${esc(q)}" placeholder="Buscar código, função ou área..."><select class="sel" id="area"><option value="all">Todas as áreas</option>${areas.map(a=>`<option ${area===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="grid">${list.map(cardCode).join('')}</div>`}
function innovations(){return shell()+`<div class="grid">${INNO.map(x=>`<article class="card item" data-inno="${esc(x.id)}"><div class="row"><span class="badge diff">${esc(x.level)}</span><span class="badge">${esc(x.area)}</span></div><h3>${esc(x.icon)} ${esc(x.short)}</h3><p>${esc(x.what)}</p><div class="meta"><span>${esc(x.status)}</span><span>explicar →</span></div></article>`).join('')}</div>`}
function modules(){return shell()+`<div class="grid">${CORE_MODULES.map(m=>`<article class="card item"><div class="row"><span class="badge">${esc(m.category)}</span><span class="badge">${esc(m.kind)}</span></div><h3>${esc(m.name)}</h3><p>${esc(m.does)}</p><div class="meta"><span>${m.depends?.length||0} deps</span><span>${esc(m.version)}</span></div></article>`).join('')}</div>`}
function deps(){return shell()+`<div class="card"><h2>Dependências rígidas de bootstrap</h2><p>O campo antigo de relação não é mais tratado automaticamente como bloqueio de inicialização. O CORE-DAG valida apenas <b>hardDepends</b>, evitando ciclos.</p>${CODES.map(c=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${esc(c.code)}</b> <span style="color:var(--muted)">→</span> <span class="deps">${(c.hardDepends||[]).map(d=>`<span>${esc(d)}</span>`).join('')||'<span>base</span>'}</span></div>`).join('')}</div>`}
function architecture(){return shell()+`<div class="grid2"><div class="card"><h2>Fluxo de execução</h2><pre>Request
↓ CORE-TASK
↓ CORE-ID / CORE-RBAC
↓ CORE-SEC-ORCH
↓ CORE-ATTEST / CORE-FPATH?
↓ CORE-RES
↓ CORE-XY
↓ capability
↓ CORE-VER
↓ CORE-AUD / CORE-BEN</pre></div><div class="card"><h2>Fluxo de dados</h2><pre>Change
↓ CORE-DELTA
↓ CORE-BUF
↓ CORE-PROJ
↓ CORE-ALLOC
↓ CORE-STOR
↓ CORE-COMMIT
↓ CORE-VER
↓ CORE-BDR</pre><p><a href="./architecture-center.html" style="color:#79c9ff">Abrir centro visual completo →</a></p></div></div>`}
function home(){return shell()+`<div class="grid2"><div class="card"><h2>O que torna rápido?</h2><p>Contrato estável, DAG sem ciclos, lazy loading, delta/chunk, fila/worker, timeout/cancelamento, idempotência, circuit breaker e fast-path pré-validado.</p></div><div class="card"><h2>O que não pode ser furado?</h2><p>Hard rules, autorização em fronteira de confiança, integridade, segredo/assinatura, consentimento, pagamento, mudança de privilégio e auditoria crítica.</p></div></div>`}
function bind(){document.querySelectorAll('[data-code]').forEach(e=>e.onclick=()=>openCode(e.dataset.code));document.querySelectorAll('[data-inno]').forEach(e=>e.onclick=()=>openInnovation(e.dataset.inno));const qi=$('#q'),ai=$('#area');if(qi)qi.oninput=()=>{q=qi.value;renderContent()};if(ai)ai.onchange=()=>{area=ai.value;renderContent()}}
function metricCards(c){return (c.measurableBy||[]).map(id=>{const m=METRICS[id]||{label:id,unit:''};return `<div class="metric"><small>${esc(id)}</small><b>${esc(m.label)}</b><div>${esc(m.unit)}</div></div>`}).join('')}
function tabs(){document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.dataset.pane===b.dataset.tab))})}
function openCode(id){const c=CODES.find(x=>x.code===id);if(!c)return;const d=$('#dlg'),hard=(c.hardDepends||[]).map(x=>`<span>${esc(x)}</span>`).join('')||'<span>base</span>',rel=(c.relatedDepends||[]).map(x=>`<span>${esc(x)}</span>`).join('')||'<span>nenhuma</span>';d.innerHTML=`<div class="mh"><div><div class="row"><span class="badge">${esc(c.area)}</span><span class="badge ${badgeStatus(c.status)}">${esc(c.status)}</span></div><h2>${esc(c.code)} · ${esc(c.name)}</h2></div><button class="btn close">Fechar</button></div><div class="mb"><div class="tabs"><button class="on" data-tab="act">Quando atua</button><button data-tab="io">Entrada/Saída</button><button data-tab="sec">Dados/Segurança</button><button data-tab="deps">Planos/Deps</button><button data-tab="speed">Fast Path</button><button data-tab="gain">Benefícios</button><button data-tab="contract">Contrato</button></div><section class="pane on" data-pane="act"><div class="detail"><div class="box"><h3>Quando</h3><p>${esc(c.when)}</p></div><div class="box"><h3>Estado</h3><p><b>${esc(c.status)}</b></p><p>${esc(c.source)}</p></div><div class="box"><h3>Travamento</h3><p><b>${esc(c.contractLock)}</b></p><p>${esc(window.CORE_GOVERNANCE.lockMeaning[c.contractLock]||'')}</p></div><div class="box"><h3>Anti-trava</h3><p>Timeout, cancelamento, estado observável, idempotência quando retryable e falha fechada para política desconhecida.</p></div></div></section><section class="pane" data-pane="io"><div class="detail"><div class="box"><h3>Entradas</h3><ul>${(c.inputs||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="box"><h3>Saídas</h3><ul>${(c.outputs||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div></section><section class="pane" data-pane="sec"><div class="box"><h3>Dados</h3><p>${esc(c.data)}</p></div><div class="warnbox" style="margin-top:10px">Dado/classificação desconhecida não recebe privilégio nem fast-path.</div></section><section class="pane" data-pane="deps"><div class="detail"><div class="box"><h3>Hard deps</h3><div class="deps">${hard}</div></div><div class="box"><h3>Relações</h3><div class="deps">${rel}</div></div><div class="box"><h3>X/Y/Z/Safe</h3><p>${esc(c.plans)}</p></div><div class="box"><h3>Bootstrap</h3><p>Hard deps formam DAG. Relação lógica não bloqueia inicialização.</p></div></div></section><section class="pane" data-pane="speed"><div class="detail"><div class="box"><h3>${esc(c.fastPath)}</h3><p>Atalho significa reutilizar trabalho já validado; nunca remover barreira crítica.</p></div><div class="box"><h3>Sempre valida</h3><p>Trust boundary authorization, hard rules, integridade e audit quando exigido.</p></div><div class="box"><h3>Pode reutilizar</h3><p>Provider resolution, schema, metadata imutável, policy compilada e full-fetch quando delta basta.</p></div><div class="box"><h3>Invalida</h3><p>Usuário/tenant/role/policy/risk/data-class/code-version/TTL mudou.</p></div></div></section><section class="pane" data-pane="gain"><div class="box"><h3>Como medir</h3><p>Sem baseline real: <b>NÃO MENSURÁVEL</b>. Menor é melhor: (baseline−atual)/baseline×100. Maior é melhor: (atual−baseline)/baseline×100.</p><div class="metrics">${metricCards(c)}</div></div></section><section class="pane" data-pane="contract"><div class="box"><h3>Contrato técnico</h3><pre>${esc(c.contract)}</pre><p>Contrato travado ≠ implementação congelada. Breaking change exige nova major, migração, teste e reverse path.</p></div></section></div>`;d.querySelector('.close').onclick=()=>d.close();tabs();d.showModal()}
function openInnovation(id){const x=INNO.find(v=>v.id===id);if(!x)return;const d=$('#dlg');d.innerHTML=`<div class="mh"><div><span class="badge diff">${esc(x.level)}</span><h2>${esc(x.icon)} ${esc(x.name)}</h2></div><button class="btn close">Fechar</button></div><div class="mb"><div class="detail"><div class="box"><h3>O que é</h3><p>${esc(x.what)}</p></div><div class="box"><h3>O que já existia</h3><p>${esc(x.existed)}</p></div><div class="box"><h3>O que fizemos</h3><p>${esc(x.lamou)}</p></div><div class="box"><h3>Benefícios / prova</h3><p>Benefício esperado deve ser convertido em baseline + telemetria. Sem medição, continua hipótese de ganho.</p></div></div></div>`;d.querySelector('.close').onclick=()=>d.close();d.showModal()}
function renderContent(){const f=page==='home'?home:page==='codes'?codes:page==='innovations'?innovations:page==='modules'?modules:page==='deps'?deps:architecture;$('#content').innerHTML=f();bind()}
function render(){nav();const t={home:['Visão geral','Arquitetura, execução, benefícios e verdade operacional.'],codes:['Códigos CORE','Cada código explica quando atua, segurança, ganho, fast-path e contrato.'],innovations:['✦ Diferenciais','O que existia, o que fizemos e como provar benefício.'],modules:['Módulos','Capacidades reutilizáveis da base.'],deps:['Dependências','Hard dependencies sem ciclos de bootstrap.'],architecture:['Arquitetura','Fluxos de execução e dados.']}[page];$('#title').textContent=t[0];$('#sub').textContent=t[1];renderContent()}render();
</script></body></html>
