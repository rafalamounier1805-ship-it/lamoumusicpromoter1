<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>LAMOU CORE Studio — Catálogo da Base</title><style>
:root{--bg:#07111f;--panel:#0c1a2c;--panel2:#10233a;--line:#23415f;--text:#eef7ff;--muted:#91a9c1;--blue:#35a9ff;--green:#41d99a;--yellow:#f2c766;--red:#ff7587}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#16395d,#07111f 42%,#040a12);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line);background:#06101c}.brand{font-weight:900;font-size:19px;margin:4px 8px 2px}.brand small{display:block;color:#78c8ff;letter-spacing:2.5px;font-size:9px;margin-top:4px}.note{color:var(--muted);font-size:11px;line-height:1.45;margin:14px 8px}.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:10px;text-align:left;cursor:pointer;margin:2px 0}.nav button.on,.nav button:hover{background:#12304b;color:#fff}.aside-box{position:absolute;left:12px;right:12px;bottom:14px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#0a1929}.aside-box b{display:block}.aside-box small{color:var(--muted)}main{min-width:0}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:#07111fed}.top h1{font-size:20px;margin:0}.top p{margin:3px 0 0;color:var(--muted);font-size:11px}.content{max-width:1400px;margin:auto;padding:20px}.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.card,.hero>div{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#10273e,#0a1929);padding:16px}.hero h2{font-size:28px;margin:6px 0}.hero p{color:var(--muted);max-width:780px}.badge{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{border:1px solid var(--line);border-radius:13px;padding:12px;background:#0b1c2f}.stat small{display:block;color:var(--muted)}.stat b{font-size:26px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.inp,.sel,.btn{border:1px solid var(--line);border-radius:10px;padding:9px 11px}.inp,.sel{background:#091827;color:white}.inp{min-width:260px;flex:1}.btn{background:#102a42;color:white;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,#159cff,#3869ff);font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.module{cursor:pointer;transition:.16s;min-height:175px}.module:hover{transform:translateY(-2px);border-color:#47709c}.module h3{margin:10px 0 6px;font-size:17px}.module p{color:var(--muted);font-size:12px;line-height:1.45}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.kind{font-size:9px;border-radius:999px;padding:4px 7px;font-weight:900}.kind.CORE{color:#9ff0cd;background:#12392c}.kind.OPTIONAL{color:#ffe49b;background:#423617}.kind.RECOMMENDED{color:#a9d8ff;background:#17384f}.meta{margin-top:10px;display:flex;justify-content:space-between;color:#90a8c0;font-size:10px}.empty{padding:30px;color:var(--muted);text-align:center}.plugin-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.plugin{border:1px solid var(--line);border-radius:13px;padding:13px;background:#0a1929}.plugin h3{margin:0 0 6px}.plugin p,.plugin small{color:var(--muted)}dialog{width:min(950px,95vw);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:18px;padding:0;background:#081624;color:white}dialog::backdrop{background:#000b}.modal-head{position:sticky;top:0;background:#081624ef;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}.modal-body{padding:16px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-box{border:1px solid var(--line);border-radius:13px;padding:13px;background:#0d1f34}.detail-box h3{margin:0 0 8px}.dep{display:inline-block;border:1px solid #315273;border-radius:8px;padding:4px 7px;margin:2px;font-size:10px}.plugtable{width:100%;border-collapse:collapse;font-size:11px}.plugtable th,.plugtable td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.plugtable th{color:#8ea9c3}.warning{border-left:4px solid var(--yellow);background:#29230f;padding:10px 12px;border-radius:8px;color:#f6e6b5}@media(max-width:900px){.app{grid-template-columns:1fr}aside{display:none}.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.plugin-list{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.content{padding:12px}.top{padding:12px}.grid,.detail-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.inp{min-width:100%}.hero h2{font-size:23px}}
</style></head><body><div class="app"><aside><div class="brand">LAMOU CORE Studio<small>CATÁLOGO DA BASE</small></div><div class="note">Não cria aplicativos. Organiza a base usada para construir todos os aplicativos e sites LAMOU IA.</div><div class="nav" id="nav"></div><div class="aside-box"><b>CORE <span id="coreVer"></span></b><small id="asideCount"></small></div></aside><main><header class="top"><div><h1 id="pageTitle">Módulos & Ferramentas</h1><p id="pageSub">Clique em um módulo para ver tudo que ele faz, plugins, substituições, dependências e versão.</p></div><span class="badge">BASE UNIVERSAL</span></header><div id="content" class="content"></div></main></div><dialog id="dlg"></dialog><script src="./modules.js"></script><script>
const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const els={nav:document.getElementById('nav'),coreVer:document.getElementById('coreVer'),asideCount:document.getElementById('asideCount'),pageTitle:document.getElementById('pageTitle'),pageSub:document.getElementById('pageSub'),content:document.getElementById('content'),dlg:document.getElementById('dlg')};
let page='modules',query='',category='all',kind='all';
const navItems=[['modules','Módulos & Ferramentas'],['plugins','Plugins & Substituições'],['deps','Dependências'],['versions','Versões & Atualizações'],['rules','Governança']];
function renderNav(){els.nav.innerHTML=navItems.map(([id,n])=>`<button class="${page===id?'on':''}" onclick="go('${id}')">${n}</button>`).join('')}
function go(p){page=p;render()}
function stats(){const cats=new Set(CORE_MODULES.map(x=>x.category)).size,core=CORE_MODULES.filter(x=>x.kind==='CORE').length,plugins=new Set(CORE_MODULES.flatMap(x=>x.plugins)).size;return [[CORE_MODULES.length,'Módulos'],[core,'Obrigatórios CORE'],[plugins,'Integrações/engines'],[cats,'Categorias']]}
function shell(inner){return `<section class="hero"><div><span class="badge">CORE ${esc(CORE_VERSION)}</span><h2>Uma biblioteca de capacidades, não um gerador de apps.</h2><p>O CORE Studio inventaria tudo que a LAMOU IA pode reutilizar. Cada módulo explica sua função, dependências, plugins, substituições possíveis e política de continuidade caso um fornecedor limite ou deixe de atender.</p></div><div><b>Regra central</b><p>O aplicativo final escolhe os módulos que precisa. O CORE mantém todos disponíveis e governados.</p></div></section><div class="stats">${stats().map(x=>`<div class="stat"><small>${x[1]}</small><b>${x[0]}</b></div>`).join('')}</div>${inner}`}
function filteredModules(){return CORE_MODULES.filter(m=>(category==='all'||m.category===category)&&(kind==='all'||m.kind===kind)&&(!query||[m.name,m.does,m.category,m.id].join(' ').toLowerCase().includes(query.toLowerCase())))}
function moduleFilters(){const cats=[...new Set(CORE_MODULES.map(x=>x.category))].sort();return `<div class="toolbar"><input id="moduleSearch" class="inp" placeholder="Buscar módulo, função ou categoria..." value="${esc(query)}"><select id="categoryFilter" class="sel"><option value="all">Todas as categorias</option>${cats.map(c=>`<option value="${esc(c)}" ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="kindFilter" class="sel"><option value="all">Todos os tipos</option><option value="CORE" ${kind==='CORE'?'selected':''}>CORE</option><option value="RECOMMENDED" ${kind==='RECOMMENDED'?'selected':''}>RECOMMENDED</option><option value="OPTIONAL" ${kind==='OPTIONAL'?'selected':''}>OPTIONAL</option></select></div>`}
function moduleCard(m){return `<article class="card module" data-module="${m.id}" tabindex="0"><div class="row"><span class="kind ${m.kind}">${m.kind}</span><span class="badge">${esc(m.category)}</span></div><h3>${esc(m.name)}</h3><p>${esc(m.does)}</p><div class="meta"><span>${m.plugins.length} plugin/engine(s)</span><span>${esc(m.version)}</span></div></article>`}
function bindModulePage(){const search=document.getElementById('moduleSearch'),cf=document.getElementById('categoryFilter'),kf=document.getElementById('kindFilter');if(search)search.oninput=()=>{query=search.value;renderModuleGrid()};if(cf)cf.onchange=()=>{category=cf.value;renderModuleGrid()};if(kf)kf.onchange=()=>{kind=kf.value;renderModuleGrid()};bindModuleCards()}
function renderModuleGrid(){const grid=document.getElementById('moduleGrid');if(!grid)return;grid.innerHTML=filteredModules().map(moduleCard).join('')||'<div class="empty">Nenhum módulo encontrado.</div>';bindModuleCards()}
function bindModuleCards(){document.querySelectorAll('[data-module]').forEach(el=>{const open=()=>openModule(el.dataset.module);el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
function modulesPage(){return shell(`${moduleFilters()}<div class="grid" id="moduleGrid">${filteredModules().map(moduleCard).join('')||'<div class="empty">Nenhum módulo encontrado.</div>'}</div>`)}
function openModule(id){const m=CORE_MODULES.find(x=>x.id===id);if(!m)return;const ps=m.plugins.map(id=>({id,...CORE_PLUGINS[id]}));els.dlg.innerHTML=`<div class="modal-head"><div><span class="kind ${m.kind}">${m.kind}</span> <span class="badge">${esc(m.category)}</span><h2 style="margin:7px 0 0">${esc(m.name)}</h2></div><button class="btn" id="closeDlg">Fechar</button></div><div class="modal-body"><div class="detail-grid"><div class="detail-box"><h3>O que faz</h3><p>${esc(m.does)}</p></div><div class="detail-box"><h3>Versão</h3><b>${esc(m.version)}</b><p style="color:var(--muted)">${m.history.map(esc).join('<br>')}</p></div><div class="detail-box"><h3>Dependências</h3>${m.depends.length?m.depends.map(x=>`<span class="dep">${esc(CORE_MODULES.find(z=>z.id===x)?.name||x)}</span>`).join(''):'<span style="color:var(--muted)">Sem dependência obrigatória.</span>'}</div><div class="detail-box"><h3>Continuidade</h3><p>O módulo não pode parar o aplicativo só porque um plugin atingiu limite. A estratégia de troca fica registrada abaixo.</p></div></div><h3>Plugins, engines e substituições</h3><div style="overflow:auto"><table class="plugtable"><thead><tr><th>Principal</th><th>Função</th><th>Substituições possíveis</th><th>Como trocar</th><th>Se atingir limite / falhar</th><th>Versão</th></tr></thead><tbody>${ps.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.role)}</td><td>${p.alternatives.map(esc).join('<br>')}</td><td>${esc(p.switching)}</td><td>${esc(p.continuity)}</td><td>${esc(p.versionPolicy)}</td></tr>`).join('')}</tbody></table></div><div class="warning" style="margin-top:14px"><b>Regra:</b> troca automática só é permitida quando o contrato técnico for compatível e não houver risco de perda de dados, autenticação, cobrança ou segurança. Nesses casos a troca exige migração controlada.</div></div>`;document.getElementById('closeDlg').onclick=()=>els.dlg.close();els.dlg.showModal()}
function pluginsPage(){const used=[...new Set(CORE_MODULES.flatMap(x=>x.plugins))];return shell(`<div class="plugin-list">${used.map(id=>{const p=CORE_PLUGINS[id];const n=CORE_MODULES.filter(m=>m.plugins.includes(id)).length;return `<div class="plugin"><div class="row"><span class="badge">${n} módulo(s)</span></div><h3>${esc(p.name)}</h3><p>${esc(p.role)}</p><small><b>Substitutos:</b> ${p.alternatives.map(esc).join(' • ')}</small><p><b>Troca:</b> ${esc(p.switching)}</p><p><b>Continuidade:</b> ${esc(p.continuity)}</p><small><b>Versão:</b> ${esc(p.versionPolicy)}</small></div>`}).join('')}</div>`)}
function depsPage(){return shell(`<div class="card"><h2>Mapa de dependências</h2><p style="color:var(--muted)">Cada módulo mostra o que precisa existir antes dele. O MODULE MANAGER deve impedir remoção ou troca que quebre módulos dependentes.</p>${CORE_MODULES.map(m=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(m.name)}</b><div style="margin-top:5px">${m.depends.length?m.depends.map(x=>`<span class="dep">${esc(CORE_MODULES.find(z=>z.id===x)?.name||x)}</span>`).join(''):'<span style="color:var(--muted)">Base independente</span>'}</div></div>`).join('')}</div>`)}
function versionsPage(){return shell(`<div class="card"><h2>Versões & Atualizações</h2><p style="color:var(--muted)">O manifesto oficial encontrado está em CORE 2.1.0. Como os aplicativos podem usar versões diferentes de SDKs/plugins, o CORE registra a política de versão e cada app deve guardar a versão exata no seu lockfile/dossiê.</p><div class="warning"><b>Não inventar histórico:</b> versões anteriores de um módulo só entram aqui quando houver commit, release, arquivo ou outra evidência. O baseline atual foi inventariado como CORE 2.1.</div><h3 style="margin-top:18px">CORE Update Center</h3><p>Deve comparar versão do módulo, dependências, breaking changes, migrações, testes e aplicativos impactados antes de liberar atualização.</p></div>`)}
function rulesPage(){return shell(`<div class="grid"><div class="card"><h3>1. O CORE Studio não cria app</h3><p>Ele cataloga e governa a base. Criação de produto acontece no projeto do aplicativo.</p></div><div class="card"><h3>2. Um módulo é uma capacidade</h3><p>Tem função, dependências, implementação, plugins, alternativas, versão e critérios de uso.</p></div><div class="card"><h3>3. Plugin não é módulo</h3><p>O módulo continua existindo mesmo quando seu fornecedor/engine é substituído.</p></div><div class="card"><h3>4. Gratuito não pode travar</h3><p>Limite de free tier deve gerar fallback, degradação segura ou migração controlada.</p></div><div class="card"><h3>5. Segurança não faz fallback inseguro</h3><p>Auth, banco, billing e dados não trocam silenciosamente de fornecedor.</p></div><div class="card"><h3>6. Versão com prova</h3><p>Histórico só é registrado com evidência real: commit, release, changelog ou artefato.</p></div></div>`)}
function render(){els.coreVer.textContent=CORE_VERSION;els.asideCount.textContent=CORE_MODULES.length+' módulos catalogados';renderNav();const titles={modules:['Módulos & Ferramentas','Clique em um módulo para abrir a ficha completa.'],plugins:['Plugins & Substituições','Fornecedor é intercambiável; a capacidade do módulo permanece.'],deps:['Dependências','Veja impacto antes de remover ou trocar uma peça.'],versions:['Versões & Atualizações','Histórico baseado em evidência e compatibilidade.'],rules:['Governança','Regras que todo aplicativo LAMOU IA herda.']};els.pageTitle.textContent=titles[page][0];els.pageSub.textContent=titles[page][1];els.content.innerHTML=page==='modules'?modulesPage():page==='plugins'?pluginsPage():page==='deps'?depsPage():page==='versions'?versionsPage():rulesPage();if(page==='modules')bindModulePage()}
render();
</script></body></html>
