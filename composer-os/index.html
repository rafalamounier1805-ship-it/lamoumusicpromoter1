:10px}.metricMini b{font-size:18px;display:block}.metricMini span{font-size:10px;color:#8491a0}.focusItem{display:grid;grid-template-columns:4px 1fr auto;gap:11px;padding:12px 0;border-bottom:1px solid #232e39}.focusItem:last-child{border-bottom:0}.focusBar{border-radius:6px;background:#ef6a75}.focusItem.doing .focusBar{background:#6aa6ff}.focusItem.waiting .focusBar{background:#e9b949}.healthRow{display:grid;grid-template-columns:minmax(140px,1fr) 120px auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #232e39}.healthRow:last-child{border:0}

@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 14px}.content{padding:14px 14px 84px}.g4,.g3,.g2{grid-template-columns:1fr}.span2,.span3,.span4{grid-column:span 1}.pagehead{flex-direction:column}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:1}.mobileNav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#071322;border-top:1px solid #203450;z-index:60}.mobileNav button{background:transparent;border:0;color:#90a2ba;padding:9px 4px;font-size:10px}.mobileNav button.active{color:#fff}.mobileNav span{display:block;font-size:17px;margin-bottom:2px}.intelligenceBtn span{display:none}.intelligenceBtn{min-width:40px;padding:0 9px}}

<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="brandmark">CO</div><div><h1>COMPOSER OS</h1><small>Music Business Workspace</small></div></div><div id="nav"></div></aside>
<div class="main"><div class="topbar"><div class="search"><span>⌕</span><input id="globalSearch" placeholder="Buscar música, contato, ISRC, tarefa..." oninput="doGlobalSearch(this.value)"/></div><div class="topactions"><button class="iconbtn intelligenceBtn" title="Composer Intelligence" onclick="openAssistant()"><span>Intelligence</span></button><button class="iconbtn" title="Novo" onclick="quickAdd()">＋</button></div></div><main class="content" id="content"></main></div>
</div>
<div class="mobileNav" id="mobileNav"></div>
<div class="modalWrap" id="modalWrap"><div class="modal"><div class="modalHead"><h3 id="modalTitle"></h3><button class="close" onclick="closeModal()">×</button></div><div class="modalBody" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<div class="assistantShade" id="assistantShade" onclick="closeAssistant()"></div><aside class="assistantDrawer" id="assistantDrawer"><div class="assistantHead"><div class="assistantIdentity"><div class="assistantMark">CI</div><div><h3>Composer Intelligence</h3><p>Assistente contextual de trabalho · motor local</p></div></div><button class="close" onclick="closeAssistant()">×</button></div><div class="assistantBody" id="assistantBody"></div><div class="assistantComposer"><textarea id="assistantInput" placeholder="Ex.: o que falta nesta música antes de apresentar para uma editora?"></textarea><div class="assistantActions"><span class="status st-gray">Sem métricas inventadas</span><button class="btn primary small" onclick="assistantAsk()">Executar</button></div></div></aside>
<script>
const DBKEY='composer_os_pro_v2';const LEGACYKEY='composer_os_pro_v1';
const STATUS={done:['Concluído','st-green'],doing:['Em andamento','st-blue'],waiting:['Aguardando','st-yellow'],blocked:['Bloqueado','st-red'],pending:['Pendente','st-red'],na:['N/A','st-gray']};
const PIPE=['alvo','pesquisado','pronto','enviado','respondeu','interessado','negociacao','ganho','perdido'];
const PIPELABEL={alvo:'Alvo',pesquisado:'Pesquisado',pronto:'Contato pronto',enviado:'Enviado',respondeu:'Respondeu',interessado:'Interessado',negociacao:'Negociação',ganho:'Ganho',perdido:'Perdido'};
const NAV=[
 ['core','GESTÃO'],['dashboard','⌂','Hoje'],['catalog','♪','Catálogo'],['production','◉','Produção'],['rights','⚖','Direitos & Registros'],['documents','▣','Documentos'],['planner','✓','Plano 30 dias'],
 ['market','MERCADO'],['crm','◎','Mercado & Pitching'],['launch','↗','Divulgação & Lançamentos'],['revenue','R$','Receitas & Royalties'],
 ['intelligence','CONTROLE'],['reports','▤','Relatórios'],['settings','⚙','Configurações']
];
const PLAN=[
 'Criar perfil e objetivos','Conectar/importar catálogo','Validar releases e versões','Conferir ISRC/UPC','Separar obra x fonograma','Mapear autores e splits','Organizar contratos e licenças','Cadastrar registros autorais','Verificar gestão coletiva/ISWC','Documentar uso de IA','Completar WAV/master/instrumental','Anexar letra e capa','Auditar metadados','Corrigir pendências críticas','Definir objetivo comercial por faixa','Classificar rota: publisher/label/sync','Preparar one-sheet/EPK','Selecionar 3 faixas para pitch','Pesquisar empresas-alvo','Validar contatos reais','Primeira rodada de pitching','Registrar respostas e sinais','Segunda rodada segmentada','Preparar pacote sync','Preparar pacote publisher/intérprete','Preparar pacote label/gravadora','Executar follow-ups','Conciliar receitas e statements','Gerar dossiês e auditoria','Planejar próximo ciclo'
];
function seed(){
 const today=new Date(); const iso=n=>{let d=new Date(today);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
 return {
  profile:{artist:'Meu Catálogo',name:'Compositor Independente',country:'Brasil',spotifyUrl:'',spotifyConnected:false,cycleStart:today.toISOString().slice(0,10)},
  tracks:[
   {id:'t1',title:'Exemplo — Horizonte',version:'Master',release:'Single de demonstração',releaseDate:iso(-40),duration:'03:26',language:'PT-BR',genre:'Pop',bpm:'112',key:'Am',explicit:false,isrc:'BR-DEM-26-00001',iswc:'',upc:'',distributor:'Distribuidora Demo',published:true,spotifyUrl:'',objective:'Publisher / intérprete',registration:{status:'pending',office:'',protocol:'',date:''},ai:{used:true,tool:'Ferramenta demonstrativa',license:'Não verificado',humanLyrics:true,humanMelody:true,syntheticVocal:false,notes:''},production:{stage:'master',owner:'',due:''},createdAt:Date.now()},
   {id:'t2',title:'Exemplo — Pulso',version:'Demo',release:'Não lançado',releaseDate:'',duration:'02:58',language:'EN',genre:'Electronic',bpm:'126',key:'F#m',explicit:false,isrc:'',iswc:'',upc:'',distributor:'',published:false,spotifyUrl:'',objective:'Sync',registration:{status:'none',office:'',protocol:'',date:''},ai:{used:false,tool:'',license:'',humanLyrics:true,humanMelody:true,syntheticVocal:false,notes:''},production:{stage:'mix',owner:'',due:iso(5)},createdAt:Date.now()}
  ],
  contributors:[{id:'c1',trackId:'t1',name:'Autor Demo',role:'Compositor/Letriste',workPct:100,masterPct:100,confirmed:true}],
  tasks:PLAN.map((name,i)=>({id:'task'+(i+1),day:i+1,name,status:i<3?'done':i===3?'doing':'pending',priority:i<15?'alta':i<24?'media':'normal',trackId:'',owner:'',due:iso(i),evidence:'',notes:'',depends:i===0?[]:['task'+i]})),
  orgs:[{id:'o1',name:'Editora Exemplo',type:'Publisher',site:'',territory:'Brasil',source:'Demonstração',verifiedAt:''}],
  contacts:[{id:'p1',orgId:'o1',name:'Contato Exemplo',role:'A&R',email:'',phone:'',source:'Demonstração',verifiedAt:''}],
  submissions:[],documents:[],campaigns:[],revenues:[],events:[],settings:{theme:'dark',aiMode:'rules',currency:'BRL'}
 };
}
function load(){try{let raw=localStorage.getItem(DBKEY)||localStorage.getItem(LEGACYKEY);let data=raw?JSON.parse(raw):seed();if(!localStorage.getItem(DBKEY))localStorage.setItem(DBKEY,JSON.stringify(data));return data}catch(e){return seed()}}
let db=load(), page='dashboard', selectedTrack=null, dossierTab='overview';
function save(){localStorage.setItem(DBKEY,JSON.stringify(db))}
function id(p='x'){return p+Math.random().toString(36).slice(2,9)+Date.now().toString(36)}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:db.settings.currency||'BRL'}).format(+v||0)}
function dateBR(v){if(!v)return '—';let d=new Date(v+'T12:00:00');return isNaN(d)?v:d.toLocaleDateString('pt-BR')}
function stat(s){let [l,c]=STATUS[s]||STATUS.pending;return `<span class="status ${c}">${l}</span>`}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalWrap').classList.add('show')}
function closeModal(){document.getElementById('modalWrap').classList.remove('show')}
function pageHead(title,sub,buttons=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${sub}</p></div><div class="actions">${buttons}</div></div>`}
function renderNav(){let html='';for(let n of NAV){if(n.length===2){html+=`<div class="navgroup"><div class="navlabel">${n[1]}</div>`}else{html+=`<button class="navbtn ${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="navicon">${n[1]}</span>${n[2]}${n[0]==='planner'?`<span class="navcount">${criticalTasks().length}</span>`:''}</button>`}}document.getElementById('nav').innerHTML=html;
 document.getElementById('mobileNav').innerHTML=[['dashboard','⌂','Hoje'],['catalog','♪','Músicas'],['planner','✓','Plano'],['crm','◎','Mercado'],['rights','⚖','Direitos']].map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}
function go(p){page=p;selectedTrack=null;render();window.scrollTo(0,0)}
function log(type,msg,trackId=''){db.events.unshift({id:id('e'),type,msg,trackId,at:new Date().toISOString()});db.events=db.events.slice(0,500);save()}
function trackContribs(tid){return db.contributors.filter(x=>x.trackId===tid)}
function workTotal(tid){return trackContribs(tid).reduce((a,b)=>a+(+b.workPct||0),0)}
function masterTotal(tid){return trackContribs(tid).reduce((a,b)=>a+(+b.masterPct||0),0)}
function docsFor(tid){return db.documents.filter(x=>x.trackId===tid)}
function subsFor(tid){return db.submissions.filter(x=>x.trackId===tid)}
function revFor(tid){return db.revenues.filter(x=>x.trackId===tid)}
function readiness(t){let pts=0,max=11; if(t.title)pts++;if(t.version)pts++;if(t.isrc||!t.published)pts++;if(workTotal(t.id)===100)pts++;if(masterTotal(t.id)===100)pts++;if(t.registration?.status==='registered'||t.registration?.status==='pending')pts++;if(t.genre)pts++;if(t.language)pts++;if(t.objective)pts++;if(t.production?.stage==='master')pts++;if(docsFor(t.id).length)pts++;return Math.round(pts/max*100)}
function blockerList(t){let a=[];if(t.published&&!t.isrc)a.push('ISRC ausente em faixa publicada');if(workTotal(t.id)!==100)a.push(`Splits da obra fecham ${workTotal(t.id)}%`);if(masterTotal(t.id)!==100)a.push(`Splits do master fecham ${masterTotal(t.id)}%`);if(!t.registration||t.registration.status==='none')a.push('Situação de registro autoral não documentada');if(!docsFor(t.id).length)a.push('Nenhuma evidência/documento anexado');if(t.ai?.used&&(!t.ai.license||t.ai.license==='Não verificado'))a.push('Licença/proveniência de IA não verificada');return a}
function criticalTasks(){let today=new Date().toISOString().slice(0,10);return db.tasks.filter(t=>t.status!=='done'&&(t.status==='blocked'||t.due<today||t.priority==='alta'))}
function unlockTasks(){for(let t of db.tasks){if(t.status==='done')continue;let blocked=(t.depends||[]).some(d=>db.tasks.find(x=>x.id===d)?.status!=='done');t.status=blocked?'blocked':(t.status==='blocked'?'pending':t.status)}save()}
function aiRecommendations(){let rec=[];for(let t of db.tracks){for(let b of blockerList(t))rec.push({prio:'Alta',title:t.title,action:b,route:'Regularização'});let r=readiness(t);if(r>=75&&t.objective)rec.push({prio:'Média',title:t.title,action:`Prontidão ${r}%: preparar próximo passo de ${t.objective}`,route:'Mercado'})}
 for(let s of db.submissions){if(s.status!=='ganho'&&s.status!=='perdido'&&s.followup&&s.followup<=new Date().toISOString().slice(0,10))rec.push({prio:'Alta',title:s.orgName||'Contato',action:'Follow-up vencido de pitching',route:'CRM'})}
 for(let t of db.tasks.filter(x=>x.status!=='done').slice(0,5))rec.push({prio:t.priority==='alta'?'Alta':'Normal',title:`Dia ${t.day}`,action:t.name,route:'Plano 30 dias'});return rec.slice(0,24)}
function render(){renderNav();let html='';switch(page){case'dashboard':html=dashboard();break;case'catalog':html=catalog();break;case'dossier':html=dossier();break;case'production':html=production();break;case'rights':html=rights();break;case'documents':html=documents();break;case'planner':html=planner();break;case'crm':html=crm();break;case'launch':html=launch();break;case'revenue':html=revenue();break;case'reports':html=reports();break;case'ai':html=ai();break;case'settings':html=settings();break;default:html=dashboard()}document.getElementById('content').innerHTML=html}
function dashboard(){
 let avg=db.tracks.length?Math.round(db.tracks.reduce((a,t)=>a+readiness(t),0)/db.tracks.length):0,
     done=db.tasks.filter(t=>t.status==='done').length,
     blockers=db.tracks.reduce((a,t)=>a+blockerList(t).length,0),
     openSubs=db.submissions.filter(s=>!['ganho','perdido'].includes(s.status)).length,
     overdueSubs=db.submissions.filter(s=>s.followup&&s.followup<=new Date().toISOString().slice(0,10)&&!['ganho','perdido'].includes(s.status)),
     focus=criticalTasks().slice(0,7),
     pipeActive=db.submissions.filter(s=>['enviado','respondeu','interessado','negociacao'].includes(s.status)).length;
 return pageHead('Hoje','Central de ação do catálogo, do mercado e dos próximos passos',`<button class="btn secondary" onclick="openAssistant('today')">CI · Planejar meu dia</button><button class="btn primary" onclick="quickAdd()">＋ Novo</button>`)+`
 <div class="metricStrip"><div class="metricMini"><b>${avg}%</b><span>prontidão média</span></div><div class="metricMini"><b>${done}/30</b><span>ciclo concluído</span></div><div class="metricMini"><b>${blockers}</b><span>blockers no catálogo</span></div><div class="metricMini"><b>${openSubs}</b><span>oportunidades abertas</span></div></div>
 <div class="grid g3"><div class="card span2"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h3 style="margin-bottom:3px">Foco de hoje</h3><div class="muted">Prioridade operacional, não ranking de música.</div></div><button class="btn ghost small" onclick="go('planner')">Ver plano</button></div><div class="divider"></div>${focus.map(t=>`<div class="focusItem ${t.status}"><i class="focusBar"></i><div><b>${esc(t.name)}</b><div class="muted">Dia ${t.day} · ${t.trackId?esc(db.tracks.find(x=>x.id===t.trackId)?.title||''):'Plano geral'} · ${dateBR(t.due)}</div></div>${stat(t.status)}</div>`).join('')||'<div class="empty">Nenhuma ação crítica agora.</div>'}</div>
 <div class="card"><h3>Prazos & follow-ups</h3>${overdueSubs.slice(0,4).map(s=>`<div class="listrow"><div><b>${esc(s.orgName||'Contato')}</b><div class="muted">Follow-up vencido · ${esc(db.tracks.find(t=>t.id===s.trackId)?.title||'')}</div></div><span class="status st-red">Atrasado</span></div>`).join('')}${db.tasks.filter(t=>t.status!=='done').slice(0,5).map(t=>`<div class="listrow"><div><b>${esc(t.name)}</b><div class="muted">${dateBR(t.due)}</div></div>${stat(t.status)}</div>`).join('')||'<div class="empty">Sem prazos ativos.</div>'}</div></div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Saúde do catálogo</h3><button class="btn ghost small" onclick="go('catalog')">Abrir catálogo</button></div>${[...db.tracks].sort((a,b)=>readiness(b)-readiness(a)).slice(0,8).map(t=>`<div class="healthRow" onclick="openTrack('${t.id}')" style="cursor:pointer"><div><b>${esc(t.title)}</b><div class="muted">${esc(t.objective||'Objetivo comercial não definido')}</div></div><div><div class="progress"><i style="width:${readiness(t)}%"></i></div><div class="tiny" style="margin-top:4px">${readiness(t)}% pronto</div></div>${blockerList(t).length?`<span class="status st-red">${blockerList(t).length} pend.</span>`:'<span class="status st-green">limpo</span>'}</div>`).join('')}</div>
 <div class="card"><h3>Mercado</h3><div class="grid g2"><div><div class="muted">Pipeline ativo</div><div style="font-size:28px;font-weight:900;margin-top:4px">${pipeActive}</div></div><div><div class="muted">Follow-ups vencidos</div><div style="font-size:28px;font-weight:900;margin-top:4px">${overdueSubs.length}</div></div></div><div class="divider"></div>${['alvo','enviado','respondeu','interessado','negociacao'].map(st=>`<div class="listrow"><span>${PIPELABEL[st]}</span><b>${db.submissions.filter(s=>s.status===st).length}</b></div>`).join('')}<button class="btn secondary small" style="margin-top:12px" onclick="go('crm')">Abrir CRM</button></div></div>
 <div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3 style="margin-bottom:3px">Atividade recente</h3><div class="muted">Auditoria do que foi alterado no sistema.</div></div><button class="btn ghost small" onclick="printReport('Auditoria Geral')">Auditoria</button></div><div class="timeline" style="margin-top:14px">${db.events.slice(0,8).map(e=>`<div class="event"><b>${esc(e.msg)}</b><div class="muted">${new Date(e.at).toLocaleString('pt-BR')}</div></div>`).join('')||'<div class="empty">A atividade aparecerá aqui.</div>'}</div></div>`
}
function catalog(){let rows=db.tracks.map(t=>`<tr onclick="openTrack('${t.id}')" style="cursor:pointer"><td><b>${esc(t.title)}</b><div class="tiny">${esc(t.version||'')}</div></td><td>${esc(t.release||'—')}</td><td>${t.published?'<span class="status st-green">Publicado</span>':'<span class="status st-gray">Não lançado</span>'}</td><td>${esc(t.isrc||'—')}</td><td>${esc(t.genre||'—')}</td><td><div class="progress"><i style="width:${readiness(t)}%"></i></div><div class="tiny">${readiness(t)}%</div></td><td>${blockerList(t).length?`<span class="status st-red">${blockerList(t).length} blocker(s)</span>`:'<span class="status st-green">Pronto</span>'}</td></tr>`).join('');return pageHead('Catálogo','Cada música é um dossiê 360 interligado',`<button class="btn secondary" onclick="spotifySetup()">♫ Spotify</button><button class="btn primary" onclick="editTrack()">＋ Nova música</button>`)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Música</th><th>Release</th><th>Publicação</th><th>ISRC</th><th>Gênero</th><th>Prontidão</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="7"><div class="empty">Nenhuma música cadastrada.</div></td></tr>'}</tbody></table></div></div>`}
function editTrack(tid=''){let t=tid?db.tracks.find(x=>x.id===tid):{id:'',title:'',version:'Demo',release:'',releaseDate:'',duration:'',language:'PT-BR',genre:'',bpm:'',key:'',explicit:false,isrc:'',iswc:'',upc:'',distributor:'',published:false,spotifyUrl:'',objective:'',registration:{status:'none'},ai:{used:false},production:{stage:'composição'}};modal(tid?'Editar música':'Nova música',`<form onsubmit="saveTrack(event,'${tid}')"><div class="formgrid"><div><label>Título*</label><input name="title" required value="${esc(t.title)}"></div><div><label>Versão</label><input name="version" value="${esc(t.version||'')}"></div><div><label>Release</label><input name="release" value="${esc(t.release||'')}"></div><div><label>Data de lançamento</label><input type="date" name="releaseDate" value="${esc(t.releaseDate||'')}"></div><div><label>Duração</label><input name="duration" placeholder="03:20" value="${esc(t.duration||'')}"></div><div><label>Idioma</label><input name="language" value="${esc(t.language||'')}"></div><div><label>Gênero</label><input name="genre" value="${esc(t.genre||'')}"></div><div><label>BPM</label><input name="bpm" value="${esc(t.bpm||'')}"></div><div><label>Tom</label><input name="key" value="${esc(t.key||'')}"></div><div><label>ISRC</label><input name="isrc" value="${esc(t.isrc||'')}"></div><div><label>ISWC</label><input name="iswc" value="${esc(t.iswc||'')}"></div><div><label>UPC/EAN</label><input name="upc" value="${esc(t.upc||'')}"></div><div><label>Distribuidora</label><input name="distributor" value="${esc(t.distributor||'')}"></div><div><label>Publicada?</label><select name="published"><option value="0" ${!t.published?'selected':''}>Não</option><option value="1" ${t.published?'selected':''}>Sim</option></select></div><div class="full"><label>Objetivo comercial</label><select name="objective"><option value="">Definir depois</option>${['Publisher / intérprete','Label / gravadora','Sync / audiovisual','Lançamento próprio','Licenciamento de master','Portfólio / catálogo'].map(x=>`<option ${t.objective===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="actions"><button class="btn primary">Salvar</button>${tid?`<button type="button" class="btn danger" onclick="deleteTrack('${tid}')">Excluir</button>`:''}</div></form>`)}
function saveTrack(e,tid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());let old=tid?db.tracks.find(x=>x.id===tid):null;let t=old||{id:id('t'),createdAt:Date.now(),registration:{status:'none'},ai:{used:false},production:{stage:'composição'}};Object.assign(t,o,{published:o.published==='1',explicit:false});if(!tid)db.tracks.unshift(t);save();log(tid?'track.update':'track.create',`${tid?'Música atualizada':'Música criada'}: ${t.title}`,t.id);closeModal();render()}
function deleteTrack(tid){if(!confirm('Excluir esta música e seus vínculos locais?'))return;db.tracks=db.tracks.filter(x=>x.id!==tid);db.contributors=db.contributors.filter(x=>x.trackId!==tid);db.documents=db.documents.filter(x=>x.trackId!==tid);db.submissions=db.submissions.filter(x=>x.trackId!==tid);db.revenues=db.revenues.filter(x=>x.trackId!==tid);save();closeModal();go('catalog')}
function openTrack(tid){selectedTrack=tid;page='dossier';dossierTab='overview';render()}
function dossier(){let t=db.tracks.find(x=>x.id===selectedTrack);if(!t)return go('catalog');let tabs=[['overview','Visão geral'],['production','Produção'],['rights','Direitos'],['registration','Registro'],['distribution','Distribuição'],['ai','IA / Proveniência'],['docs','Documentos'],['pitch','Pitching'],['revenue','Receitas'],['history','Histórico']];let blockers=blockerList(t);let body='';if(dossierTab==='overview')body=`<div class="grid g4"><div class="card kpi"><div class="label">Prontidão comercial</div><div class="value">${readiness(t)}%</div></div><div class="card"><h3>Publicação</h3>${t.published?'<span class="status st-green">Publicado</span>':'<span class="status st-gray">Não lançado</span>'}<div class="muted" style="margin-top:8px">${dateBR(t.releaseDate)}</div></div><div class="card"><h3>Obra / Master</h3><div class="pills"><span class="pill">Obra ${workTotal(t.id)}%</span><span class="pill">Master ${masterTotal(t.id)}%</span></div></div><div class="card"><h3>Documentos</h3><div style="font-size:24px;font-weight:850">${docsFor(t.id).length}</div><div class="muted">evidências ligadas</div></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Identificação</h3><div class="tablewrap"><table><tbody><tr><th>Release</th><td>${esc(t.release||'—')}</td></tr><tr><th>Versão</th><td>${esc(t.version||'—')}</td></tr><tr><th>ISRC</th><td>${esc(t.isrc||'—')}</td></tr><tr><th>ISWC</th><td>${esc(t.iswc||'—')}</td></tr><tr><th>UPC</th><td>${esc(t.upc||'—')}</td></tr><tr><th>Gênero</th><td>${esc(t.genre||'—')}</td></tr><tr><th>Idioma</th><td>${esc(t.language||'—')}</td></tr><tr><th>BPM / Tom</th><td>${esc(t.bpm||'—')} / ${esc(t.key||'—')}</td></tr><tr><th>Objetivo</th><td>${esc(t.objective||'—')}</td></tr></tbody></table></div></div><div class="card"><h3>Blockers</h3>${blockers.map(x=>`<div class="rec"><b>⚠ ${esc(x)}</b><span>Resolver antes de uma negociação que exija direitos/documentação limpa.</span></div>`).join('')||'<div class="callout success">Nenhum blocker detectado pelas regras atuais.</div>'}</div></div>`;
 if(dossierTab==='production')body=productionFor(t);if(dossierTab==='rights')body=rightsFor(t);if(dossierTab==='registration')body=registrationFor(t);if(dossierTab==='distribution')body=distributionFor(t);if(dossierTab==='ai')body=aiFor(t);if(dossierTab==='docs')body=documentsFor(t);if(dossierTab==='pitch')body=pitchFor(t);if(dossierTab==='revenue')body=revenueFor(t);if(dossierTab==='history')body=historyFor(t);
 return pageHead(t.title,`${t.version||''} · ${t.release||'Sem release'} · ${readiness(t)}% pronto`,`<button class="btn ghost" onclick="go('catalog')">← Catálogo</button><button class="btn secondary" onclick="openAssistant('track')">CI · Analisar faixa</button><button class="btn secondary" onclick="editTrack('${t.id}')">Editar</button>`)+`<div class="tabs">${tabs.map(x=>`<button class="tab ${dossierTab===x[0]?'active':''}" onclick="dossierTab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${body}`}
function productionFor(t){let p=t.production||{};let stages=['composição','arranjo','demo','gravação','edição','mix','master','pronto'];return `<div class="grid g2"><div class="card"><h3>Pipeline de produção</h3><form onsubmit="saveProduction(event,'${t.id}')"><div class="field"><label>Etapa</label><select name="stage">${stages.map(x=>`<option ${p.stage===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Responsável</label><input name="owner" value="${esc(p.owner||'')}"></div><div class="field"><label>Prazo</label><input type="date" name="due" value="${esc(p.due||'')}"></div><button class="btn primary">Salvar</button></form></div><div class="card"><h3>Ativos obrigatórios</h3>${['WAV Master 24-bit','Instrumental','Letra final','Capa final'].map(x=>`<div class="listrow"><b>${x}</b>${db.documents.some(d=>d.trackId===t.id&&d.category===x)?'<span class="status st-green">Anexado</span>':'<button class="btn secondary small" onclick="uploadDocument(\''+t.id+'\',\''+x+'\')">Adicionar</button>'}</div>`).join('')}</div></div>`}
function saveProduction(e,tid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries()),t=db.tracks.find(x=>x.id===tid);t.production=o;save();log('production.update',`Produção atualizada: ${t.title}`,tid);toast('Produção salva');render()}
function production(){let rows=db.tracks.map(t=>`<tr><td><b>${esc(t.title)}</b></td><td><span class="status st-blue">${esc(t.production?.stage||'composição')}</span></td><td>${dateBR(t.production?.due)}</td><td>${['WAV Master 24-bit','Instrumental','Letra final','Capa final'].filter(a=>db.documents.some(d=>d.trackId===t.id&&d.category===a)).length}/4</td><td><button class="btn secondary small" onclick="openTrack('${t.id}');dossierTab='production';render()">Abrir</button></td></tr>`).join('');return pageHead('Produção','Da composição ao master, com ativos e responsáveis',`<button class="btn secondary" onclick="openAssistant()">CI · Revisar produção</button>`)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Música</th><th>Etapa</th><th>Prazo</th><th>Ativos principais</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function rightsFor(t){let cs=trackContribs(t.id);return `<div class="grid g2"><div class="card"><h3>Autores, contribuidores e splits</h3>${cs.length?`<div class="tablewrap"><table><thead><tr><th>Nome</th><th>Função</th><th>Obra</th><th>Master</th><th></th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.role)}</td><td>${c.workPct}%</td><td>${c.masterPct}%</td><td><button class="btn danger small" onclick="delContributor('${c.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum titular informado.</div>'}<button class="btn secondary small" style="margin-top:12px" onclick="newContributor('${t.id}')">＋ Contribuidor</button></div><div class="card"><h3>Validação</h3><div class="listrow"><b>Obra</b><span class="status ${workTotal(t.id)===100?'st-green':'st-red'}">${workTotal(t.id)}%</span></div><div class="listrow"><b>Master</b><span class="status ${masterTotal(t.id)===100?'st-green':'st-red'}">${masterTotal(t.id)}%</span></div><div class="callout ${workTotal(t.id)===100&&masterTotal(t.id)===100?'success':'danger'}" style="margin-top:12px">${workTotal(t.id)===100&&masterTotal(t.id)===100?'Splits cadastrados fecham 100% para obra e master.':'Pitch comercial fica bloqueado quando os splits aplicáveis não fecham 100%.'}</div></div></div>`}
function newContributor(tid){modal('Novo contribuidor',`<form onsubmit="saveContributor(event,'${tid}')"><div class="formgrid"><div><label>Nome*</label><input name="name" required></div><div><label>Função</label><input name="role" placeholder="Compositor, letrista, produtor..."></div><div><label>% Obra</label><input type="number" name="workPct" min="0" max="100" step="0.01" value="0"></div><div><label>% Master</label><input type="number" name="masterPct" min="0" max="100" step="0.01" value="0"></div></div><button class="btn primary">Salvar</button></form>`)}
function saveContributor(e,tid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());db.contributors.push({id:id('c'),trackId:tid,name:o.name,role:o.role,workPct:+o.workPct||0,masterPct:+o.masterPct||0,confirmed:true});save();log('rights.contributor',`Contribuidor adicionado: ${o.name}`,tid);closeModal();render()}
function delContributor(cid){let c=db.contributors.find(x=>x.id===cid);db.contributors=db.contributors.filter(x=>x.id!==cid);save();if(c)log('rights.delete',`Contribuidor removido: ${c.name}`,c.trackId);render()}
function registrationFor(t){let r=t.registration||{};return `<div class="grid g2"><div class="card"><h3>Registro autoral</h3><form onsubmit="saveRegistration(event,'${t.id}')"><div class="field"><label>Status</label><select name="status"><option value="none" ${r.status==='none'?'selected':''}>Não documentado</option><option value="pending" ${r.status==='pending'?'selected':''}>Solicitado / em análise</option><option value="registered" ${r.status==='registered'?'selected':''}>Registrado</option></select></div><div class="field"><label>Órgão</label><input name="office" value="${esc(r.office||'')}"></div><div class="field"><label>Protocolo / registro</label><input name="protocol" value="${esc(r.protocol||'')}"></div><div class="field"><label>Data</label><input type="date" name="date" value="${esc(r.date||'')}"></div><button class="btn primary">Salvar</button></form></div><div class="card"><h3>Gestão coletiva</h3><div class="callout">Registro autoral, associação de gestão coletiva, ISWC e ISRC são campos diferentes. O sistema não considera um deles substituto do outro.</div><div class="field" style="margin-top:12px"><label>Associação</label><input id="society${t.id}" value="${esc(t.society||'')}" onchange="setField('${t.id}','society',this.value)"></div></div></div>`}
function saveRegistration(e,tid){e.preventDefault();let t=db.tracks.find(x=>x.id===tid);t.registration=Object.fromEntries(new FormData(e.target).entries());save();log('registration.update',`Registro autoral atualizado: ${t.title}`,tid);toast('Registro salvo');render()}
function setField(tid,k,v){let t=db.tracks.find(x=>x.id===tid);t[k]=v;save()}
function distributionFor(t){return `<div class="grid g2"><div class="card"><h3>Publicação e distribuição</h3><div class="tablewrap"><table><tbody><tr><th>Publicado</th><td>${t.published?'Sim':'Não'}</td></tr><tr><th>Data</th><td>${dateBR(t.releaseDate)}</td></tr><tr><th>Distribuidora</th><td>${esc(t.distributor||'—')}</td></tr><tr><th>ISRC</th><td>${esc(t.isrc||'—')}</td></tr><tr><th>UPC/EAN</th><td>${esc(t.upc||'—')}</td></tr><tr><th>Spotify</th><td>${t.spotifyUrl?`<a href="${esc(t.spotifyUrl)}" target="_blank" style="color:#7fb0ff">Abrir</a>`:'—'}</td></tr></tbody></table></div></div><div class="card"><h3>Importação</h3><div class="callout warn">A integração Spotify real exige credenciais/API. Esta versão não cria dados falsos para simular que veio do Spotify.</div><button class="btn secondary" style="margin-top:12px" onclick="spotifySetup()">Configurar Spotify</button></div></div>`}
function aiFor(t){let a=t.ai||{};return `<div class="grid g2"><div class="card"><h3>Ficha de proveniência</h3><form onsubmit="saveAI(event,'${t.id}')"><div class="field"><label>Usou IA?</label><select name="used"><option value="0" ${!a.used?'selected':''}>Não</option><option value="1" ${a.used?'selected':''}>Sim</option></select></div><div class="field"><label>Ferramenta</label><input name="tool" value="${esc(a.tool||'')}"></div><div class="field"><label>Licença/plano</label><input name="license" value="${esc(a.license||'')}"></div><div class="formgrid"><div><label>Letra humana?</label><select name="humanLyrics"><option value="1" ${a.humanLyrics?'selected':''}>Sim</option><option value="0" ${!a.humanLyrics?'selected':''}>Não</option></select></div><div><label>Melodia humana?</label><select name="humanMelody"><option value="1" ${a.humanMelody?'selected':''}>Sim</option><option value="0" ${!a.humanMelody?'selected':''}>Não</option></select></div><div><label>Vocal sintético?</label><select name="syntheticVocal"><option value="1" ${a.syntheticVocal?'selected':''}>Sim</option><option value="0" ${!a.syntheticVocal?'selected':''}>Não</option></select></div></div><div class="field"><label>Observações</label><textarea name="notes">${esc(a.notes||'')}</textarea></div><button class="btn primary">Salvar</button></form></div><div class="card"><h3>Regra de transparência</h3><div class="callout">A proveniência descreve o processo real. Não transforma uma licença comercial em prova automática de copyright, nem classifica a música como “boa” ou “ruim”.</div></div></div>`}
function saveAI(e,tid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries()),t=db.tracks.find(x=>x.id===tid);t.ai={used:o.used==='1',tool:o.tool,license:o.license,humanLyrics:o.humanLyrics==='1',humanMelody:o.humanMelody==='1',syntheticVocal:o.syntheticVocal==='1',notes:o.notes};save();log('provenance.update',`Proveniência atualizada: ${t.title}`,tid);toast('Proveniência salva');render()}
function documentsFor(t){let ds=docsFor(t.id);return `<div class="card"><div style="display:flex;justify-content:space-between"><div><h3 style="margin-bottom:3px">Cofre da música</h3><div class="muted">Arquivos ficam associados à faixa e entram no histórico.</div></div><button class="btn primary small" onclick="uploadDocument('${t.id}')">＋ Arquivo</button></div><div class="divider"></div>${documentTable(ds)}</div>`}
function documentTable(ds){return ds.length?`<div class="tablewrap"><table><thead><tr><th>Arquivo</th><th>Categoria</th><th>Data upload</th><th>Status</th><th></th></tr></thead><tbody>${ds.map(d=>`<tr><td><b>${esc(d.name)}</b><div class="tiny">${esc(d.size||'')}</div></td><td>${esc(d.category||'Outro')}</td><td>${new Date(d.uploadedAt).toLocaleString('pt-BR')}</td><td>${d.verified?'<span class="status st-green">Verificado</span>':'<span class="status st-yellow">Não verificado</span>'}</td><td><button class="btn danger small" onclick="deleteDoc('${d.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum documento.</div>'}
function uploadDocument(tid='',category=''){modal('Adicionar arquivo / evidência',`<form onsubmit="saveDocument(event,'${tid}','${esc(category)}')"><div class="field"><label>Música</label><select name="trackId"><option value="">Geral</option>${db.tracks.map(t=>`<option value="${t.id}" ${tid===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></div><div class="field"><label>Categoria</label><input name="category" value="${esc(category)}" placeholder="Contrato, registro, letra, WAV Master 24-bit..."></div><div class="field"><label>Arquivo*</label><input type="file" name="file" required></div><div class="callout warn">Neste MVP o navegador guarda metadados do arquivo, não o binário inteiro. Storage cloud + hash SHA-256 entram no backend.</div><button class="btn primary" style="margin-top:12px">Adicionar</button></form>`)}
function saveDocument(e,tid,cat){e.preventDefault();let fd=new FormData(e.target),f=e.target.file.files[0];db.documents.unshift({id:id('d'),trackId:fd.get('trackId')||tid,category:fd.get('category')||cat||'Outro',name:f.name,size:Math.round(f.size/1024)+' KB',mime:f.type,uploadedAt:new Date().toISOString(),verified:false});save();log('document.add',`Arquivo anexado: ${f.name}`,fd.get('trackId')||tid);closeModal();render()}
function deleteDoc(did){let d=db.documents.find(x=>x.id===did);db.documents=db.documents.filter(x=>x.id!==did);save();if(d)log('document.delete',`Arquivo removido: ${d.name}`,d.trackId);render()}
function documents(){return pageHead('Documentos','Cofre de evidências ligado ao catálogo',`<button class="btn primary" onclick="uploadDocument()">＋ Arquivo</button>`)+`<div class="card">${documentTable(db.documents)}</div>`}
function pitchFor(t){return `<div class="grid g2"><div class="card"><h3>Histórico comercial</h3>${submissionTable(subsFor(t.id))}</div><div class="card"><h3>Prontidão para pitch</h3>${blockerList(t).length?`<div class="callout danger"><b>Bloqueado pelas regras atuais.</b><br>${blockerList(t).map(esc).join('<br>')}</div>`:'<div class="callout success">Sem blocker crítico detectado. Isso não substitui revisão jurídica/contratual.</div>'}<button class="btn primary" style="margin-top:12px" onclick="newSubmission('${t.id}')">＋ Registrar oportunidade</button></div></div>`}
function revenueFor(t){return `<div class="card"><div style="display:flex;justify-content:space-between"><h3>Receitas da faixa</h3><button class="btn primary small" onclick="newRevenue('${t.id}')">＋ Receita</button></div>${revenueTable(revFor(t.id))}</div>`}
function historyFor(t){let es=db.events.filter(x=>x.trackId===t.id);return `<div class="card"><div class="timeline">${es.map(e=>`<div class="event"><b>${esc(e.msg)}</b><div class="muted">${new Date(e.at).toLocaleString('pt-BR')} · ${esc(e.type)}</div></div>`).join('')||'<div class="empty">Sem eventos para esta música.</div>'}</div></div>`}
function rights(){return pageHead('Direitos & Registros','Mapa de obra, fonograma, titularidade e documentação',`<button class="btn secondary" onclick="openAssistant()">CI · Revisar pendências</button>`)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Música</th><th>Obra</th><th>Master</th><th>Registro</th><th>IA</th><th>Prontidão</th></tr></thead><tbody>${db.tracks.map(t=>`<tr onclick="openTrack('${t.id}');dossierTab='rights';render()" style="cursor:pointer"><td><b>${esc(t.title)}</b></td><td>${workTotal(t.id)}%</td><td>${masterTotal(t.id)}%</td><td>${t.registration?.status==='registered'?'<span class="status st-green">Registrado</span>':t.registration?.status==='pending'?'<span class="status st-yellow">Em análise</span>':'<span class="status st-red">Pendente</span>'}</td><td>${t.ai?.used?'<span class="status st-purple">Com IA</span>':'<span class="status st-gray">Não declarada</span>'}</td><td>${readiness(t)}%</td></tr>`).join('')}</tbody></table></div></div>`}
function planner(){unlockTasks();let done=db.tasks.filter(t=>t.status==='done').length;return pageHead('Plano de 30 dias','Passo a passo operacional interligado',`<button class="btn secondary" onclick="resetPlanner()">Reiniciar ciclo</button>`)+`<div class="card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:12px"><b>Progresso do ciclo</b><strong>${done}/30</strong></div><div class="progress" style="margin-top:9px;height:10px"><i style="width:${done/30*100}%"></i></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Dia</th><th>Ação</th><th>Prazo</th><th>Prioridade</th><th>Status</th><th></th></tr></thead><tbody>${db.tasks.map(t=>`<tr><td><b>${t.day}</b></td><td><b>${esc(t.name)}</b><div class="tiny">${t.status==='blocked'?'Dependência anterior ainda aberta':''}</div></td><td>${dateBR(t.due)}</td><td>${esc(t.priority)}</td><td>${stat(t.status)}</td><td>${t.status==='done'?`<button class="btn ghost small" onclick="setTask('${t.id}','pending')">Reabrir</button>`:`<button class="btn primary small" ${t.status==='blocked'?'disabled':''} onclick="setTask('${t.id}','done')">Concluir</button>`}</td></tr>`).join('')}</tbody></table></div></div>`}
function setTask(tid,status){let t=db.tasks.find(x=>x.id===tid);t.status=status;save();log('task.status',`${t.name}: ${STATUS[status]?.[0]||status}`,t.trackId);unlockTasks();render()}
function resetPlanner(){if(!confirm('Reiniciar o ciclo de 30 dias mantendo catálogo e documentos?'))return;let today=new Date();db.tasks=PLAN.map((name,i)=>{let d=new Date(today);d.setDate(d.getDate()+i);return{id:'task'+id(),day:i+1,name,status:'pending',priority:i<15?'alta':i<24?'media':'normal',trackId:'',owner:'',due:d.toISOString().slice(0,10),evidence:'',notes:'',depends:i===0?[]:[]}});save();render()}
function crm(){let cols=['alvo','pesquisado','pronto','enviado','respondeu'];return pageHead('Mercado & Pitching','CRM por música: do alvo à negociação',`<button class="btn secondary" onclick="openAssistant('market')">CI · Próximo movimento</button><button class="btn primary" onclick="newSubmission()">＋ Nova oportunidade</button>`)+`<div class="kanban">${cols.map(c=>`<div class="kanCol"><div class="kanHead">${PIPELABEL[c]} <span>${db.submissions.filter(s=>s.status===c).length}</span></div><div class="kanBody">${db.submissions.filter(s=>s.status===c).map(s=>`<div class="kanCard"><b>${esc(s.orgName)}</b><div class="muted">${esc(db.tracks.find(t=>t.id===s.trackId)?.title||'')} · ${esc(s.orgType||'')}</div><select onchange="moveSubmission('${s.id}',this.value)">${PIPE.map(x=>`<option value="${x}" ${s.status===x?'selected':''}>${PIPELABEL[x]}</option>`).join('')}</select></div>`).join('')||'<div class="empty" style="padding:20px 8px">Vazio</div>'}</div></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Todas as submissões</h3>${submissionTable(db.submissions)}</div>`}
function submissionTable(arr){return arr.length?`<div class="tablewrap"><table><thead><tr><th>Empresa</th><th>Tipo</th><th>Música</th><th>Contato</th><th>Status</th><th>Follow-up</th></tr></thead><tbody>${arr.map(s=>`<tr><td><b>${esc(s.orgName)}</b><div class="tiny">${esc(s.source||'')}</div></td><td>${esc(s.orgType||'')}</td><td>${esc(db.tracks.find(t=>t.id===s.trackId)?.title||'—')}</td><td>${esc(s.contactName||'—')}<div class="tiny">${esc(s.email||'')}</div></td><td>${PIPELABEL[s.status]||s.status}</td><td>${dateBR(s.followup)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma oportunidade registrada.</div>'}
function newSubmission(tid=''){modal('Nova oportunidade / pitching',`<form onsubmit="saveSubmission(event,'${tid}')"><div class="formgrid"><div><label>Música*</label><select name="trackId" required>${db.tracks.map(t=>`<option value="${t.id}" ${tid===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></div><div><label>Empresa / organização*</label><input name="orgName" required></div><div><label>Tipo</label><select name="orgType">${['Publisher','Label / gravadora','Sync / supervisor musical','Produtor','Artista / intérprete','Agência / publicidade','Biblioteca musical','Outro'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Contato</label><input name="contactName"></div><div><label>Função</label><input name="role" placeholder="A&R, editor, supervisor..."></div><div><label>E-mail</label><input type="email" name="email"></div><div><label>Fonte do contato</label><input name="source" placeholder="site oficial, evento, indicação..."></div><div><label>Verificado em</label><input type="date" name="verifiedAt"></div><div><label>Estágio</label><select name="status">${PIPE.map(x=>`<option value="${x}">${PIPELABEL[x]}</option>`).join('')}</select></div><div><label>Follow-up</label><input type="date" name="followup"></div><div class="full"><label>Material enviado / observações</label><textarea name="notes"></textarea></div></div><button class="btn primary">Salvar</button></form>`)}
function saveSubmission(e,tid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());db.submissions.unshift({id:id('s'),...o,trackId:o.trackId||tid,createdAt:new Date().toISOString()});save();log('pitch.create',`Oportunidade criada: ${o.orgName}`,o.trackId||tid);closeModal();render()}
function moveSubmission(sid,status){let s=db.submissions.find(x=>x.id===sid);s.status=status;save();log('pitch.stage',`${s.orgName}: ${PIPELABEL[status]}`,s.trackId);render()}
function launch(){return pageHead('Divulgação & Lançamentos','Campanhas, conteúdo e calendário',`<button class="btn primary" onclick="newCampaign()">＋ Nova campanha</button>`)+`<div class="grid g3">${db.campaigns.map(c=>`<div class="card"><h3>${esc(c.name)}</h3><div class="muted">${esc(db.tracks.find(t=>t.id===c.trackId)?.title||'')}</div><div class="divider"></div><div class="pills">${(c.items||[]).map(i=>`<span class="pill">${esc(i)}</span>`).join('')}</div><div class="muted" style="margin-top:12px">Lançamento: ${dateBR(c.releaseDate)}</div></div>`).join('')||'<div class="card span3"><div class="empty"><div class="big">↗</div>Nenhuma campanha criada. Uma campanha transforma pré-save, conteúdo, pitching editorial, Reels/TikTok/Shorts, imprensa, rádio e pós-lançamento em tarefas rastreáveis.</div></div>'}</div>`}
function newCampaign(){modal('Nova campanha de lançamento',`<form onsubmit="saveCampaign(event)"><div class="formgrid"><div><label>Nome*</label><input name="name" required></div><div><label>Música*</label><select name="trackId" required>${db.tracks.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></div><div><label>Data lançamento</label><input type="date" name="releaseDate"></div><div><label>Orçamento</label><input type="number" step="0.01" name="budget"></div><div class="full"><label>Ações (uma por linha)</label><textarea name="items" placeholder="Teaser\nPré-save\nReels\nTikTok\nYouTube Short\nPitching editorial\nImprensa\nRádio\nPós-lançamento"></textarea></div></div><button class="btn primary">Criar</button></form>`)}
function saveCampaign(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());db.campaigns.unshift({id:id('camp'),...o,budget:+o.budget||0,items:o.items.split('\n').map(x=>x.trim()).filter(Boolean)});save();log('campaign.create',`Campanha criada: ${o.name}`,o.trackId);closeModal();render()}
function revenueTable(arr){return arr.length?`<div class="tablewrap"><table><thead><tr><th>Fonte</th><th>Música</th><th>Período</th><th>Valor</th><th>Status</th></tr></thead><tbody>${arr.map(r=>`<tr><td>${esc(r.source)}</td><td>${esc(db.tracks.find(t=>t.id===r.trackId)?.title||'Geral')}</td><td>${esc(r.period||'—')}</td><td>${money(r.amount)}</td><td>${r.received?'<span class="status st-green">Recebido</span>':'<span class="status st-yellow">Pendente</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma receita registrada.</div>'}
function revenue(){let total=db.revenues.reduce((a,b)=>a+(+b.amount||0),0),received=db.revenues.filter(x=>x.received).reduce((a,b)=>a+(+b.amount||0),0);return pageHead('Receitas & Royalties','Controle por fonte, período e música',`<button class="btn primary" onclick="newRevenue()">＋ Receita</button>`)+`<div class="grid g3"><div class="card kpi"><div class="label">Total registrado</div><div class="value" style="font-size:25px">${money(total)}</div></div><div class="card kpi"><div class="label">Recebido</div><div class="value" style="font-size:25px">${money(received)}</div></div><div class="card kpi"><div class="label">Pendente</div><div class="value" style="font-size:25px">${money(total-received)}</div></div></div><div class="card" style="margin-top:14px">${revenueTable(db.revenues)}</div>`}
function newRevenue(tid=''){modal('Registrar receita / royalty',`<form onsubmit="saveRevenue(event,'${tid}')"><div class="formgrid"><div><label>Fonte*</label><input name="source" required placeholder="Spotify via distribuidora, sync, adiantamento..."></div><div><label>Valor*</label><input type="number" step="0.01" name="amount" required></div><div><label>Música</label><select name="trackId"><option value="">Geral</option>${db.tracks.map(t=>`<option value="${t.id}" ${tid===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></div><div><label>Período</label><input name="period" placeholder="2026-07"></div><div><label>Status</label><select name="received"><option value="1">Recebido</option><option value="0">Pendente</option></select></div><div><label>Data</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}"></div></div><button class="btn primary">Salvar</button></form>`)}
function saveRevenue(e,tid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());db.revenues.unshift({id:id('r'),source:o.source,amount:+o.amount||0,trackId:o.trackId||tid,period:o.period,received:o.received==='1',date:o.date});save();log('revenue.add',`Receita registrada: ${o.source}`,o.trackId||tid);closeModal();render()}
function reports(){let cards=[['Dossiê 360','Identificação, produção, direitos, registro, documentos, IA, pitching e receitas.'],['Chain of Title','Titulares, splits, licenças, conflitos e evidências.'],['Catálogo Mestre','Releases, versões, identificadores e prontidão.'],['Plano 30 Dias','Tarefas, progresso, prazos e dependências.'],['Histórico de Pitching','Empresas, contatos, envios, respostas e follow-ups.'],['Auditoria Geral','Linha do tempo completa de alterações.']];return pageHead('Relatórios','Documentação executiva e auditável',`<button class="btn secondary" onclick="exportData()">⇩ Backup JSON</button>`)+`<div class="grid g3">${cards.map((c,i)=>`<div class="card"><h3>${c[0]}</h3><p class="muted">${c[1]}</p><button class="btn secondary small" onclick="printReport('${c[0]}')">Visualizar / imprimir</button></div>`).join('')}</div>`}
function printReport(type){let html=`<html><head><meta charset="utf-8"><title>${esc(type)}</title><style>body{font-family:Arial;padding:30px;color:#111}h1{margin-bottom:5px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:7px;text-align:left}small{color:#666}.box{border:1px solid #ddd;padding:12px;margin:12px 0}</style></head><body><h1>COMPOSER OS — ${esc(type)}</h1><small>Gerado em ${new Date().toLocaleString('pt-BR')}</small>`;if(type==='Catálogo Mestre')html+=`<table><tr><th>Música</th><th>Release</th><th>ISRC</th><th>Prontidão</th><th>Blockers</th></tr>${db.tracks.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(t.release||'')}</td><td>${esc(t.isrc||'')}</td><td>${readiness(t)}%</td><td>${esc(blockerList(t).join('; '))}</td></tr>`).join('')}</table>`;else if(type==='Plano 30 Dias')html+=`<table><tr><th>Dia</th><th>Ação</th><th>Prazo</th><th>Status</th></tr>${db.tasks.map(t=>`<tr><td>${t.day}</td><td>${esc(t.name)}</td><td>${dateBR(t.due)}</td><td>${STATUS[t.status]?.[0]}</td></tr>`).join('')}</table>`;else if(type==='Histórico de Pitching')html+=submissionTable(db.submissions);else if(type==='Auditoria Geral')html+=db.events.map(e=>`<div class="box"><b>${esc(e.msg)}</b><br><small>${new Date(e.at).toLocaleString('pt-BR')}</small></div>`).join('');else{let t=selectedTrack?db.tracks.find(x=>x.id===selectedTrack):db.tracks[0];html+=`<h2>${esc(t?.title||'Catálogo')}</h2><div class="box"><b>Prontidão:</b> ${t?readiness(t):0}%<br><b>Blockers:</b> ${t?esc(blockerList(t).join('; ')||'Nenhum'):''}</div>`}html+='</body></html>';let w=window.open('','_blank');w.document.write(html);w.document.close();w.print()}
function ai(){return pageHead('Composer Intelligence','O assistente agora trabalha dentro do contexto do sistema, não como ranking separado',`<button class="btn primary" onclick="openAssistant()">Abrir assistente</button>`)+`<div class="card"><h3>Nova experiência</h3><p class="muted">Use o botão Composer Intelligence no topo de qualquer tela. Ele entende a página ou música atual e executa ações de workflow: detectar lacunas, transformar blockers em tarefas, gerar pitch, preparar follow-up e checklist de sync. O motor local sempre informa a base da recomendação.</p><button class="btn secondary" onclick="openAssistant()">Abrir Composer Intelligence</button></div>`}
function assistantContext(){let t=selectedTrack?db.tracks.find(x=>x.id===selectedTrack):null;return {page,track:t}}
function openAssistant(intent=''){document.getElementById('assistantShade').classList.add('show');document.getElementById('assistantDrawer').classList.add('show');renderAssistant(intent)}
function closeAssistant(){document.getElementById('assistantShade').classList.remove('show');document.getElementById('assistantDrawer').classList.remove('show')}
function renderAssistant(intent=''){let c=assistantContext(),t=c.track;let chips=[`Tela: ${page==='dashboard'?'Hoje':page}`];if(t)chips.push(`Música: ${t.title}`,`Prontidão: ${readiness(t)}%`);let prompts=t?[['missing','O que falta nesta música?'],['tasks','Transformar blockers em tarefas'],['pitch','Gerar pitch para mercado'],['sync','Checklist para sync'],['rightscheck','Revisar direitos'],['next','Qual é o próximo passo?']]:[['today','Planejar meu dia'],['catalog','Auditar catálogo'],['followup','Preparar follow-up'],['market','Próximos movimentos de mercado']];document.getElementById('assistantBody').innerHTML=`<div class="contextBar">${chips.map(x=>`<span class="contextChip">${esc(x)}</span>`).join('')}<span class="contextChip">Motor local</span></div><div class="assistantPrompts">${prompts.map(p=>`<button class="promptBtn" onclick="assistantRun('${p[0]}')">${p[1]}</button>`).join('')}</div><div class="assistantResponse" id="assistantResponse">${assistantWelcome(intent)}</div><div class="sourceLine">Composer Intelligence usa apenas os dados cadastrados no sistema. Não cria métricas, contatos ou conclusões jurídicas que não estejam documentadas.</div>`;if(intent)assistantRun(intent,true)}
function assistantWelcome(intent=''){let c=assistantContext();if(c.track)return `Contexto carregado: ${c.track.title}.\n\nPosso revisar pendências, gerar textos comerciais e transformar recomendações em tarefas sem sair do dossiê.`;return 'Contexto carregado: workspace.\n\nEscolha uma ação rápida ou escreva uma pergunta. O foco é organizar trabalho, não ranquear músicas.'}
function assistantWrite(text){let el=document.getElementById('assistantResponse');if(el)el.textContent=text}
function assistantAsk(){let q=(document.getElementById('assistantInput')?.value||'').trim();if(!q)return;let l=q.toLowerCase();if(l.includes('pitch'))assistantRun('pitch');else if(l.includes('sync'))assistantRun('sync');else if(l.includes('direit'))assistantRun('rightscheck');else if(l.includes('tarefa')||l.includes('block'))assistantRun('tasks');else if(l.includes('falta')||l.includes('pend'))assistantRun('missing');else if(l.includes('follow'))assistantRun('followup');else assistantRun('next')}
function assistantRun(mode,silent=false){let c=assistantContext(),t=c.track,out='';if(mode==='today'){let f=criticalTasks().slice(0,5);out='PLANO DO DIA\n\n'+(f.length?f.map((x,i)=>`${i+1}. ${x.name} — prazo ${dateBR(x.due)} — ${STATUS[x.status]?.[0]}`).join('\n'):'Nenhuma tarefa crítica no momento.');}
else if(mode==='catalog'){let bad=db.tracks.filter(x=>blockerList(x).length);out=`AUDITORIA DO CATÁLOGO\n\n${db.tracks.length} música(s) cadastrada(s). ${bad.length} têm blockers.\n\n`+bad.map(x=>`• ${x.title}: ${blockerList(x).join('; ')}`).join('\n');}
else if(mode==='market'){let open=db.submissions.filter(s=>!['ganho','perdido'].includes(s.status));out=`MERCADO\n\n${open.length} oportunidade(s) aberta(s). `+(open.length?'Priorize follow-ups vencidos e oportunidades em respondeu/interessado antes de abrir novos contatos.':'Ainda não há oportunidades abertas; selecione faixas com direitos mínimos organizados antes de prospectar.');}
else if(mode==='followup'){let s=db.submissions.find(x=>!['ganho','perdido'].includes(x.status));out=s?`FOLLOW-UP SUGERIDO\n\nOlá, ${s.contactName||'tudo bem?'}\n\nPassando para acompanhar o material que enviei sobre ${db.tracks.find(t=>t.id===s.trackId)?.title||'a música'}. Se fizer sentido para o seu catálogo/projeto, posso enviar ficha de direitos, letra, master e informações adicionais.\n\nObrigado pelo tempo e pela escuta.`:'Nenhuma submissão aberta foi encontrada para preparar follow-up.';}
else if(!t){out='Abra o dossiê de uma música para usar uma análise contextual desta faixa.';}
else if(mode==='missing'){let b=blockerList(t);out=`O QUE FALTA — ${t.title}\n\nProntidão atual: ${readiness(t)}%.\n\n`+(b.length?b.map((x,i)=>`${i+1}. ${x}`).join('\n'):'Nenhum blocker crítico detectado pelas regras atuais.')+`\n\nBase: metadados, splits, registro, documentos e proveniência cadastrados.`;}
else if(mode==='tasks'){let b=blockerList(t),added=0;for(let x of b){if(!db.tasks.some(k=>k.trackId===t.id&&k.notes===`CI:${x}`&&k.status!=='done')){let d=new Date();d.setDate(d.getDate()+3);db.tasks.push({id:id('task'),day:db.tasks.length+1,name:`Resolver: ${x}`,status:'pending',priority:'alta',trackId:t.id,owner:'',due:d.toISOString().slice(0,10),evidence:'',notes:`CI:${x}`,depends:[]});added++}}save();if(added)log('ci.tasks',`${added} tarefa(s) criada(s) pelo Composer Intelligence`,t.id);out=b.length?`${added} nova(s) tarefa(s) criada(s) a partir dos blockers de ${t.title}.\n\nNada foi criado em duplicidade.`:'Não há blockers para transformar em tarefas.';render();}
else if(mode==='pitch'){let route=t.objective||'oportunidade adequada';out=`PITCH — RASCUNHO\n\nOlá,\n\nEstou apresentando “${t.title}”, uma composição ${t.genre?`de ${t.genre}`:'original'} em ${t.language||'idioma não informado'}, atualmente direcionada para ${route}. A obra está sendo organizada no COMPOSER OS com identificação de autores, master, documentação e histórico comercial. Posso encaminhar a versão adequada para escuta, letra, ficha técnica e situação dos direitos conforme sua necessidade.\n\nSe a faixa fizer sentido para seu repertório, catálogo editorial ou projeto, fico à disposição para conversar sobre gravação, licenciamento ou parceria.\n\nObrigado pela atenção.`;}
else if(mode==='sync'){let checks=[['Master identificado',t.production?.stage==='master'],['ISRC quando publicado',!t.published||!!t.isrc],['Splits da obra em 100%',workTotal(t.id)===100],['Splits do master em 100%',masterTotal(t.id)===100],['Instrumental anexado',db.documents.some(d=>d.trackId===t.id&&/instrumental/i.test(d.category||d.name||''))],['Proveniência de IA documentada',!t.ai?.used||!!(t.ai.license&&t.ai.license!=='Não verificado')]];out=`CHECKLIST SYNC — ${t.title}\n\n`+checks.map(x=>`${x[1]?'✓':'✗'} ${x[0]}`).join('\n')+`\n\nItens com ✗ devem ser tratados antes de afirmar que o pacote está limpo para licenciamento.`;}
else if(mode==='rightscheck'){out=`REVISÃO DE DIREITOS — ${t.title}\n\nObra: ${workTotal(t.id)}%\nMaster: ${masterTotal(t.id)}%\nRegistro: ${t.registration?.status||'não informado'}\nISRC: ${t.isrc||'ausente'}\nISWC: ${t.iswc||'ausente'}\nDocumentos ligados: ${docsFor(t.id).length}\n\n${blockerList(t).length?'Atenção: '+blockerList(t).join('; '):'Nenhum conflito identificado pelas regras locais.'}\n\nIsto é controle documental, não parecer jurídico.`;}
else {let b=blockerList(t);out=b.length?`PRÓXIMO PASSO\n\nPriorize “${b[0]}”. Enquanto isso estiver aberto, a prontidão comercial de ${t.title} permanece limitada.`:`PRÓXIMO PASSO\n\n${t.title} não tem blocker crítico pelas regras atuais. Próxima ação sugerida: ${t.objective?`preparar material e contato alinhado à rota “${t.objective}”`:'definir o objetivo comercial da faixa antes do pitching'}.`;}
assistantWrite(out)}
function settings(){return pageHead('Configurações','Integrações, dados e segurança')+`<div class="grid g2"><div class="card"><h3>Spotify</h3><div class="field"><label>URL ou ID do artista</label><input id="spotifyUrl" value="${esc(db.profile.spotifyUrl||'')}" placeholder="https://open.spotify.com/artist/..."></div><div class="callout ${db.profile.spotifyConnected?'success':'warn'}">${db.profile.spotifyConnected?'Conector marcado como configurado.':'Ainda não há credenciais de API nesta implantação. A URL pode ser salva, mas o app não simula importação real.'}</div><button class="btn secondary" style="margin-top:12px" onclick="saveSpotify()">Salvar URL</button></div><div class="card"><h3>Dados</h3><div class="actions"><button class="btn secondary" onclick="exportData()">Backup JSON</button><label class="btn secondary" style="cursor:pointer">Importar JSON<input type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></label><button class="btn danger" onclick="resetAll()">Restaurar demonstração</button></div><div class="muted" style="margin-top:12px">Os dados desta primeira versão ficam neste navegador. Backend cloud será o próximo passo para login, storage e sincronização entre dispositivos.</div></div></div>`}
function spotifySetup(){go('settings')}
function saveSpotify(){db.profile.spotifyUrl=document.getElementById('spotifyUrl').value.trim();save();toast('URL do Spotify salva. Integração real aguarda credenciais de API.')}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='composer-os-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();toast('Backup importado')}catch(e){alert('Arquivo inválido')}};r.readAsText(f)}
function resetAll(){if(confirm('Apagar todos os dados locais e restaurar demonstração?')){db=seed();save();render()}}
function quickAdd(){modal('Criar rapidamente',`<div class="grid g2"><button class="btn secondary" onclick="closeModal();editTrack()">♪ Nova música</button><button class="btn secondary" onclick="closeModal();newSubmission()">◎ Novo pitching</button><button class="btn secondary" onclick="closeModal();uploadDocument()">▣ Documento</button><button class="btn secondary" onclick="closeModal();newRevenue()">R$ Receita</button><button class="btn secondary" onclick="closeModal();newCampaign()">↗ Campanha</button><button class="btn secondary" onclick="closeModal();go('planner')">✓ Plano 30 dias</button></div>`)}
function doGlobalSearch(q){q=q.trim().toLowerCase();if(!q)return;let t=db.tracks.find(x=>[x.title,x.isrc,x.release].some(v=>String(v||'').toLowerCase().includes(q)));if(t&&q.length>2){selectedTrack=t.id;page='dossier';dossierTab='overview';render()}}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
