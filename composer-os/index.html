<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0f14"><title>COMPOSER OS v2.1</title><style>:root{--bg:#0a0f14;--panel:#10161d;--panel2:#151c24;--line:#27313b;--text:#f3f6f8;--muted:#8c99a6;--green:#49c98d;--red:#ef6a75;--yellow:#e8b84a;--blue:#6ca8ff;--radius:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid #202933;background:#0b1016;padding:18px 12px;position:sticky;top:0;height:100vh}.brand{padding:6px 10px 18px}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);margin-top:3px}.group{color:#607284;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:12px 10px 5px}.nav{width:100%;border:0;background:transparent;color:#c7d0d8;text-align:left;padding:10px 11px;border-radius:9px;margin:2px 0;cursor:pointer}.nav:hover,.nav.on{background:#151d26;color:white}.nav.on{box-shadow:inset 3px 0 var(--blue)}.main{min-width:0}.top{height:62px;border-bottom:1px solid #202933;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:rgba(10,15,20,.94);backdrop-filter:blur(12px);z-index:20}.top input{max-width:460px;width:55%;background:#111820;color:#fff;border:1px solid #28333e;border-radius:10px;padding:9px 11px}.top .a{display:flex;gap:8px}.icon{border:1px solid #303b46;background:#121920;color:#e5eaf0;border-radius:9px;padding:9px 11px;cursor:pointer}.content{padding:22px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.head h1{font-size:26px;margin:0}.head p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:750;cursor:pointer}.primary{background:#eef2f6;color:#111820}.secondary{background:#162334;color:#d8e3ef;border:1px solid #30445c}.ghost{background:transparent;color:#c6d2df;border:1px solid #303b46}.danger{background:#3c2025;color:#ffc5cb}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.muted{color:var(--muted);font-size:12px}.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:750;padding:4px 7px;border-radius:999px}.ok{background:#143a2e;color:#61dba3}.no{background:#402128;color:#ff8993}.wait{background:#403417;color:#f4c45f}.info{background:#17325c;color:#82b0ff}.list{display:flex;flex-direction:column}.row{display:grid;grid-template-columns:6px 1fr auto;gap:11px;padding:12px 0;border-bottom:1px solid #222c36;align-items:center}.row:last-child{border:0}.bar{height:100%;min-height:38px;border-radius:7px;background:var(--red)}.bar.b{background:var(--blue)}.bar.y{background:var(--yellow)}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.meta span{font-size:10px;color:#8896a4;border:1px solid #303b46;border-radius:999px;padding:3px 6px}.queue{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:12px}.next{border:1px solid #35414c;background:#111820;border-radius:13px;padding:15px}.next small{color:#7f8d9b;text-transform:uppercase;letter-spacing:.11em;font-size:10px}.next h3{margin:7px 0 5px}.next p{color:#96a3af;font-size:12px;line-height:1.45}.stages{display:grid;grid-template-columns:repeat(5,minmax(155px,1fr));gap:8px;overflow:auto}.stage{background:#0d1319;border:1px solid #27313b;border-radius:11px;padding:9px;min-height:145px}.stage h4{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#83909c;margin:0 0 8px}.chip{background:#151c24;border:1px solid #303a45;border-radius:8px;padding:8px;margin:6px 0;cursor:pointer}.chip b{font-size:12px}.chip small{display:block;color:#8794a1;margin-top:3px}.gategrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.gate{border:1px solid #33404b;border-radius:11px;padding:12px;background:#0d141a}.gate.good{border-color:#245b45;background:#0d2018}.gate.bad{border-color:#63343c;background:#211216}.gate b{font-size:12px}.gate small{display:block;color:#8f9ba7;margin-top:6px;line-height:1.4}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #26303a;text-align:left;vertical-align:top}th{font-size:10px;color:#7f8d9c;text-transform:uppercase;letter-spacing:.06em}td{font-size:12px}.scroll{overflow:auto}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap;border:1px solid #303b46;background:#111820;color:#c4ced7;border-radius:8px;padding:8px 9px;cursor:pointer}.tab.on{background:#e9edf1;color:#111820}.field{margin-bottom:10px}label{display:block;color:#9aa7b4;font-size:11px;font-weight:700;margin-bottom:4px}input,select,textarea{width:100%;background:#0d141b;color:#fff;border:1px solid #303b46;border-radius:9px;padding:9px}textarea{min-height:80px;resize:vertical}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.full{grid-column:1/-1}.kanban{display:grid;grid-template-columns:repeat(9,minmax(200px,1fr));gap:9px;overflow:auto}.kcol{background:#0d1319;border:1px solid #27313b;border-radius:11px;min-height:300px}.khead{padding:9px;border-bottom:1px solid #27313b;font-size:11px;font-weight:800}.kbody{padding:7px}.kcard{background:#151c24;border:1px solid #303b46;border-radius:8px;padding:8px;margin-bottom:7px}.kcard small{display:block;color:#8b98a4;margin-top:4px}.drawerShade{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:99}.drawerShade.on{display:block}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(500px,100vw);background:#0b1117;border-left:1px solid #303b46;z-index:100;transform:translateX(100%);transition:.2s;display:flex;flex-direction:column}.drawer.on{transform:none}.dhead{display:flex;justify-content:space-between;gap:10px;padding:16px;border-bottom:1px solid #29333d}.dhead b{font-size:15px}.dbody{padding:14px;overflow:auto;flex:1}.prompts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.pbtn{background:#121920;border:1px solid #303b46;color:#dde4eb;border-radius:9px;padding:9px;text-align:left;cursor:pointer}.answer{min-height:220px;background:#080c10;border:1px solid #2d3741;border-radius:10px;padding:12px;white-space:pre-wrap;font-size:12px;line-height:1.55}.compose{padding:12px;border-top:1px solid #29333d}.modalShade{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:120;padding:12px}.modalShade.on{display:flex}.modal{background:#10161d;border:1px solid #303b46;border-radius:13px;width:min(760px,100%);max-height:90vh;overflow:auto}.mhead{display:flex;justify-content:space-between;padding:13px 15px;border-bottom:1px solid #29333d}.mbody{padding:15px}.close{background:transparent;border:0;color:#ccd5dd;font-size:22px;cursor:pointer}.mobile{display:none}.toast{position:fixed;right:16px;bottom:16px;background:#151d25;border:1px solid #34414d;border-radius:9px;padding:10px 12px;display:none;z-index:150}.toast.on{display:block}@media(max-width:900px){.app{display:block}.side{display:none}.content{padding:14px 14px 78px}.top{padding:0 12px}.top input{width:65%}.queue,.g2,.g3,.gategrid{grid-template-columns:1fr}.mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#0b1117;border-top:1px solid #27313b;z-index:40}.mobile button{background:transparent;border:0;color:#9da9b5;padding:9px 4px;font-size:10px}.mobile button b{display:block;font-size:15px;color:#e7ecf1}.head{flex-direction:column}.form{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand"><b>COMPOSER OS</b><small>Music Business Workspace</small></div><div id="nav"></div></aside><section class="main"><header class="top"><input placeholder="Buscar música, ISRC, contato..." oninput="searchNow(this.value)"><div class="a"><button class="icon" onclick="openCI()">CI</button><button class="icon" onclick="quick()">＋</button></div></header><main class="content" id="view"></main></section></div><div class="mobile" id="mobile"></div><div class="drawerShade" id="dshade" onclick="closeCI()"></div><aside class="drawer" id="drawer"><div class="dhead"><div><b>Composer Intelligence</b><div class="muted">assistência contextual — não ranking</div></div><button class="close" onclick="closeCI()">×</button></div><div class="dbody"><div id="ctx" class="meta"></div><div class="prompts"><button class="pbtn" onclick="askCI('O que está bloqueando?')">O que está bloqueando?</button><button class="pbtn" onclick="askCI('Qual é a próxima ação?')">Próxima ação</button><button class="pbtn" onclick="askCI('Prepare um pitch profissional')">Preparar pitch</button><button class="pbtn" onclick="askCI('Revise os direitos')">Revisar direitos</button><button class="pbtn" onclick="askCI('Monte checklist de sync')">Checklist sync</button><button class="pbtn" onclick="askCI('Transforme blockers em tarefas')">Criar tarefas</button></div><div class="answer" id="answer">Abra uma música ou uma área e peça uma ação. O sistema usa apenas dados autorizados do workspace.</div><div class="muted" id="source" style="margin-top:8px">Fonte: dados locais.</div></div><div class="compose"><textarea id="prompt" placeholder="Ex.: prepare um follow-up para esta oportunidade"></textarea><button class="btn primary" style="margin-top:7px" onclick="askCI()">Executar</button></div></aside><div class="modalShade" id="mshade"><div class="modal"><div class="mhead"><b id="mtitle"></b><button class="close" onclick="closeM()">×</button></div><div class="mbody" id="mbody"></div></div></div><div class="toast" id="toast"></div><script>const K='composer_os_v21';const STAGES=['composicao','demo','arranjo','producao','gravacao','edicao','mix','master'];const PIPE=['alvo','pesquisado','pronto','enviado','respondeu','interessado','negociacao','ganho','perdido'];const PL={alvo:'Alvo',pesquisado:'Pesquisado',pronto:'Pronto',enviado:'Enviado',respondeu:'Respondeu',interessado:'Interessado',negociacao:'Negociação',ganho:'Ganho',perdido:'Perdido'};const PLAN=['Criar perfil e objetivos','Conectar/importar catálogo','Validar releases e versões','Conferir ISRC/UPC','Separar obra x fonograma','Mapear autores e splits','Organizar contratos e licenças','Cadastrar registros autorais','Verificar gestão coletiva/ISWC','Documentar uso de IA','Completar WAV/master/instrumental','Anexar letra e capa','Auditar metadados','Corrigir pendências críticas','Definir objetivo comercial por faixa','Classificar rota: publisher/label/sync','Preparar one-sheet/EPK','Selecionar 3 faixas para pitch','Pesquisar empresas-alvo','Validar contatos reais','Primeira rodada de pitching','Registrar respostas e sinais','Segunda rodada segmentada','Preparar pacote sync','Preparar pacote publisher/intérprete','Preparar pacote label/gravadora','Executar follow-ups','Conciliar receitas e statements','Gerar dossiês e auditoria','Planejar próximo ciclo'];function seed(){let d=n=>{let x=new Date;x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};return{profile:{name:'Compositor Independente',artist:'Meu Catálogo',spotify:'',connected:false},tracks:[{id:'t1',title:'Exemplo — Horizonte',version:'Master',release:'Single de demonstração',published:true,date:d(-40),genre:'Pop',language:'PT-BR',isrc:'BR-DEM-26-00001',iswc:'',upc:'',objective:'Publisher / intérprete',stage:'master',registration:'pending',ai:{used:true,tool:'Ferramenta demonstrativa',license:'Não verificado'}},{id:'t2',title:'Exemplo — Pulso',version:'Demo',release:'Não lançado',published:false,date:'',genre:'Electronic',language:'EN',isrc:'',iswc:'',upc:'',objective:'Sync / licenciamento',stage:'mix',registration:'none',ai:{used:false,tool:'',license:''}}],contributors:[{id:'c1',track:'t1',name:'Autor Demo',role:'Compositor/Letriste',work:100,master:100}],tasks:PLAN.map((x,i)=>({id:'q'+i,day:i+1,name:x,status:i<3?'done':i===3?'doing':'pending',priority:i<15?'alta':'media',track:'',due:d(i),depends:i?['q'+(i-1)]:[]})),opps:[],docs:[],campaigns:[],revenues:[],events:[]}}function load(){try{return JSON.parse(localStorage.getItem(K))||seed()}catch(e){return seed()}}let db=load(),page='today',trackId=null,tab='decisions';function save(){localStorage.setItem(K,JSON.stringify(db))}function id(p){return p+Math.random().toString(36).slice(2,8)+Date.now().toString(36)}function esc(x=''){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function br(x){if(!x)return'—';return new Date(x+'T12:00:00').toLocaleDateString('pt-BR')}function money(x){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(+x||0)}function contrib(t){return db.contributors.filter(c=>c.track===t)}function work(t){return contrib(t).reduce((a,c)=>a+(+c.work||0),0)}function master(t){return contrib(t).reduce((a,c)=>a+(+c.master||0),0)}function docs(t){return db.docs.filter(x=>x.track===t)}function opps(t){return db.opps.filter(x=>x.track===t)}function blockers(t){let a=[];if(t.published&&!t.isrc)a.push('ISRC ausente em faixa publicada');if(work(t.id)!==100)a.push('Splits da obra fecham '+work(t.id)+'%');if(master(t.id)!==100)a.push('Splits do master fecham '+master(t.id)+'%');if(t.registration==='none')a.push('Situação de registro autoral não documentada');if(!docs(t.id).length)a.push('Nenhuma evidência/documento anexado');if(t.ai?.used&&(!t.ai.license||t.ai.license==='Não verificado'))a.push('Licença/proveniência de IA não verificada');return a}function gates(t){let r=work(t.id)===100&&master(t.id)===100,ds=docs(t.id).length>0,m=t.stage==='master',ids=!t.published||!!t.isrc,ai=!t.ai?.used||(t.ai.license&&t.ai.license!=='Não verificado');return{publisher:{ok:work(t.id)===100&&!!t.objective,why:work(t.id)!==100?'Fechar splits da obra':!t.objective?'Definir rota comercial':'Obra organizada para abordagem'},sync:{ok:r&&ds&&m&&ids&&ai,why:!r?'Direitos incompletos':!m?'Master não finalizado':!ds?'Faltam evidências/ativos':!ids?'ISRC ausente':!ai?'Proveniência de IA pendente':'Checklist básico liberado'},label:{ok:m&&master(t.id)===100&&ids,why:!m?'Finalizar master':master(t.id)!==100?'Fechar master':'Fonograma pronto para abordagem'}}}function next(t){let b=blockers(t);if(b.length)return{title:b[0],why:'Esse item impede ou enfraquece uma negociação profissional.',route:'Regularização'};if(t.stage!=='master')return{title:'Avançar produção até o master',why:'O fonograma ainda está em produção.',route:'Produção'};if(!opps(t.id).length)return{title:'Criar primeira oportunidade comercial',why:'A faixa está organizada, mas ainda não entrou no pipeline de mercado.',route:t.objective||'Mercado'};let o=opps(t.id).find(x=>!['ganho','perdido'].includes(x.status));if(o)return{title:'Executar próximo follow-up',why:'Há oportunidade aberta em '+o.org+'.',route:'CRM'};return{title:'Revisar estratégia da faixa',why:'Sem blocker urgente detectado.',route:'Estratégia'}}function stage(t){if(opps(t.id).some(o=>['interessado','negociacao'].includes(o.status)))return'neg';if(opps(t.id).some(o=>['enviado','respondeu'].includes(o.status)))return'market';let g=gates(t);if(g.publisher.ok||g.sync.ok||g.label.ok)return'ready';if(t.stage==='master')return'rights';return'prod'}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}function modal(t,b){document.getElementById('mtitle').textContent=t;document.getElementById('mbody').innerHTML=b;document.getElementById('mshade').classList.add('on')}function closeM(){document.getElementById('mshade').classList.remove('on')}function head(t,s,b=''){return`<div class="head"><div><h1>${t}</h1><p>${s}</p></div><div class="actions">${b}</div></div>`}const NAV=[['GESTÃO'],['today','Hoje'],['catalog','Catálogo'],['production','Produção'],['rights','Direitos & Registros'],['docs','Documentos'],['plan','Plano 30 dias'],['MERCADO'],['market','Mercado & Pitching'],['launch','Divulgação & Lançamentos'],['revenue','Receitas & Royalties'],['SISTEMA'],['reports','Relatórios'],['settings','Configurações']];function nav(){let h='';NAV.forEach(n=>{h+=n.length===1?`<div class="group">${n[0]}</div>`:`<button class="nav ${page===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`});document.getElementById('nav').innerHTML=h;document.getElementById('mobile').innerHTML=[['today','⌂','Hoje'],['catalog','♪','Músicas'],['plan','✓','Plano'],['market','◎','Mercado']].map(n=>`<button onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('')+`<button onclick="openCI()"><b>CI</b>Inteligência</button>`}function go(p){page=p;trackId=null;render();scrollTo(0,0)}function today(){let open=db.tasks.filter(t=>t.status!=='done').slice(0,8),st={prod:[],rights:[],ready:[],market:[],neg:[]};db.tracks.forEach(t=>st[stage(t)].push(t));let bl=db.tracks.reduce((a,t)=>a+blockers(t).length,0);return head('Hoje','Seu trabalho musical organizado por próxima ação — não por score.',`<button class="btn secondary" onclick="openCI()">CI Composer Intelligence</button><button class="btn primary" onclick="quick()">＋ Novo</button>`)+`<div class="queue"><div class="card"><b>Fila de execução</b><div class="muted">O sistema prioriza trabalho que bloqueia produção, direitos ou mercado.</div><div class="list">${open.map(t=>`<div class="row"><div class="bar ${t.status==='doing'?'b':''}"></div><div><b>${esc(t.name)}</b><div class="meta"><span>${esc(t.priority)}</span><span>${br(t.due)}</span>${t.status==='blocked'?'<span>bloqueada</span>':''}</div></div><button class="btn secondary" ${t.status==='blocked'?'disabled':''} onclick="doneTask('${t.id}')">Concluir</button></div>`).join('')}</div></div><div class="grid"><div class="next"><small>Situação operacional</small><h3>${bl} blockers no catálogo</h3><p>${db.tracks.length} músicas sob gestão. ${db.opps.filter(o=>!['ganho','perdido'].includes(o.status)).length} oportunidades comerciais abertas.</p><button class="btn primary" onclick="openCI()">Decidir próxima ação</button></div><div class="card"><b>Portas do mercado</b>${db.tracks.map(t=>{let g=gates(t);return`<div style="padding:10px 0;border-bottom:1px solid #27313b"><b>${esc(t.title)}</b><div class="muted">Publisher ${g.publisher.ok?'✓':'×'} · Sync ${g.sync.ok?'✓':'×'} · Label ${g.label.ok?'✓':'×'}</div></div>`}).join('')}</div></div></div><div class="card" style="margin-top:12px"><b>Fluxo do catálogo</b><div class="stages" style="margin-top:10px">${[['prod','Em produção'],['rights','Organizando direitos'],['ready','Pode apresentar'],['market','No mercado'],['neg','Em negociação']].map(x=>`<div class="stage"><h4>${x[1]} · ${st[x[0]].length}</h4>${st[x[0]].map(t=>`<div class="chip" onclick="openTrack('${t.id}')"><b>${esc(t.title)}</b><small>${esc(next(t).title)}</small></div>`).join('')}</div>`).join('')}</div></div>`}function catalog(){return head('Catálogo','Cada música é um ativo com produção, direitos, evidências e rota comercial.',`<button class="btn primary" onclick="editTrack()">＋ Nova música</button>`)+`<div class="card scroll"><table><tr><th>Música</th><th>Release</th><th>Publicação</th><th>ISRC</th><th>Mercado</th><th>Próxima ação</th></tr>${db.tracks.map(t=>{let g=gates(t),m=g.publisher.ok||g.sync.ok||g.label.ok,n=next(t);return`<tr onclick="openTrack('${t.id}')" style="cursor:pointer"><td><b>${esc(t.title)}</b><div class="muted">${esc(t.version)}</div></td><td>${esc(t.release||'—')}</td><td>${t.published?'<span class="status ok">Publicado</span>':'<span class="status wait">Não lançado</span>'}</td><td>${esc(t.isrc||'—')}</td><td>${m?'<span class="status ok">Há rota liberada</span>':'<span class="status no">Bloqueada</span>'}</td><td><b>${esc(n.title)}</b><div class="muted">${esc(n.route)}</div></td></tr>`}).join('')}</table></div>`}function editTrack(idt=''){let t=idt?db.tracks.find(x=>x.id===idt):null;modal(t?'Editar música':'Nova música',`<form onsubmit="saveTrack(event,'${idt}')"><div class="form"><div><label>Título*</label><input name="title" required value="${esc(t?.title||'')}"></div><div><label>Versão</label><input name="version" value="${esc(t?.version||'Master')}"></div><div><label>Release</label><input name="release" value="${esc(t?.release||'')}"></div><div><label>Data</label><input type="date" name="date" value="${esc(t?.date||'')}"></div><div><label>Gênero</label><input name="genre" value="${esc(t?.genre||'')}"></div><div><label>Idioma</label><input name="language" value="${esc(t?.language||'PT-BR')}"></div><div><label>ISRC</label><input name="isrc" value="${esc(t?.isrc||'')}"></div><div><label>ISWC</label><input name="iswc" value="${esc(t?.iswc||'')}"></div><div><label>UPC/EAN</label><input name="upc" value="${esc(t?.upc||'')}"></div><div><label>Objetivo</label><select name="objective">${['','Publisher / intérprete','Label / gravadora','Sync / licenciamento','Lançamento próprio','Catálogo / portfólio'].map(x=>`<option ${t?.objective===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Produção</label><select name="stage">${STAGES.map(x=>`<option ${t?.stage===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Publicado?</label><select name="published"><option value="0" ${!t?.published?'selected':''}>Não</option><option value="1" ${t?.published?'selected':''}>Sim</option></select></div></div><button class="btn primary" style="margin-top:12px">Salvar</button></form>`)}function saveTrack(e,idt){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries()),t=idt?db.tracks.find(x=>x.id===idt):{id:id('t'),registration:'none',ai:{used:false,tool:'',license:''}};Object.assign(t,o);t.published=o.published==='1';if(!idt)db.tracks.unshift(t) .map(r=>`<tr><td>${esc(r.source)}</td><td>${esc(db.tracks.find(t=>t.id===r.track)?.title||'Geral')}</td><td>${esc(r.period||'')}</td><td>${money(r.amount)}</td><td>${r.received?'<span class="status ok">Recebido</span>':'<span class="status wait">Pendente</span>'}</td></tr>`).join('')}</table>`}function newRev(){modal('Registrar receita',`<form onsubmit="saveRev(event)"><div class="form"><div><label>Fonte</label><input name="source" required></div><div><label>Valor</label><input type="number" step="0.01" name="amount" required></div><div><label>Música</label><select name="track"><option value="">Geral</option>${db.tracks.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></div><div><label>Período</label><input name="period"></div><div><label>Status</label><select name="received"><option value="1">Recebido</option><option value="0">Pendente</option></select></div></div><button class="btn primary">Salvar</button></form>`)}function saveRev(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());db.revenues.unshift({id:id('r'),source:o.source,amount:+o.amount,track:o.track,period:o.period,received:o.received==='1'});save();closeM();render()}function reports(){return head('Relatórios','Dossiês e auditoria baseados no que está realmente cadastrado.',`<button class="btn secondary" onclick="exportData()">Backup JSON</button>`)+`<div class="g3 grid">${[['Dossiê 360','Metadados, produção, direitos, documentos, pitching e receitas.'],['Chain of Title','Titulares, splits, registros e evidências.'],['Plano 30 Dias','Tarefas, dependências e histórico.'],['Histórico de Pitching','Empresas, contatos, status e follow-ups.'],['Mapa de Receitas','Valores registrados por fonte e faixa.'],['Auditoria','Linha do tempo e alterações.']].map(x=>`<div class="card"><b>${x[0]}</b><p class="muted">${x[1]}</p><button class="btn secondary" onclick="window.print()">Visualizar / imprimir</button></div>`).join('')}</div>`}function settings(){return head('Configurações','Integrações, dados e segurança.')+`<div class="g2 grid"><div class="card"><b>Spotify</b><div class="field" style="margin-top:10px"><label>URL/ID do artista</label><input id="sp" value="${esc(db.profile.spotify||'')}"></div><p class="muted">A URL é salva, mas o app não simula importação. A ingestão real exige Spotify Web API/OAuth.</p><button class="btn secondary" onclick="db.profile.spotify=document.getElementById('sp').value;save();toast('Spotify salvo')">Salvar</button></div><div class="card"><b>Dados</b><p class="muted">Nesta versão os dados operacionais ficam no navegador. Backend cloud, autenticação e storage são a próxima fundação.</p><button class="btn secondary" onclick="exportData()">Exportar backup</button> <button class="btn danger" onclick="if(confirm('Restaurar demonstração?')){db=seed();save();render()}">Restaurar demo</button></div></div>`}function exportData(){let a=document.createElement('a'),b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='composer-os-backup.json';a.click()}function quick(){modal('Criar rapidamente',`<div class="g2 grid"><button class="btn secondary" onclick="closeM();editTrack()">Nova música</button><button class="btn secondary" onclick="closeM();newOpp()">Oportunidade</button><button class="btn secondary" onclick="closeM();addDoc()">Documento</button><button class="btn secondary" onclick="closeM();newCamp()">Campanha</button><button class="btn secondary" onclick="closeM();newRev()">Receita</button><button class="btn secondary" onclick="closeM();go('plan')">Plano 30 dias</button></div>`)}function searchNow(q){q=q.toLowerCase().trim();if(q.length<3)return;let t=db.tracks.find(x=>[x.title,x.isrc,x.release].some(v=>String(v||'').toLowerCase().includes(q)));if(t)openTrack(t.id)}function ciTrack(){return trackId?db.tracks.find(t=>t.id===trackId):db.tracks.find(t=>blockers(t).length)||db.tracks[0]}function openCI(){document.getElementById('dshade').classList.add('on');document.getElementById('drawer').classList.add('on');let t=ciTrack();document.getElementById('ctx').innerHTML=`<span>Tela: ${esc(page)}</span>${t?`<span>Música: ${esc(t.title)}</span><span>Rota: ${esc(t.objective||'não definida')}</span>`:''}`;if(t){let n=next(t);document.getElementById('answer').textContent=`Contexto: ${t.title}\n\nPróxima ação: ${n.title}\nMotivo: ${n.why}\nRota: ${n.route}`}}function closeCI(){document.getElementById('dshade').classList.remove('on');document.getElementById('drawer').classList.remove('on')}async function askCI(p){let t=ciTrack(),box=document.getElementById('answer'),src=document.getElementById('source'),q=(p||document.getElementById('prompt').value||'Qual é a próxima ação?').trim();box.textContent='Analisando contexto...';let context={page,profile:db.profile,track:t,blockers:t?blockers(t):[],gates:t?gates(t):null,next:t?next(t):null,opportunities:t?opps(t.id):db.opps.slice(0,15),tasks:db.tasks.filter(x=>x.status!=='done').slice(0,15),documents:t?docs(t.id):[]};try{let r=await fetch('/api/intelligence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:q,context})});if(r.ok){let j=await r.json();if(j.text){box.textContent=j.text;src.textContent='Fonte: Composer Intelligence + dados autorizados.';return}}}catch(e){}box.textContent=localCI(q,t);src.textContent='Fonte: motor operacional local; IA cloud indisponível nesta implantação.'}function localCI(q,t){if(!t)return'Cadastre ou selecione uma música.';let s=q.toLowerCase(),bs=blockers(t),g=gates(t),n=next(t);if(s.includes('bloque'))return bs.length?`Blockers de ${t.title}:\n• ${bs.join('\n• ')}\n\nPrimeiro: ${bs[0]}.`:`Sem blocker detectado. Próxima ação: ${n.title}.`;if(s.includes('direit'))return`Direitos — ${t.title}\n• Obra: ${work(t.id)}%\n• Master: ${master(t.id)}%\n• Registro: ${t.registration}\n• Documentos: ${docs(t.id).length}\n\n${bs.filter(x=>/split|registro|document|licença|IA/i.test(x)).map(x=>'• '+x).join('\n')||'Sem pendência de direitos detectada.'}`;if(s.includes('sync'))return`Sync — ${t.title}\n${g.sync.ok?'✓ Gate básico liberado':'× Gate bloqueado: '+g.sync.why}\n• Master: ${t.stage}\n• Obra/master: ${work(t.id)}%/${master(t.id)}%\n• ISRC: ${t.isrc||'ausente'}\n• Evidências: ${docs(t.id).length}`;if(s.includes('pitch'))return`Assunto: Composição disponível — ${t.title}\n\nOlá,\nSou ${db.profile.name} e gostaria de apresentar “${t.title}”, ${t.genre||'faixa'} em ${t.language||'idioma não informado'}, direcionada para ${t.objective||'oportunidades editoriais/comerciais'}.\n\nPosso enviar demo e ficha de direitos para avaliação.\n\nObrigado pela escuta.\n${db.profile.name}`;if(s.includes('tarefa')){let ex=new Set(db.tasks.map(x=>x.name));bs.forEach(b=>{let n=`${t.title} — ${b}`;if(!ex.has(n))db.tasks.push({id:id('q'),day:'Extra',name:n,status:'pending',priority:'alta',track:t.id,due:new Date().toISOString().slice(0,10),depends:[]})});save();return'Blockers transformados em tarefas extras no Plano 30 dias.'}return`Próxima ação: ${n.title}\nMotivo: ${n.why}\nRota: ${n.route}\n\nPublisher: ${g.publisher.ok?'liberado':'bloqueado — '+g.publisher.why}\nSync: ${g.sync.ok?'liberado':'bloqueado — '+g.sync.why}\nLabel/master: ${g.label.ok?'liberado':'bloqueado — '+g.label.why}`}function render(){nav();let v='';if(page==='today')v=today();else if(page==='catalog')v=catalog();else if(page==='track')v=track();else if(page==='production')v=production();else if(page==='rights')v=rights();else if(page==='docs')v=docsPage();else if(page==='plan')v=plan();else if(page==='market')v=market();else if(page==='launch')v=launch();else if(page==='revenue')v=revenue();else if(page==='reports')v=reports();else v=settings();document.getElementById('view').innerHTML=v}render();</script></body></html>
