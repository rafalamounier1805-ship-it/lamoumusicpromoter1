name: Deploy LAMOU IA Suite to Pages

on:
  push:
    branches: [main]
    paths:
      - 'suite/**'
      - '.github/workflows/lamou-suite-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload suite
        uses: actions/upload-pages-artifact@v3
        with:
          path: './suite'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
