name: Owner Console Item 9 CSS Import

on:
  push:
    branches:
      - candidate/lamou-owner-console-codex-2026-09-15

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Import polish layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('owner-console/src/styles.css')
          text = p.read_text(encoding='utf-8')
          line = '@import "./lamou-shell-polish.css";'
          if line in text:
              print('Already imported')
          else:
              needle = '@import "tw-animate-css";'
              if needle not in text:
                  raise SystemExit('Base import anchor not found')
              text = text.replace(needle, needle + '\n' + line, 1)
              p.write_text(text, encoding='utf-8')
              print('Imported')
          PY
      - name: Commit import
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner-console/src/styles.css
          git commit -m "feat(owner-console): activate shell depth and accessibility layer"
          git push
