name: Owner Console One-Time Baseline Formatter

on:
  push:
    branches:
      - candidate/lamou-owner-console-codex-2026-09-15

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'chore(owner-console): autoformat baseline') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-console
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Prettier
        run: bunx prettier --write .

      - name: Apply ESLint safe fixes
        run: bunx eslint . --fix || true

      - name: Commit mechanical formatting only
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(owner-console): autoformat baseline"
          git push
