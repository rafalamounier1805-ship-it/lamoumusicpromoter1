name: Gate 1.8 HTTP Route Smoke

on:
  push:
    branches:
      - test/gate-1-8-http-smoke-2026-09-23
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-console
    steps:
      - name: Checkout exact test branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start Cloudflare preview
        run: |
          set -euo pipefail
          echo "=== NITRO WRANGLER CONFIG ==="
          cat .output/server/wrangler.json
          nohup bunx wrangler dev --config .output/server/wrangler.json --ip 127.0.0.1 --port 4173 > /tmp/lamou-preview.log 2>&1 &
          echo $! > /tmp/lamou-preview.pid
          for i in $(seq 1 45); do
            status=$(curl -sS -o /tmp/root-body.txt -w "%{http_code}" http://127.0.0.1:4173/ || true)
            if [ "$status" != "000" ]; then
              echo "PREVIEW_READY HTTP=$status"
              exit 0
            fi
            sleep 1
          done
          echo "PREVIEW_NOT_READY"
          cat /tmp/lamou-preview.log || true
          exit 1

      - name: Smoke 7 routes
        run: |
          set -euo pipefail
          routes=(
            "/"
            "/install/owner"
            "/install/client"
            "/reset-password"
            "/owner"
            "/core"
            "/apps/orbit"
          )
          pass=0
          for route in "${routes[@]}"; do
            body="/tmp/route-body.txt"
            status=$(curl -sS -o "$body" -w "%{http_code}" "http://127.0.0.1:4173$route")
            bytes=$(wc -c < "$body" | tr -d ' ')
            echo "ROUTE $route HTTP=$status BYTES=$bytes"
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ] && [ "$bytes" -gt 0 ]; then
              pass=$((pass+1))
            else
              echo "ROUTE_FAIL $route"
              head -c 500 "$body" || true
              echo
            fi
          done
          echo "ROUTES=$pass/7"
          test "$pass" -eq 7

      - name: Security guard smoke
        run: |
          set -euo pipefail

          curl -fsS http://127.0.0.1:4173/install/owner > /tmp/public-owner.html
          grep -Fq "Seu pacote está pronto para instalar." /tmp/public-owner.html
          echo "PUBLIC /install/owner: PASS"

          curl -fsS http://127.0.0.1:4173/reset-password > /tmp/public-reset.html
          grep -Fq "Definir nova senha" /tmp/public-reset.html
          echo "PUBLIC /reset-password: PASS"

          for route in /owner /core /apps/orbit /install/client; do
            out="/tmp/protected-${route//\//_}.html"
            curl -fsS "http://127.0.0.1:4173$route" > "$out"
            grep -Fq "Verificando autorização" "$out"
            echo "GUARD $route: PASS"
          done

          ! grep -Fq "CORE PROPRIETÁRIO / OWNER" /tmp/protected-_owner.html
          ! grep -Fq "CORE PROPRIETÁRIO / OWNER" /tmp/protected-_core.html
          ! grep -Fq "CORE PROPRIETÁRIO / OWNER" /tmp/protected-_apps_orbit.html
          ! grep -Fq "Vamos preparar o ambiente deste cliente." /tmp/protected-_install_client.html
          echo "ADMIN CONTENT BEFORE AUTH: BLOCKED"

      - name: Browser hydration on Cloudflare preview
        run: |
          set -euo pipefail
          PREVIEW="https://test-gate-1-8-http-smoke-2026-09-23-lamou-ranking-ai.rafalamounier1805.workers.dev"

          for i in $(seq 1 30); do
            if curl -fsS "$PREVIEW/owner" | grep -Fq "Verificando autorização"; then
              echo "CLOUDFLARE_TEST_BRANCH_READY"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "CLOUDFLARE_TEST_BRANCH_NOT_READY"
              exit 1
            fi
            sleep 2
          done

          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "NO_BROWSER_ON_RUNNER"
            exit 1
          fi

          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=8000 --dump-dom "$PREVIEW/owner" \
            > /tmp/browser-owner.html 2>/tmp/browser-owner.err

          grep -Fq "Acesso restrito ao Proprietário" /tmp/browser-owner.html
          ! grep -Fq "CORE PROPRIETÁRIO / OWNER" /tmp/browser-owner.html
          echo "BROWSER /owner NO-SESSION GUARD: PASS"

          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=8000 --dump-dom "$PREVIEW/install/owner" \
            > /tmp/browser-install-owner.html 2>/tmp/browser-install-owner.err

          grep -Fq "Seu pacote está pronto para instalar." /tmp/browser-install-owner.html
          ! grep -Fq "This page didn't load" /tmp/browser-install-owner.html
          echo "BROWSER /install/owner PUBLIC FLOW: PASS"

      - name: Preview log
        if: always()
        run: |
          echo "=== PREVIEW LOG ==="
          cat /tmp/lamou-preview.log || true
