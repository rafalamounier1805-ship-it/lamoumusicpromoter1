name: Owner Console Complete Candidate Package

on:
  push:
    branches:
      - candidate/lamou-owner-console-codex-2026-09-15
      - candidate/lamou-core-proprietario-architecture-2026-09-20
      - candidate/lamou-ia-council-reviewed-ux-2026-09-20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: owner-console
        run: bun install --frozen-lockfile

      - name: Build portable Node package
        working-directory: owner-console
        run: bun scripts/build-portable.mjs

      - name: Build clean portable package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="_package/LAMOU_IA_COUNCIL_REVIEWED_EXECUTAVEL"
          mkdir -p "$ROOT"
          cp -a owner-console "$ROOT/"
          mkdir -p "$ROOT/docs"
          cp -a docs/owner-console-handoff "$ROOT/docs/"
          cp docs/PROMPT_MESTRE_FINALIZACAO_OWNER_2026-09-15.md "$ROOT/docs/"
          cp docs/PROMPT_MESTRE_LAMOU_REVIEWED_V2_2026-09-20.md "$ROOT/docs/"
          find "$ROOT" -type f \( -name '.env' -o -name '.env.*' \) -delete
          find "$ROOT" -type d \( -name node_modules -o -name .git \) -prune -exec rm -rf {} + || true
          test -f "$ROOT/owner-console/.output/server/index.mjs"
          printf '%s\n' \
            'LAMOU IA — Council Reviewed Executável' \
            "Branch: ${GITHUB_REF_NAME}" \
            "Commit: ${GITHUB_SHA}" \
            'State: CANDIDATE_NOT_PROMOTED' \
            'SALVAR != PROMOVER' \
            'Abra owner-console/INICIAR_WINDOWS.cmd com Node.js 22+.' \
            > "$ROOT/PACKAGE_STATE.txt"
          cd _package
          zip -r ../LAMOU_IA_COUNCIL_REVIEWED_EXECUTAVEL_2026-09-20.zip LAMOU_IA_COUNCIL_REVIEWED_EXECUTAVEL

      - name: Upload candidate package
        uses: actions/upload-artifact@v4
        with:
          name: LAMOU_IA_COUNCIL_REVIEWED_EXECUTAVEL_2026-09-20
          path: LAMOU_IA_COUNCIL_REVIEWED_EXECUTAVEL_2026-09-20.zip
          if-no-files-found: error
          retention-days: 30
