name: LAMOU Owner Official Real

on:
  push:
    branches:
      - release/lamou-owner-official-real-2026-09-17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-console
    steps:
      - name: Checkout official release
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Normalize official source
        run: |
          sed -i 's/(supabase as any)\.from/supabase.from/g' src/routes/owner.index.tsx
          sed -i 's/(result.data ?? \[\]) as Row\[\]/(result.data ?? []) as unknown as Row[]/g' src/routes/owner.index.tsx
          sed -i 's/LAMOU IA — Owner Console/LAMOU IA — Proprietário Oficial/g' src/routes/__root.tsx
          sed -i 's/LAMOU IA Central e CORE Proprietário — candidata não promovida\./LAMOU IA — Proprietário Oficial, conectado ao backend LAMOU-IA-CORE./g' src/routes/__root.tsx
          bunx prettier --write src/routes/owner.index.tsx src/routes/index.tsx src/routes/__root.tsx

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Build Node Server
        env:
          NITRO_PRESET: node-server
        run: bun run build

      - name: Verify official runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"preset": "node-server"' .output/nitro.json
          test -f .output/server/index.mjs
          HOST=127.0.0.1 PORT=4199 node .output/server/index.mjs > /tmp/lamou-owner.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4199/owner -o /tmp/owner.html; then break; fi
            sleep 1
          done
          test -s /tmp/owner.html
          grep -q 'LAMOU IA — Proprietário Oficial' /tmp/owner.html
          grep -q 'Autenticação real · LAMOU-IA-CORE' /tmp/owner.html
          if grep -q 'candidata não promovida' /tmp/owner.html; then
            echo 'Candidate metadata leaked into official owner surface'
            exit 1
          fi

      - name: Create official server package
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _official/LAMOU_IA_PROPRIETARIO_OFICIAL
          cp -a owner-console/.output _official/LAMOU_IA_PROPRIETARIO_OFICIAL/.output
          cat > _official/LAMOU_IA_PROPRIETARIO_OFICIAL/BUILD_STATE.txt <<EOF
          LAMOU IA — PROPRIETARIO OFICIAL
          Branch: release/lamou-owner-official-real-2026-09-17
          Commit: ${GITHUB_SHA}
          Owner surface: /owner
          Backend: LAMOU-IA-CORE / Supabase
          Runtime preset: node-server
          Fixtures on official surface: NONE
          Non-operational integrations: shown truthfully as NAO CONECTADO / registered state
          Generated: $(date -u +%FT%TZ)
          EOF
          cd _official
          zip -r ../LAMOU_IA_PROPRIETARIO_OFICIAL_SERVER_BUILD.zip LAMOU_IA_PROPRIETARIO_OFICIAL

      - name: Upload official build
        uses: actions/upload-artifact@v4
        with:
          name: LAMOU_IA_PROPRIETARIO_OFICIAL_SERVER_BUILD
          path: LAMOU_IA_PROPRIETARIO_OFICIAL_SERVER_BUILD.zip
          if-no-files-found: error
          retention-days: 30
