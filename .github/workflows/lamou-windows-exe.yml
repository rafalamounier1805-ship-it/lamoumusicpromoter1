name: LAMOU IA Windows EXE Candidate
# Candidate-only Windows packaging. Never promotes production.

on:
  push:
    branches:
      - candidate/lamou-ia-council-reviewed-ux-2026-09-20
    paths:
      - ".github/workflows/lamou-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install dependencies
        working-directory: owner-console
        run: bun install --frozen-lockfile

      - name: Build portable runtime
        working-directory: owner-console
        run: bun scripts/build-portable.mjs

      - name: Install traced runtime dependencies
        working-directory: owner-console/.output/server
        run: bun install --production

      - name: Prepare 7-Zip SFX executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "lamou-exe"
          $stage = Join-Path $root "stage"
          $app = Join-Path $stage "app"
          New-Item -ItemType Directory -Force -Path $app | Out-Null

          New-Item -ItemType Directory -Force -Path (Join-Path $app "owner-console") | Out-Null
          Copy-Item -Recurse -Force "owner-console/.output" (Join-Path $app "owner-console/.output")
          New-Item -ItemType Directory -Force -Path (Join-Path $app "docs") | Out-Null
          Copy-Item -Force "docs/PROMPT_MESTRE_LAMOU_REVIEWED_V2_2026-09-20.md" (Join-Path $app "docs/PROMPT_MESTRE_LAMOU_REVIEWED_V2_2026-09-20.md")

          @"
          LAMOU IA — Council Reviewed Windows Executable
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          State: CANDIDATE_NOT_PROMOTED
          SALVAR != PROMOVER
          Installation flow unchanged.
          "@ | Set-Content -Encoding UTF8 (Join-Path $app "PACKAGE_STATE.txt")

          $nodeDir = Split-Path (Get-Command node).Source
          Copy-Item -Force (Join-Path $nodeDir "node.exe") (Join-Path $stage "node.exe")
          if (Test-Path (Join-Path $nodeDir "LICENSE")) {
            Copy-Item -Force (Join-Path $nodeDir "LICENSE") (Join-Path $stage "NODE_LICENSE.txt")
          } else {
            "Node.js binary supplied by actions/setup-node. See https://github.com/nodejs/node/blob/main/LICENSE" | Set-Content -Encoding UTF8 (Join-Path $stage "NODE_LICENSE.txt")
          }

          @'
          @echo off
          setlocal EnableExtensions
          set "APPDIR=%LOCALAPPDATA%\LAMOU_IA\CouncilReviewed_2026-09-20"
          set "OWNERDIR=%APPDIR%\owner-console"
          set "URL=http://127.0.0.1:4173/owner/"

          if not exist "%APPDIR%" mkdir "%APPDIR%"
          robocopy "%~dp0app" "%APPDIR%" /E /NFL /NDL /NJH /NJS /NC /NS >nul
          if errorlevel 8 exit /b 20
          copy /Y "%~dp0node.exe" "%APPDIR%\node.exe" >nul
          copy /Y "%~dp0NODE_LICENSE.txt" "%APPDIR%\NODE_LICENSE.txt" >nul

          powershell -NoProfile -ExecutionPolicy Bypass -Command "try { Invoke-WebRequest -UseBasicParsing -Uri '%URL%' -MaximumRedirection 5 -TimeoutSec 2 | Out-Null; exit 0 } catch { exit 1 }"
          if errorlevel 1 (
            pushd "%OWNERDIR%"
            set HOST=127.0.0.1
            set PORT=4173
            start "LAMOU IA Candidate Server" /min "%APPDIR%\node.exe" ".output\server\index.mjs"
            popd
            powershell -NoProfile -ExecutionPolicy Bypass -Command "$u='%URL%'; for($i=0;$i -lt 40;$i++){ try { Invoke-WebRequest -UseBasicParsing -Uri $u -MaximumRedirection 5 -TimeoutSec 2 | Out-Null; exit 0 } catch { Start-Sleep -Milliseconds 500 } }; exit 1"
            if errorlevel 1 exit /b 21
          )

          start "" "%URL%"
          exit /b 0
          '@ | Set-Content -Encoding ASCII (Join-Path $stage "launcher.cmd")

          $seven = "C:\Program Files\7-Zip\7z.exe"
          $sfx = "C:\Program Files\7-Zip\7z.sfx"
          if (!(Test-Path $seven)) { throw "7-Zip executable not found on windows-latest." }
          if (!(Test-Path $sfx)) { throw "7-Zip SFX module not found on windows-latest." }

          $archive = Join-Path $root "payload.7z"
          Push-Location $stage
          & $seven a -t7z $archive "*" -mx=9 -mmt=on
          Pop-Location
          if (!(Test-Path $archive)) { throw "7-Zip archive was not created." }

          $config = Join-Path $root "config.txt"
          @"
          ;!@Install@!UTF-8!
          Title="LAMOU IA Council Reviewed Candidate"
          GUIMode="2"
          RunProgram="cmd.exe /c launcher.cmd"
          ;!@InstallEnd@!
          "@ | Set-Content -Encoding UTF8NoBOM $config

          $target = Join-Path $env:GITHUB_WORKSPACE "LAMOU_IA_COUNCIL_REVIEWED_WINDOWS_X64_2026-09-20.exe"
          $copyCmd = 'copy /b "' + $sfx + '"+"' + $config + '"+"' + $archive + '" "' + $target + '"'
          cmd.exe /d /c $copyCmd
          if (!(Test-Path $target)) { throw "7-Zip SFX did not create the executable." }

      - name: Verify PE executable and smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:GITHUB_WORKSPACE "LAMOU_IA_COUNCIL_REVIEWED_WINDOWS_X64_2026-09-20.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Output is not a Windows PE executable."
          }

          $p = Start-Process -FilePath $exe -ArgumentList "/Q" -PassThru
          $p.WaitForExit(30000) | Out-Null

          $ok = $false
          for ($i=0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:4173/owner/" -MaximumRedirection 5 -TimeoutSec 3
              if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 400) { $ok = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (-not $ok) { throw "Executable launched, but the LAMOU HTTP smoke test did not become ready." }

          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -eq "node.exe" -and $_.CommandLine -like "*.output\\server\\index.mjs*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: LAMOU_IA_COUNCIL_REVIEWED_WINDOWS_X64_2026-09-20
          path: LAMOU_IA_COUNCIL_REVIEWED_WINDOWS_X64_2026-09-20.exe
          if-no-files-found: error
          retention-days: 30
