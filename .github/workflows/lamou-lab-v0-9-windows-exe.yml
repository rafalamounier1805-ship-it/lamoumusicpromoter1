name: LAMOU LAB V0.9 Windows EXE Candidate

on:
  push:
    branches:
      - candidate/lamou-lab-v0-9-21-screens-evolution-2026-09-20
    paths:
      - ".github/workflows/lamou-lab-v0-9-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout LAB candidate
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install dependencies
        working-directory: owner-console
        run: bun install --frozen-lockfile

      - name: Validate LAB tests
        working-directory: owner-console
        run: bun test tests/lab-master-v0-9.test.ts

      - name: Build portable runtime
        working-directory: owner-console
        run: bun scripts/build-portable.mjs

      - name: Install traced runtime dependencies
        working-directory: owner-console/.output/server
        run: bun install --production

      - name: Build self-contained Windows launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "lamou-lab-v09-dotnet-exe"
          $payload = Join-Path $root "payload"
          $launcher = Join-Path $root "launcher"
          New-Item -ItemType Directory -Force -Path $payload, $launcher | Out-Null

          New-Item -ItemType Directory -Force -Path (Join-Path $payload "owner-console") | Out-Null
          Copy-Item -Recurse -Force "owner-console/.output" (Join-Path $payload "owner-console/.output")

          New-Item -ItemType Directory -Force -Path (Join-Path $payload "docs") | Out-Null
          Copy-Item -Force "docs/LAMOU_LAB_V0_9_EXECUTION_RECORD_2026-09-20.md" (Join-Path $payload "docs/LAMOU_LAB_V0_9_EXECUTION_RECORD_2026-09-20.md")

          $nodeDir = Split-Path (Get-Command node).Source
          if (Test-Path (Join-Path $nodeDir "LICENSE")) {
            Copy-Item -Force (Join-Path $nodeDir "LICENSE") (Join-Path $payload "NODE_LICENSE.txt")
          } else {
            Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/nodejs/node/v22.16.0/LICENSE" -OutFile (Join-Path $payload "NODE_LICENSE.txt")
          }

          @"
          LAMOU LABTEST V0.9 — Windows Executable
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          State: CANDIDATE_NOT_PROMOTED
          Canonical screens: 21
          Intelligence: Planilhão + 10→15 + Teorias + Pesquisa + Radar + Evolução
          Governance: SALVAR != PROMOVER
          HYPOTHESIS != EVIDENCE
          SYNTHETIC != REAL
          Installation / Recovery unchanged.
          "@ | Set-Content -Encoding UTF8 (Join-Path $payload "PACKAGE_STATE.txt")

          Compress-Archive -Path (Join-Path $payload "*") -DestinationPath (Join-Path $launcher "payload.zip") -CompressionLevel Optimal -Force
          Copy-Item -Force (Join-Path $nodeDir "node.exe") (Join-Path $launcher "node.exe")

          $shortSha = $env:GITHUB_SHA.Substring(0, 8)

          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <SelfContained>true</SelfContained>
              <PublishSingleFile>true</PublishSingleFile>
              <EnableCompressionInSingleFile>true</EnableCompressionInSingleFile>
              <UseWindowsForms>true</UseWindowsForms>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <AssemblyName>LAMOU_LAB_V0_9_WINDOWS_X64_2026-09-20</AssemblyName>
            </PropertyGroup>
            <ItemGroup>
              <EmbeddedResource Include="payload.zip" LogicalName="LamouLabLauncher.payload.zip" />
              <EmbeddedResource Include="node.exe" LogicalName="LamouLabLauncher.node.exe" />
            </ItemGroup>
          </Project>
          "@ | Set-Content -Encoding UTF8 (Join-Path $launcher "LamouLabLauncher.csproj")

          @"
          using System.Diagnostics;
          using System.IO.Compression;
          using System.Net;
          using System.Reflection;
          using System.Windows.Forms;

          internal static class Program
          {
              private const string Url = "http://127.0.0.1:4173/labtest/";
              private const string BuildId = "$shortSha";

              [STAThread]
              private static void Main()
              {
                  try
                  {
                      ApplicationConfiguration.Initialize();
                      var appRoot = Path.Combine(
                          Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
                          "LAMOU_LAB",
                          "V0_9_" + BuildId
                      );
                      Directory.CreateDirectory(appRoot);

                      var nodePath = Path.Combine(appRoot, "node.exe");
                      var payloadZip = Path.Combine(appRoot, "payload.zip");
                      ExtractResource("LamouLabLauncher.node.exe", nodePath);
                      ExtractResource("LamouLabLauncher.payload.zip", payloadZip);
                      ZipFile.ExtractToDirectory(payloadZip, appRoot, overwriteFiles: true);
                      File.Delete(payloadZip);

                      var ownerDir = Path.Combine(appRoot, "owner-console");
                      var serverEntry = Path.Combine(ownerDir, ".output", "server", "index.mjs");
                      if (!File.Exists(serverEntry))
                          throw new FileNotFoundException("Build do servidor LAMOU LAB não encontrada.", serverEntry);

                      if (!IsReadyAsync().GetAwaiter().GetResult())
                      {
                          var psi = new ProcessStartInfo
                          {
                              FileName = nodePath,
                              Arguments = Quote(serverEntry),
                              WorkingDirectory = ownerDir,
                              UseShellExecute = false,
                              CreateNoWindow = true,
                              WindowStyle = ProcessWindowStyle.Hidden,
                          };
                          psi.Environment["HOST"] = "127.0.0.1";
                          psi.Environment["PORT"] = "4173";
                          Process.Start(psi);

                          var ready = WaitUntilReadyAsync(TimeSpan.FromSeconds(35)).GetAwaiter().GetResult();
                          if (!ready)
                              throw new InvalidOperationException("O servidor local do LAMOU LAB não respondeu na porta 4173.");
                      }

                      if (!string.Equals(Environment.GetEnvironmentVariable("LAMOU_NO_BROWSER"), "1", StringComparison.Ordinal))
                      {
                          Process.Start(new ProcessStartInfo(Url) { UseShellExecute = true });
                      }
                  }
                  catch (Exception ex)
                  {
                      MessageBox.Show(
                          "Não foi possível iniciar o LAMOU LAB.\n\n" + ex.Message,
                          "LAMOU LAB V0.9 — Candidate",
                          MessageBoxButtons.OK,
                          MessageBoxIcon.Error
                      );
                      Environment.ExitCode = 1;
                  }
              }

              private static string Quote(string value) => "\"" + value.Replace("\"", "\\\"") + "\"";

              private static void ExtractResource(string resourceName, string destination)
              {
                  using var source = Assembly.GetExecutingAssembly().GetManifestResourceStream(resourceName)
                      ?? throw new InvalidOperationException("Recurso embutido ausente: " + resourceName);
                  using var target = new FileStream(destination, FileMode.Create, FileAccess.Write, FileShare.None);
                  source.CopyTo(target);
              }

              private static async Task<bool> IsReadyAsync()
              {
                  try
                  {
                      using var handler = new HttpClientHandler { AllowAutoRedirect = true };
                      using var client = new HttpClient(handler) { Timeout = TimeSpan.FromSeconds(2) };
                      using var response = await client.GetAsync(Url);
                      return response.StatusCode >= HttpStatusCode.OK && (int)response.StatusCode < 500;
                  }
                  catch
                  {
                      return false;
                  }
              }

              private static async Task<bool> WaitUntilReadyAsync(TimeSpan timeout)
              {
                  var started = DateTime.UtcNow;
                  while (DateTime.UtcNow - started < timeout)
                  {
                      if (await IsReadyAsync()) return true;
                      await Task.Delay(500);
                  }
                  return false;
              }
          }
          "@ | Set-Content -Encoding UTF8 (Join-Path $launcher "Program.cs")

          Push-Location $launcher
          dotnet publish "LamouLabLauncher.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          Pop-Location

          $published = Join-Path $launcher "bin\Release\net8.0-windows\win-x64\publish\LAMOU_LAB_V0_9_WINDOWS_X64_2026-09-20.exe"
          $target = Join-Path $env:GITHUB_WORKSPACE "LAMOU_LAB_V0_9_WINDOWS_X64_2026-09-20.exe"
          if (!(Test-Path $published)) { throw "dotnet publish did not create the LAB executable." }
          Copy-Item -Force $published $target

      - name: Verify PE executable and LAB smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:GITHUB_WORKSPACE "LAMOU_LAB_V0_9_WINDOWS_X64_2026-09-20.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Output is not a Windows PE executable."
          }

          $env:LAMOU_NO_BROWSER = "1"
          $p = Start-Process -FilePath $exe -PassThru
          $p.WaitForExit(45000) | Out-Null
          if ($p.ExitCode -ne 0) { throw "LAB executable launcher returned exit code $($p.ExitCode)." }

          $routes = @(
            "http://127.0.0.1:4173/labtest/",
            "http://127.0.0.1:4173/labtest/next"
          )

          foreach ($url in $routes) {
            $ok = $false
            for ($i=0; $i -lt 40; $i++) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri $url -MaximumRedirection 5 -TimeoutSec 3
                if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 400 -and $r.Content.Length -gt 100) {
                  $ok = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ok) { throw "LAB smoke test failed for $url" }
          }

          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -eq "node.exe" -and $_.CommandLine -like "*.output\server\index.mjs*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Create source package
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "LAMOU_LAB_V0_9_CANDIDATE_COMPLETO_2026-09-20"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -Recurse -Force "owner-console" (Join-Path $root "owner-console")
          New-Item -ItemType Directory -Force -Path (Join-Path $root "docs") | Out-Null
          Copy-Item -Force "docs/LAMOU_LAB_V0_9_EXECUTION_RECORD_2026-09-20.md" (Join-Path $root "docs/LAMOU_LAB_V0_9_EXECUTION_RECORD_2026-09-20.md")
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $root "owner-console\node_modules")
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $root "owner-console\.git")
          Compress-Archive -Path $root -DestinationPath "LAMOU_LAB_V0_9_CANDIDATE_COMPLETO_2026-09-20.zip" -CompressionLevel Optimal -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: LAMOU_LAB_V0_9_WINDOWS_X64_2026-09-20
          path: LAMOU_LAB_V0_9_WINDOWS_X64_2026-09-20.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: LAMOU_LAB_V0_9_CANDIDATE_COMPLETO_2026-09-20
          path: LAMOU_LAB_V0_9_CANDIDATE_COMPLETO_2026-09-20.zip
          if-no-files-found: error
          retention-days: 30
