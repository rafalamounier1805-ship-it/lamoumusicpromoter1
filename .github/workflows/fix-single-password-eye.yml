name: Fix single password eye

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-single-password-eye.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch password reveal UX
        shell: bash
        run: |
          cat >> suite/product-home.js <<'EOF'

/* CORE 2.1.2 — single reveal control on password setup */
(function singlePasswordEye(){
  const p1=document.querySelector('#setupPassword');
  const p2=document.querySelector('#setupPassword2');
  const login=document.querySelector('#loginPassword');
  if(p2){
    const wrap=p2.closest('.pw-wrap');
    if(wrap){
      const eye=wrap.querySelector('.pw-eye');
      eye?.remove();
      if(wrap.parentNode){wrap.parentNode.insertBefore(p2,wrap);wrap.remove();}
    }
  }
  const setupEye=p1?.closest('.pw-wrap')?.querySelector('.pw-eye');
  if(setupEye){
    setupEye.setAttribute('aria-label','Mostrar senhas');
    setupEye.onclick=()=>{
      const show=p1.type==='password';
      p1.type=show?'text':'password';
      if(p2)p2.type=show?'text':'password';
      setupEye.textContent=show?'🙈':'👁';
      setupEye.setAttribute('aria-label',show?'Ocultar senhas':'Mostrar senhas');
    };
  }
  const loginEyes=login?.closest('.pw-wrap')?.querySelectorAll('.pw-eye');
  if(loginEyes&&loginEyes.length>1)[...loginEyes].slice(1).forEach(x=>x.remove());
})();
EOF
      - name: Commit fix
        run: |
          git config user.name "lamou-automation"
          git config user.email "actions@users.noreply.github.com"
          git add suite/product-home.js
          git commit -m "fix(auth): use a single password reveal control" || exit 0
          git push
