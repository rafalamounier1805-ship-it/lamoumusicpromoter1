name: Owner Console Item 8 Route Fix

on:
  push:
    branches:
      - candidate/lamou-owner-console-codex-2026-09-15

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Patch canonical CORE settings destination
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('owner-console/src/components/lamou/wizard.tsx')
          text = p.read_text(encoding='utf-8')
          needle = '    | "/core/tests"\n    | "/core/observability"\n    | "/labtest";'
          replacement = '    | "/core/tests"\n    | "/core/observability"\n    | "/core/settings"\n    | "/labtest";'
          if replacement in text:
              print('Already patched')
          elif needle in text:
              p.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
              print('Patched')
          else:
              raise SystemExit('Expected route union not found')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner-console/src/components/lamou/wizard.tsx
          git commit -m "fix(owner-console): allow canonical CORE settings destination"
          git push
