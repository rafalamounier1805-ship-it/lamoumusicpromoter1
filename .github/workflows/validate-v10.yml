name: Validate LAMOU Runtime
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check submissions-standalone-v152.js
          node --check sw.js
          node --check backend/worker-entry-v15.js
          node --check backend/schema-v10.js
          node --check tests/smoke-reach.mjs
      - name: Check simple production entrypoint
        run: |
          grep -q 'submissions-standalone-v152.js?v=160' index.html
          grep -q 'submissions-v15.css?v=160' index.html
          ! grep -q 'app-core.js' index.html
          ! grep -q 'integrations-v10.js' index.html
          ! grep -q 'runtime-v13.js' index.html
          ! grep -q 'runtime-v14.js' index.html
          ! grep -q 'workflow.css' index.html
          ! grep -q 'lamou-v10.js' index.html
          grep -q 'backend/worker-entry-v15.js' wrangler.jsonc
          grep -q 'lamou-dashboard-v160' sw.js
          test -f .assetsignore
          grep -q '^backend$' .assetsignore
          grep -q '^wrangler.jsonc$' .assetsignore
      - name: Run workflow smoke test
        run: node tests/smoke-reach.mjs
