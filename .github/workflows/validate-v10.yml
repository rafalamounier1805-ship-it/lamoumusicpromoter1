name: Validate LAMOU Spotify Workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check shell-v10.js
          node --check app.js
          node --check integrations-v10.js
          node --check sw.js
          node --check backend/worker-v10.js
          node --check backend/worker-entry-reach.js
          node --check backend/schema-v10.js
          node --check tests/smoke-reach.mjs
      - name: Check clean entrypoint
        run: |
          grep -q 'app.js' index.html
          grep -q 'workflow.css' index.html
          grep -q 'integrations-v10.js' index.html
          ! grep -q 'lamou-v10.js' index.html
          ! grep -q 'bootstrap-v11.js' index.html
          ! grep -q 'migration-v11.js' index.html
          ! grep -q 'stability-v12.js' index.html
          ! grep -q 'ui-polish-v12.js' index.html
          grep -q 'backend/worker-entry-reach.js' wrangler.jsonc
          grep -q 'lamou-spotify-workflow-v3' sw.js
      - name: Run workflow smoke test
        run: node tests/smoke-reach.mjs
