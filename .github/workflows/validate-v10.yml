name: Validate LAMOU Runtime
on:
  push:
    branches: [main, fix/submissions-only-v15-1b]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app-core.js
          node --check integrations-v10.js
          node --check runtime-v13.js
          node --check submissions-only-v151.js
          node --check sw.js
          node --check backend/worker-entry-v15.js
          node --check backend/schema-v10.js
          node --check tests/smoke-reach.mjs
      - name: Check submissions-only production entrypoint
        run: |
          grep -q 'app-core.js?v=151' index.html
          grep -q 'runtime-v13.js?v=151' index.html
          grep -q 'submissions-only-v151.js?v=151' index.html
          grep -q 'submissions-v15.css?v=151' index.html
          ! grep -q 'runtime-v14.js' index.html
          ! grep -q 'workflow.css' index.html
          ! grep -q 'shell-v10.js' index.html
          ! grep -q 'app.js' index.html
          ! grep -q 'lamou-v10.js' index.html
          grep -q 'backend/worker-entry-v15.js' wrangler.jsonc
          grep -q 'lamou-runtime-v151' sw.js
          test -f .assetsignore
          grep -q '^backend$' .assetsignore
          grep -q '^wrangler.jsonc$' .assetsignore
      - name: Run workflow smoke test
        run: node tests/smoke-reach.mjs
