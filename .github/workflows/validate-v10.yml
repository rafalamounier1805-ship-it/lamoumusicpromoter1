name: Validate LAMOU Clean Core
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app-core.js
          node --check integrations-v10.js
          node --check sw.js
          node --check backend/worker-v10.js
          node --check backend/worker-entry-reach.js
          node --check backend/worker-entry-app.js
          node --check backend/schema-v10.js
          node --check tests/smoke-reach.mjs
      - name: Check clean entrypoint
        run: |
          grep -q 'app-core.js' index.html
          grep -q 'app-core.css' index.html
          grep -q 'integrations-v10.js' index.html
          ! grep -q 'shell-v10.js' index.html
          ! grep -q 'app.js' index.html
          ! grep -q 'lamou-v10.js' index.html
          grep -q 'backend/worker-entry-app.js' wrangler.jsonc
          grep -q 'lamou-clean-core-ranking-v4' sw.js
      - name: Run workflow smoke test
        run: node tests/smoke-reach.mjs
