name: Owner Console Candidate Gate
on:
  pull_request:
    paths:
      - "owner-console/**"
      - ".github/workflows/owner-console-candidate.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-console
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run lint
      - run: bun run build
      - name: Package validated candidate
        run: |
          mkdir -p ../release
          tar -czf ../release/LAMOU_OWNER_CONSOLE_CLIENT_RC.tgz .output public README.md INICIAR_WINDOWS.cmd
          sha256sum ../release/LAMOU_OWNER_CONSOLE_CLIENT_RC.tgz > ../release/SHA256SUMS.txt

      - name: Package total reconciled candidate
        working-directory: .
        run: |
          mkdir -p release/total
          cp release/LAMOU_OWNER_CONSOLE_CLIENT_RC.tgz release/total/
          cp release/SHA256SUMS.txt release/total/CLIENT_SHA256SUMS.txt
          tar             --exclude=.git             --exclude='**/node_modules'             --exclude='owner-console/.output'             --exclude='release'             -czf release/total/LAMOU_TOTAL_SOURCE_CANDIDATE.tgz .
          sha256sum release/total/LAMOU_TOTAL_SOURCE_CANDIDATE.tgz > release/total/TOTAL_SOURCE_SHA256SUMS.txt
          cat > release/total/PACKAGE_STATE.txt <<'EOF'
          LAMOU TOTAL CANDIDATE — 2026-09-23
          State: CANDIDATE_NOT_PROMOTED
          Branch: candidate/lamou-owner-architecture-reconcile-2026-09-23
          Includes: repository source, Owner Console source, documentation, workflows, CORE files, tests, metrics, handoff/architecture reconciliation, validated client runtime package.
          Rule: SALVAR != PROMOVER
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: LAMOU_OWNER_CONSOLE_CLIENT_RC
          path: release/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: LAMOU_TOTAL_CANDIDATA_RECONCILIADA
          path: release/total/
          retention-days: 14
