name: Legacy root Pages (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: legacy-root-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages-legacy
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload legacy root artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy legacy root
        id: deployment
        uses: actions/deploy-pages@v4
