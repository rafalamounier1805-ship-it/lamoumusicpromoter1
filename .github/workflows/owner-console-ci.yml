name: Owner Console Candidate CI

on:
  push:
    branches:
      - candidate/lamou-owner-console-codex-2026-09-15
      - candidate/lamou-core-proprietario-architecture-2026-09-20
      - candidate/lamou-ia-council-reviewed-ux-2026-09-20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-console
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test

      - name: CORE Cubo Benchmark
        run: bun scripts/run-core-cube-benchmark.ts

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
