name: Owner Console Candidate CI

on:
  push:
    branches:
      - candidate/lamou-owner-console-codex-2026-09-15
      - candidate/lamou-core-proprietario-architecture-2026-09-20
      - candidate/lamou-ia-council-reviewed-ux-2026-09-20
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-console
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format council-reviewed additions
        run: |
          bunx prettier --write src/components/lamou/council-reviewed-overview.tsx src/lib/lamou/page-execution-profile.ts src/lib/lamou/prompt-review.ts src/lib/lamou/council-data.ts src/lib/lamou/activity-persona-router.ts src/routes/owner.index.tsx tests/prompt-review.test.ts

      - name: Persist formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/lamou/council-reviewed-overview.tsx src/lib/lamou/page-execution-profile.ts src/lib/lamou/prompt-review.ts src/lib/lamou/council-data.ts src/lib/lamou/activity-persona-router.ts src/routes/owner.index.tsx tests/prompt-review.test.ts
            git commit -m "style(owner): format council-reviewed candidate"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test

      - name: CORE Cubo Benchmark
        run: bun scripts/run-core-cube-benchmark.ts

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
