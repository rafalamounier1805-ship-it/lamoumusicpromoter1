name: Owner Console Candidate CI

on:
  push:
    branches:
      - candidate/lamou-owner-console-codex-2026-09-15
      - candidate/lamou-core-proprietario-architecture-2026-09-20
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-console
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format candidate additions
        run: |
          bunx prettier --write src/components/lamou/core-owner-workspace.tsx tests/core-menu.test.ts src/routes/core.index.tsx src/routes/core.mapa-vivo.tsx src/routes/core.execution.tsx src/routes/core.products.tsx src/routes/core.cases.tsx src/routes/core.radar.tsx src/routes/core.documents.tsx src/routes/core.lifecycle.tsx src/routes/core.governance.tsx src/routes/core.settings.tsx

      - name: Persist formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/lamou/core-owner-workspace.tsx tests/core-menu.test.ts src/routes/core*.tsx
            git commit -m "style(core): format proprietor architecture"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test

      - name: CORE Cubo Benchmark
        run: bun scripts/run-core-cube-benchmark.ts

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
